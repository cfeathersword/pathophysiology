<head>

<title>Interactive Study App</title>
<style>
:root{--bg:#0f1020;--panel:#15192e;--card:#1b2242;--text:#f6f7ff;--muted:#b6c0e8;--accent:#8b5cf6;--accent2:#22c55e;--danger:#ef4444;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,#2b1b5a 0%,#111831 42%,#08111f 100%);color:var(--text)}
header{padding:24px 18px;background:linear-gradient(90deg,rgba(69,39,160,.85),rgba(15,23,42,.9));position:sticky;top:0;border-bottom:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);z-index:10}
h1{margin:0 0 8px;font-size:24px} .sub{color:var(--muted);font-size:14px}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 78px)}
nav{padding:16px;border-right:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
button,select,input{font:inherit} button{color:inherit} .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#111b3a,#0b1228);color:var(--text);outline:none;margin-bottom:12px}
.topic{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer}
.topic.active{outline:2px solid #f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)} main{padding:18px;display:grid;gap:16px;grid-template-columns:1.2fr .8fr}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.card h2,.card h3{margin-top:0} .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(34,197,94,.18));color:#ffffff;font-size:12px;margin:4px 6px 0 0}
.list{padding-left:18px;margin:10px 0 0} .muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .quiz-q{font-weight:600;margin-bottom:10px} .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#111b3a,#0b1228);color:var(--text);cursor:pointer}
.opt.good{border-color:rgba(34,197,94,.9);background:rgba(34,197,94,.18)} .opt.bad{border-color:rgba(239,68,68,.9);background:rgba(255,123,123,.15)}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:18px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,197,94,.14));border:1px solid rgba(255,255,255,.12)} .controls{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)} .score{font-size:18px;font-weight:700;color:#22c55e}

body[data-cat='Inflammation'] .card h2, body[data-cat='Inflammation'] .card h3{color:#fed7aa}
body[data-cat='Blood'] .card h2, body[data-cat='Blood'] .card h3{color:#fecdd3}
body[data-cat='Respiratory'] .card h2, body[data-cat='Respiratory'] .card h3{color:#bbf7d0}
body[data-cat='GI'] .card h2, body[data-cat='GI'] .card h3{color:#fde68a}

body[data-cat='Endocrine'] .card h2, body[data-cat='Endocrine'] .card h3{color:#a5f3fc}
body[data-cat='Reproductive'] .card{border-top:4px solid #be185d}
body[data-cat='Reproductive'] .card h2, body[data-cat='Reproductive'] .card h3{color:#fbcfe8}

body[data-cat='CNS'] .pill{background:rgba(124,58,237,.28)}

body[data-cat='Renal'] .pill{background:rgba(14,165,165,.24)}
body[data-cat='Inflammation'] .pill{background:rgba(249,115,22,.26)}
body[data-cat='Blood'] .pill{background:rgba(225,29,72,.26)}
body[data-cat='Respiratory'] .pill{background:rgba(22,163,74,.26)}
body[data-cat='GI'] .pill{background:rgba(180,83,9,.26)}
body[data-cat='Endocrine'] .pill{background:rgba(8,145,178,.28)}

<body>
<header>
  <h1>Interactive Study App</h1>
  <div class="sub">Browse topics, test yourself with quizzes, and review flashcards from the lecture notes.</div>
</header>
<div class="wrap">
  <nav>
    <input id="search" class="search" placeholder="Search topics..." />
    <div class="tabs" id="tabs"></div>
    <div id="topics"></div>
  </nav>
  <main id='mainArea'>
    <section class="card" id="content" style="grid-column:1/-1"></section>
    <section class="card" style="grid-column:1/-1">
      <h3>Quick Quiz</h3>
      <div id="quiz"></div>
      <div class="controls" style="margin-top:12px">
        <button class="topic" id="checkQuiz" style="width:auto;display:inline-block">Check answer</button>
        <button class="topic" id="nextQuiz" style="width:auto;display:inline-block">Next question</button>
      </div>
      <p class="score" id="quizScore">Score: 0 / 0</p>
      <p class="small" id="quizFeedback"></p>
    </section>
  </main>
</div>

<script>
const topics = [
 // ── CNS ──────────────────────────────────────────────────────────────────────
 {category:'CNS', id:'tbi', name:'Traumatic Brain Injury & ICP', tags:['TBI','ICP','head injury'], summary:'Traumatic brain injury ranges from mild bruising to severe injury, and raised ICP can develop from swelling, bleeding, or hypoxia.', fields:{definition:'Traumatic brain injury ranges from mild bruising to severe injury. Raised ICP is pressure from CSF, brain tissue, and blood.', mechanism:'Primary injury occurs at impact; secondary injury develops from inflammation, bleeding, oedema, hypoxia, and hypotension.', manifestations:'Decreased LOC, headache, sluggish pupils, visual disturbance, abnormal breathing, impaired motor response, bradycardia, rising systolic BP, falling diastolic BP, high temperature.', comparisons:'Primary trauma is direct impact injury; secondary trauma is delayed injury from swelling, bleeding, or reduced oxygen supply.', types:'Coup injury, contrecoup injury, raised intracranial pressure.', risk:'Traffic accidents, falls, sporting accidents, violence.', diagnosis:'Neurological assessment, pupil size and reactivity, vital signs, limb movement.', treatment:'Oxygen therapy, IV fluids, catheterization, blood glucose management, anticonvulsants, feeding support, hypertonic solutions.', drugs:'Anticonvulsants, hypertonic solutions, oxygen therapy.'}, flash:[['Coup injury','Brain injury at the point of impact'],['Contrecoup injury','Injury opposite the impact'],['Raised ICP','Pressure from CSF, brain tissue, and blood'],['One management step','Neuro checks and vital signs']]},
 {category:'CNS', id:'stroke', name:'Stroke & TIA', tags:['stroke','TIA','cva'], summary:'Stroke is impaired blood flow to the brain. TIA is a brief interruption of blood supply that resolves quickly.', fields:{definition:'Stroke is impaired blood flow to the brain caused by vessel occlusion or haemorrhage. TIA is a brief interruption of blood flow with symptoms usually resolving within about 24 hours.', mechanism:'Ischaemic stroke occurs from blockage; haemorrhagic stroke occurs from vessel rupture and bleeding.', manifestations:'One-sided weakness, language impairment, visual field loss, poor judgement, depression, headache, focal neurological deficits.', comparisons:'Ischaemic stroke is more common and caused by blocked flow. Haemorrhagic stroke is less common but has more secondary injury and higher mortality.', types:'Ischaemic stroke, haemorrhagic stroke, TIA.', risk:'Smoking, obesity, heart disease, hyperlipidaemia, diabetes, hypertension, dyslipidaemia, sedentary lifestyle, alcohol, family history.', diagnosis:'Physical and neurological assessment, NIHSS, CT scan, MRI scan, carotid duplex, cerebral angiography, blood tests, coagulation profile.', treatment:'Ischaemic stroke: thrombolysis as early as possible. Haemorrhagic stroke: craniotomy, clot evacuation, aneurysm clipping, endovascular embolization, ventriculostomy, osmotic diuretics.', drugs:'Thrombolytics, osmotic diuretics, supportive medicines.'}, flash:[['TIA','Brief interruption of brain blood supply'],['Ischaemic stroke','Blocked cerebral artery'],['Haemorrhagic stroke','Bleeding in or around the brain'],['Common risk factor','Hypertension']]},
 {category:'CNS', id:'parkinson', name:'Parkinson Disease', tags:['parkinson','pd'], summary:'Parkinson disease is a progressive neurodegenerative disorder caused by loss of dopaminergic neurons in the nigrostriatal pathway.', fields:{definition:'Parkinson disease is a progressive neurodegenerative disorder with loss of dopaminergic neurons in the nigrostriatal pathway.', mechanism:'Basal ganglia dysfunction occurs as dopamine-producing neurons die; Lewy bodies are often present.', manifestations:'Tremor at rest, rigidity, akinesia/bradykinesia, postural instability, shuffling gait, flexed posture, freezing, drooling, reduced facial expression, constipation, orthostatic hypotension, sleep problems, depression, anxiety, dementia.', comparisons:'Motor symptoms are the classic features; non-motor symptoms include autonomic, sensory, cognitive, and behavioural changes.', types:'Akinetic movement disorder.', risk:'Age, gender, inheritance, pesticides and herbicides, head trauma, brain tumour, neurotoxic chemicals.', diagnosis:'History, physical examination, brain imaging, olfactory testing.', treatment:'Education, daily exercise, nutritional support, deep brain stimulation.', drugs:'Muscarinic agents, L-dopa, dopamine agonists, MAO-B inhibitors, peripheral decarboxylase inhibitors.'}, flash:[['TRAP','Tremor, Rigidity, Akinesia, Postural instability'],['Main neurotransmitter lost','Dopamine'],['Lewy body protein','Alpha-synuclein'],['A motor symptom','Shuffling gait']]},
 {category:'CNS', id:'ad', name:'Alzheimer Disease & Dementia', tags:['alzheimer','dementia','ad'], summary:'Dementia is progressive and irreversible, and Alzheimer disease is the most common type.', fields:{definition:'Dementia is progressive, irreversible cerebral dysfunction. Alzheimer disease is a common type of dementia.', mechanism:'Neuronal loss, beta-amyloid plaques, and neurofibrillary tangles drive cognitive decline.', manifestations:'Forgetfulness, poor recall, confusion, loss of concentration, disorientation, irritability, agitation, mood swings, anxiety, depression, personality changes, inability to recognise family, loss of daily skills.', comparisons:'Early disease mainly affects memory and new learning; advanced disease causes total dependence.', types:'Alzheimer disease is a common form of dementia.', risk:'Age over 65, smoking, alcohol, cerebrovascular disease, diabetes, obesity, APP, PSEN1, PSEN2, and ApoE-related genes.', diagnosis:'History, brain imaging, olfactory testing.', treatment:'Support for the person and carers, depression management, cognitive support.', drugs:'Acetylcholinesterase inhibitors, NMDA antagonists, SSRIs.'}, flash:[['Beta-amyloid','Forms extracellular plaques'],['Tau protein','Forms neurofibrillary tangles'],['First common sign','Forgetfulness'],['Memantine class','NMDA antagonist']]},
 {category:'CNS', id:'ms', name:'Multiple Sclerosis', tags:['multiple sclerosis','ms'], summary:'Multiple sclerosis is a demyelinating disorder affecting the brain, spinal cord, and cranial nerves.', fields:{definition:'Multiple sclerosis is a chronic degenerative disease caused by demyelination in the brain, spinal cord, and cranial nerves.', mechanism:'Loss of myelin in white matter blocks nerve conduction and causes inflammatory plaques.', manifestations:'Muscular weakness, heaviness in the legs, speech difficulty, numbness, vision defects, bladder and bowel dysfunction, sexual dysfunction, fatigue, depression, short-term memory loss.', comparisons:'It is progressive but may relapse and remit between exacerbations.', types:'Chronic autoimmune demyelinating disorder.', risk:'Viruses, toxins, UV rays, autoimmune processes.', diagnosis:'Neurological history, physical examination, elevated CSF IgG, optic nerve conduction testing, brain imaging.', treatment:'Multidisciplinary care, symptom management, bowel and bladder support, depression support.', drugs:'Baclofen, diazepam, oxybutynin, fluoxetine, amitriptyline, imipramine, stool softeners, laxatives.'}, flash:[['Main pathology','Demyelination'],['Common symptom','Visual disturbance'],['CSF finding','Persistently elevated IgG'],['Spasticity drug','Baclofen']]},
 {category:'CNS', id:'epilepsy', name:'Epilepsy', tags:['epilepsy','seizure'], summary:'Epilepsy is a group of disorders caused by abnormal electrical discharge in the brain.', fields:{definition:'Epilepsy is a range of conditions caused by abnormal electrical discharge in the brain.', mechanism:'Seizures result from abnormal neuronal firing; status epilepticus is prolonged or repeated seizure activity.', manifestations:'Tonic and clonic phases, staring, brief jerks, stiff body movements, loss of consciousness in many seizure types, confusion in complex partial seizures.', comparisons:'Partial seizures involve part of the brain; generalised seizures involve both hemispheres and usually cause unconsciousness.', types:'Partial, generalised, absence, myoclonic, tonic-clonic, atonic, unclassified, status epilepticus.', risk:'Prolonged seizures can be life-threatening.', diagnosis:'Clinical history and seizure classification by onset and pattern.', treatment:'Maintain airway, provide oxygen, protect from injury, administer prescribed medication during status epilepticus, consider surgery in selected cases.', drugs:'Carbamazepine, sodium valproate, phenytoin, diazepam.'}, flash:[['Partial seizure','Involves part of the brain'],['Generalised seizure','Involves both hemispheres'],['Status epilepticus','Repeated or prolonged seizure activity'],['Common drug','Sodium valproate']]},
 // ── CVS ──────────────────────────────────────────────────────────────────────
 {category:'CVS', id:'mi', name:'Myocardial Infarction & Angina', tags:['mi','angina','heart attack'], summary:'Myocardial infarction is prolonged coronary occlusion causing necrosis, while angina is transient ischaemic chest pain.', fields:{definition:'Myocardial infarction is prolonged coronary occlusion causing irreversible necrosis. Angina is chest pain from myocardial ischaemia.', mechanism:'Reduced coronary blood flow lowers oxygen supply; prolonged deprivation causes myocardial cell death.', manifestations:'Severe crushing chest pain, radiation to arm/neck/jaw, nausea, vomiting, fatigue, sweating, pallor, shortness of breath, palpitations, impending doom.', comparisons:'STEMI is transmural with ST elevation; NSTEMI is non-transmural and does not traverse the full wall.', types:'STEMI, NSTEMI, stable angina, unstable angina, variant angina.', risk:'Atherosclerosis, smoking, hypertension, diabetes, obesity, inactivity, alcohol, cocaine, age, family history.', diagnosis:'ECG, chest X-ray, blood chemistry, angiogram, echocardiogram, exercise ECG, myocardial perfusion scan, stress echocardiography, coronary arteriography.', treatment:'Oxygen, pain relief, nitrates, beta blockers, aspirin, heparin, ACE inhibitors, lifestyle and risk-factor control.', drugs:'Vasodilators, beta blockers, platelet inhibitors, antithrombins, ACE inhibitors.'}, flash:[['STEMI','Transmural infarction with ST elevation'],['NSTEMI','Non-transmural infarction'],['Stable angina','Improves with rest'],['Common pain description','Crushing substernal pain']]},
 {category:'CVS', id:'hf', name:'Heart Failure & Cardiogenic Shock', tags:['heart failure','shock','hf'], summary:'Heart failure is pump failure, and cardiogenic shock is severe failure with poor perfusion.', fields:{definition:'Heart failure is the heart\'s inability to meet body demands. Cardiogenic shock is severe pump failure causing inadequate tissue perfusion.', mechanism:'Reduced contractility or abnormal relaxation lowers cardiac output; shock develops when myocardial damage is severe.', manifestations:'Shortness of breath, cough or wheeze, oedema, fatigue, light-headedness, nausea, confusion, high heart rate; shock adds severe hypotension, oliguria, cold skin, raised JVP, chest pain, dyspnoea, sweating.', comparisons:'Left HF causes pulmonary oedema; right HF causes peripheral oedema and systemic venous congestion.', types:'Left heart failure, right heart failure, cardiogenic shock.', risk:'Coronary heart disease, previous MI, high blood pressure, congenital defects, cardiomyopathy, valvular disease, myocarditis, valve regurgitation.', diagnosis:'Chest X-ray, ECG, ABGs, blood chemistry, troponins, echocardiogram, cardiac perfusion scan.', treatment:'Oxygen, reduced sodium diet, laxatives, daily weight monitoring, fluid restriction, education, diuretics, anticoagulants, anti-arrhythmics, inotropes.', drugs:'ACE inhibitors, selected beta blockers, diuretics, anticoagulants, anti-arrhythmics, furosemide, milrinone, dobutamine.'}, flash:[['Left HF','Pulmonary oedema'],['Right HF','Peripheral oedema'],['Cardiogenic shock','Inadequate tissue perfusion from pump failure'],['Daily self-care','Daily weight monitoring']]},
 {category:'CVS', id:'vascular', name:'Hypertension, Atherosclerosis, Aneurysm, DVT', tags:['hypertension','atherosclerosis','aneurysm','dvt'], summary:'Vascular disorders include high blood pressure, plaque disease, vessel dilation, and venous thrombosis.', fields:{definition:'Hypertension is sustained high arterial pressure. Atherosclerosis is plaque formation in arteries. Aneurysm is permanent dilatation of a vessel. DVT is thrombus formation in veins without inflammation.', mechanism:'Hypertension damages vessel walls; atherosclerosis forms fibro-fatty plaques; aneurysm develops from wall weakness; DVT forms from stasis, hypercoagulability, and vessel injury.', manifestations:'Hypertension may be silent or cause headache, dizziness, nosebleeds, fatigue, blurred vision, tinnitus. Atherosclerosis can cause diminished pulses, pallor, cyanosis, pain, weakness. DVT can cause aching limb pain, oedema, cyanosis, redness, warmth, and dilated veins.', comparisons:'Primary hypertension is common and linked to RAAS dysregulation, while secondary hypertension has an identifiable cause.', types:'Primary, secondary, malignant, isolated systolic hypertension; true and dissecting aneurysms; varicose veins; thrombophlebitis; DVT; arterial and venous insufficiency.', risk:'Hypertension: obesity, stress, smoking, excess sodium, family history. Atherosclerosis: hypercholesterolaemia, age, inflammation, smoking, hypertension, sedentary lifestyle. Aneurysm: atherosclerosis, infection, hypertension, cystic medial degeneration. DVT: stasis, hypercoagulability, age, obesity, pregnancy, varicose veins, smoking.', diagnosis:'Aneurysm: angiography, blood chemistry, chest X-ray, ultrasound. DVT and PVD: Doppler ultrasound, arteriogram, venogram, physical examination, ECG, blood chemistry.', treatment:'Hypertension care includes sodium reduction, weight loss, exercise, smoking cessation. Atherosclerosis care includes diet, BP and cholesterol control. DVT care includes anticoagulation, hydration, exercise, and avoiding immobility.', drugs:'Antihypertensives, anticoagulants, lipid-lowering drugs, antiplatelet drugs, vasodilators, anti-inflammatory drugs, thrombolytics.'}, flash:[['Atherosclerosis','Fibro-fatty plaque disease'],['DVT','Deep vein thrombosis'],['Hypertension','Sustained high arterial pressure'],['One prevention step','Exercise and smoking cessation']]},
 // ── Renal ─────────────────────────────────────────────────────────────────────
 {category:'Renal', id:'renal', name:'UTI, Pyelonephritis, CKD, AKI, Renal Calculi', tags:['renal','uti','ckd','aki'], summary:'Renal disorders include UTIs, pyelonephritis, acute kidney injury, chronic kidney disease, and renal calculi.', fields:{definition:'UTIs are infections of the urinary tract; pyelonephritis affects the renal pelvis and nephrons; AKI is sudden loss of kidney function; CKD is progressive irreversible renal failure; renal calculi are urinary stones.', mechanism:'UTIs usually ascend from bowel flora. Pyelonephritis spreads from lower tract infection to the kidney. AKI may be prerenal, intrarenal, or postrenal. CKD involves progressive nephron loss and reduced GFR. Stones form when ions precipitate in urine.', manifestations:'UTI: dysuria, frequency, urgency, cloudy or offensive urine, fever. Pyelonephritis: fever, chills, nausea, vomiting, groin pain, haematuria, dysuria, flank pain. AKI: raised urea and creatinine, oliguria, anuria, uraemia, malaise, anorexia. CKD: lethargy, headache, breathlessness, haematuria, hypertension, pallor. Stones: colicky pain, haematuria, nausea, vomiting.', comparisons:'UTI and cystitis affect the lower tract, while pyelonephritis affects the kidney. AKI is abrupt and often reversible; CKD is gradual and irreversible. Stones may be silent or obstruct the urinary tract.', types:'UTI, cystitis, acute pyelonephritis, chronic pyelonephritis, AKI, CKD/ESRD, renal calculi.', risk:'UTIs: female sex, catheterisation, poor hydration, sexual activity, pregnancy, postmenopausal state, diabetes, reflux. AKI: dehydration, trauma, surgery, sepsis, nephrotoxins, heart or liver disease. CKD: diabetes, hypertension, chronic pyelonephritis, glomerulonephritis, renal calculi, prostatic hypertrophy. Stones: dehydration, immobility, high calcium or protein intake, gout, hyperparathyroidism, family history, UTI.', diagnosis:'Urinalysis, dipstick, midstream urine culture, blood tests, renal function tests, imaging such as ultrasound, MRI, or CT.', treatment:'UTIs: fluids, catheter removal if present, antibiotics, urinary alkalinisers, cranberry supplements. Pyelonephritis: antibiotics, analgesics, anti-emetics, antipyretics, fluids. AKI: supportive care, fluid and electrolyte monitoring, identify cause, strict input and output. CKD: dialysis, fistula or tunnelled line, fluid and sodium restriction, renal diet, erythropoietin, phosphate binders. Stones: fluids, dietary modification, surgery or ESWL when needed.', drugs:'Antibiotics such as gentamicin, nitrofurantoin, fosfomycin, ciprofloxacin, levofloxacin, ceftriaxone, ertapenem, trimethoprim-sulfamethoxazole; ACE inhibitors; thiazide diuretics; potassium citrate; penicillamine; tiopronin; analgesics; anti-emetics; phosphate binders; erythropoietin.'}, flash:[['UTI','Infection of the urinary tract'],['AKI','Sudden decline in kidney function'],['CKD','Progressive irreversible renal dysfunction'],['Renal calculi','Urinary stones']]},
 // ── Inflammation & Healing ────────────────────────────────────────────────────
 {category:'Inflammation', id:'inflammation_basics', name:'Inflammation: Overview & Cardinal Signs', tags:['inflammation','acute','vascular','cellular'], summary:'Inflammation is the body\'s first-line response to injury, aimed at neutralising damage and initiating repair. It has two phases and two main types.', fields:{
   definition:'Inflammation is the first-line body response to injury and is a manifestation of a disease process. Its purpose is to neutralise the injurious agent, stop further damage, clean up the site, and initiate repair as soon as possible. It can be beneficial or pathological depending on context.',
   mechanism:'There are two phases. (1) Vascular phase: chemical mediators (histamine, prostaglandins, bradykinin, complement, kinin-kallikrein system, clotting cascade) cause vasodilation and increased capillary permeability, leading to exudate formation, oedema, and stimulation of nociceptors. (2) Cellular phase: white cells (leukocytes) are attracted by chemotaxis and migrate through capillary walls by diapedesis to phagocytose debris and microbes.',
   manifestations:'The five cardinal signs: Rubor (redness) from vasodilation; Calor (heat) from increased blood flow; Tumor (swelling) from exudate/oedema; Dolor (pain) from nociceptor stimulation; Functio laesa (loss of function) from pain and swelling combined. These were first described by Cornelius Celsus and Galen of Pergamon.',
   comparisons:'Acute inflammation begins within minutes and lasts days, characterised by the five cardinal signs (e.g. URTI, UTI, gastroenteritis). Chronic inflammation lasts more than two weeks, involves lymphocytes as the dominant cell type, and can cause fibrosis, scarring, and granuloma formation (e.g. tuberculosis, autoimmune diseases, neoplasia).',
   types:'Exudate types: Serous (watery, low protein); Fibrinous (high protein, forms fibrin clot); Purulent (contains pus — cell debris, living and dead cells, microbes); Haemorrhagic (contains red blood cells).',
   risk:'Infection, physical injury, chemical injury, autoimmune reactions, and other noxious stimuli. Pattern Recognition Molecules on cell surfaces detect stimuli and activate NFkB signalling, leading to proinflammatory protein secretion.',
   diagnosis:'Clinical assessment of the five cardinal signs; laboratory tests for inflammatory markers (CRP, white cell count, ESR); imaging as appropriate.',
   treatment:'Management depends on cause. Corticosteroids and NSAIDs reduce vascular-phase signs; positioning reduces oedema; analgesia manages pain; antibiotics, wound cleaning, and removal of trauma address the cellular-phase triggers and infection. Treating the underlying cause is essential.',
   drugs:'NSAIDs (e.g. ibuprofen), corticosteroids (e.g. prednisolone), analgesics, antibiotics.'
 }, flash:[['Rubor','Redness caused by vasodilation'],['Calor','Heat from increased blood flow'],['Tumor','Swelling from exudate accumulation'],['Dolor','Pain from nociceptor stimulation'],['Functio laesa','Loss of function from pain and swelling'],['Vascular phase','Initial phase with chemical mediators causing vasodilation'],['Cellular phase','White cells attracted by chemotaxis and entering tissue by diapedesis'],['Serous exudate','Watery, low-protein fluid'],['Purulent exudate','Contains pus, cell debris, and microbes'],['Fibrinous exudate','High protein content; forms fibrin clot'],['Haemorrhagic exudate','Contains red blood cells'],['Chemotaxis','Attraction of white cells to the injury site by pro-inflammatory mediators'],['Diapedesis','Migration of white cells through capillary walls']]},
 {category:'Inflammation', id:'inflammation_cells', name:'Inflammatory Mediators & Cell Types', tags:['mediators','neutrophils','macrophages','cytokines'], summary:'A range of chemical mediators and white blood cell types drive and regulate the inflammatory response.', fields:{
   definition:'Inflammatory mediators are chemical signals that initiate and amplify inflammation. They include prostaglandins, histamine, bradykinin, leukotrienes, cytokines, nitric oxide, complement proteins, thromboxanes, platelet-activating factor, and C-reactive protein. Each has distinct roles.',
   mechanism:'Prostaglandins cause vasodilation, fever, and hyperalgesia. Histamine causes vasodilation and increased vascular permeability. Bradykinin causes vasodilation, permeability, hyperalgesia, and smooth muscle contraction. The complement system (around 10 proteins) forms opsonins and the membrane attack complex (MAC) to lyse pathogens. The kinin-kallikrein system produces bradykinin. The clotting cascade forms fibrin mesh to trap the injurious agent and initiate repair.',
   manifestations:'Neutrophils perform phagocytosis (first responders). Monocytes (blood) become macrophages (tissue): sustained phagocytosis, antigen presentation, cytokine production, initiation of healing. Eosinophils mediate allergic reactions and helminthic infections. Basophils/mast cells release histamine and mediate allergy. Lymphocytes drive adaptive immunity: B cells produce antibodies; T cells provide cell-mediated immunity and immune memory.',
   comparisons:'Neutrophils are the predominant cell in acute inflammation; lymphocytes dominate in chronic inflammation. Monocytes circulate in blood and differentiate into macrophages in tissue. Basophils are the blood equivalent of tissue mast cells.',
   types:'Pro-inflammatory mediators, complement system, clotting cascade, kinin-kallikrein system. Cell types: neutrophils, monocytes/macrophages, eosinophils, basophils/mast cells, lymphocytes (B and T cells).',
   risk:'Excessive or dysregulated mediator release can drive chronic inflammation, autoimmune disease, or systemic effects such as fever and sepsis.',
   diagnosis:'Blood tests for white cell differentials, complement levels, CRP, ESR, cytokine panels.',
   treatment:'Targeted based on mediator: NSAIDs inhibit prostaglandin synthesis (COX pathway); antihistamines block histamine; corticosteroids broadly suppress inflammatory mediators; immunosuppressants target lymphocyte activity.',
   drugs:'NSAIDs, antihistamines, corticosteroids, immunosuppressants, biologics targeting specific cytokines (e.g. TNF-alpha antagonists).'
 }, flash:[['Neutrophils','Phagocytosis — first responders in acute inflammation'],['Macrophages','Sustained phagocytosis, antigen presentation, healing initiation'],['Histamine','Released by mast cells; causes vasodilation and increased permeability'],['Prostaglandins','Cause vasodilation, fever, hyperalgesia, and bronchoconstriction'],['Complement MAC','Membrane attack complex that lyses pathogen cell membranes'],['Bradykinin','Causes vasodilation, increased permeability, and hyperalgesia'],['Lymphocytes dominant in','Chronic inflammation'],['Eosinophils','Important in helminthic infections and allergic reactions']]},
 {category:'Inflammation', id:'healing_repair', name:'Healing, Repair & Factors Impeding Healing', tags:['healing','repair','first intention','second intention','wound'], summary:'Healing requires debridement and neutralisation of the injurious agent, followed by clot formation, granulation tissue growth, and remodelling.', fields:{
   definition:'Healing by first intention occurs when there is little tissue loss, healing is quick, and minimal scar forms (e.g. a surgical incision). Healing by second intention occurs when there is significant tissue loss, healing is prolonged, and significant scarring results. Neoplasia refers to new tissue growth that serves no purpose.',
   mechanism:'Steps: fibrin clot fills and seals the wound; wound approximation occurs; epithelialisation begins; remaining clot dissolves; granulation tissue (containing new capillaries and lymphatics) grows into the wound; myofibroblasts cause wound contraction; remodelling occurs over weeks to months. This requires the injurious agent to be neutralised and the site debrided.',
   manifestations:'Poor healing presents as wound dehiscence, persistent infection, excessive scar formation (keloid or hypertrophic), chronic ulceration, or failure to close.',
   comparisons:'First intention: clean wound edges, minimal gap, rapid epithelialisation, minimal scar. Second intention: large tissue defect, prolonged granulation, significant scarring, wound contraction by myofibroblasts.',
   types:'First intention healing, second intention healing, wound contraction, granulation tissue formation, scar remodelling.',
   risk:'Factors that impede healing: Infection (microorganisms damage cells, prevent edge adhesion, cause dehiscence); Movement (disrupts fragile new tissue); Poor nutrient supply (new tissue needs glucose, proteins, vitamins); Poor oxygen delivery (new tissue has high metabolic demands); Drug therapy (anticancer drugs, immunosuppressants, glucocorticoids impair healing); Poor blood flow (inadequate oxygen and nutrient delivery).',
   diagnosis:'Wound inspection, measurement of granulation and epithelialisation progress, assessment for signs of infection.',
   treatment:'Ensure adequate nutrition (proteins, vitamins C and zinc), optimise blood flow, control infection with antibiotics and wound hygiene, immobilise the wound where possible, review medications that impair healing, debride necrotic tissue.',
   drugs:'Antibiotics for infection, vitamin and mineral supplements, growth factors in specialised wound care.'
 }, flash:[['First intention healing','Little tissue loss, quick healing, minimal scarring'],['Second intention healing','Significant tissue loss, prolonged healing, major scarring'],['Granulation tissue','New vascular tissue that fills a wound bed'],['Myofibroblasts','Cells that drive wound contraction'],['Infection on healing','Causes dehiscence and prevents wound edge adhesion'],['Poor blood flow effect','Inadequate oxygen and nutrients for new tissue growth'],['Drug that impairs healing','Glucocorticoids / immunosuppressants'],['Debridement','Cleaning up the site of injury to enable repair']]},
 {category:'Inflammation', id:'neoplasia', name:'Neoplasia, Carcinogenesis & Cancer Epidemiology', tags:['cancer','neoplasia','tumour','carcinogenesis','malignant'], summary:'Neoplasia is new purposeless tissue growth. Carcinogenesis involves accumulated mutations leading to malignant transformation, invasion, and metastasis.', fields:{
   definition:'Neoplasia is new growth — usually a tissue proliferation that serves no purpose. A benign tumour does not invade or destroy surrounding tissue and does not spread (non-cancerous). A malignant tumour destroys tissue, spreads, and can cause death (cancerous). Oncology is the study and treatment of cancer. Pleomorphic cancers contain cells with different mutations (e.g. teratomas).',
   mechanism:'Normal cells grow, divide, differentiate, and undergo apoptosis when damaged. Cancer cells accumulate irreparable DNA errors and become impervious to apoptosis signals. 4-7 mutations accumulated over a lifetime are typically needed. Carcinogens (physical, chemical, infectious, radiation) can drive mutation. The hallmarks of cancer include: sustaining proliferative signalling, evading growth suppressors, resisting apoptosis, enabling replicative immortality, inducing angiogenesis, activating invasion and metastasis, avoiding immune destruction, deregulating cellular energetics, genome instability, and tumour-promoting inflammation.',
   manifestations:'Common cancer signs and symptoms: Pain (from pressure on organs/nerves/bones); Cachexia (from inflammatory cytokines, proteolysis-inducing factors, nutrient competition); Fatigue (from stress, reduced nutrition, decreased bone marrow function, immune suppression); Anaemia (from reduced EPO, iron storage changes, bleeding, reduced cell replacement); Infection (from impaired immune function).',
   comparisons:'Tumour naming: adenoma (benign gland), adenocarcinoma (malignant gland), carcinoma (malignant epithelial), sarcoma (malignant mesoderm/connective tissue), lipoma (benign fat), lymphoma (lymphoid — malignant), melanoma (melanocytes — malignant), neuroma (neurons — benign).',
   types:'Benign: adenoma, angioma, fibroma, lipoma, neuroma, osteoma, papilloma. Malignant: adenocarcinoma, blastoma, carcinoma, melanoma, sarcoma, lymphoma.',
   risk:'Tobacco use (50 known carcinogens in cigarette smoke, damages tumour suppressor genes); Physical inactivity, dietary factors, obesity; Alcohol consumption (by-products are carcinogenic); Infections (viruses, bacteria, parasites — e.g. H. pylori, HPV, Epstein-Barr virus, hepatitis B and C); Environmental pollution; Occupational carcinogens (benzene, asbestos, pesticides); Ionising radiation.',
   diagnosis:'Biopsy, histopathology, imaging (CT, MRI, PET), tumour markers, staging investigations.',
   treatment:'Surgical excision, chemotherapy, radiotherapy, immunotherapy, targeted therapy, hormone therapy, palliative care. Pain: analgesia (simple, narcotic), nerve block, adjuvants. Cachexia: increased caloric intake, corticosteroids. Fatigue: rest, group care. Anaemia: erythropoietin, packed cells, iron. Infection: standard precautions, prophylactic antibiotics.',
   drugs:'Anticancer drugs (cytotoxics, targeted therapy, immunotherapy agents), erythropoietin, corticosteroids, analgesics (simple, opioid), antibiotics.'
 }, flash:[['Benign tumour','Does not invade, destroy, or spread — non-cancerous'],['Malignant tumour','Destroys tissue, spreads, can cause death — cancerous'],['Carcinogenesis','Process of initiation and development of cancer'],['Mutations needed for cancer','Approximately 4–7 accumulated mutations'],['Carcinoma','Malignant tumour of epithelial cells'],['Sarcoma','Malignant tumour of mesodermal/connective tissue'],['Cancer and apoptosis','Cancer cells resist apoptosis signals'],['Most common cancer in Australian males (2017)','Prostate'],['Most common cancer in Australian females (2017)','Breast'],['5-year survival rate in Australia (2017)','68%']]},

 {category:'Blood', id:'anaemia_overview', name:'Anaemias: Overview & Classification', tags:['anaemia','erythrocyte','haemoglobin','iron','B12'], summary:'Anaemia is a reduction in haemoglobin or red cell count, classified by cell size (cytic) and haemoglobin content (chromic), and by aetiology.', fields:{
   definition:'Anaemia is a decrease in haemoglobin below the normal range (120–160 g/L in women; 135–180 g/L in men). It involves a reduction in erythrocyte number and can be inherited or acquired. It results from altered erythrocyte production, blood loss, increased erythrocyte destruction, or a combination.',
   mechanism:'Classified by morphology: Microcytic (small RBCs — iron deficiency, thalassaemia); Macrocytic (large RBCs — vitamin B12 deficiency/pernicious anaemia, leukaemia); Normocytic (normal-sized RBCs — haemorrhage, chronic renal failure, haemolytic anaemia). Also classified by chromia: normochromic, hyperchromic, or hypochromic (low haemoglobin content). By aetiology: decreased production (iron/B12/stem cell/precursor deficiency), increased destruction/loss (intracellular or extracellular), or blood loss (acute or chronic).',
   manifestations:'Hypoxia, fatigue, pallor, shortness of breath, tachycardia, headache, dizziness, impaired concentration. Severe cases cause heart failure.',
   comparisons:'Iron-deficiency anaemia: microcytic hypochromic; Pernicious anaemia: macrocytic normochromic; Haemolytic anaemia: normocytic normochromic; Aplastic anaemia: normocytic from stem cell failure.',
   types:'Iron-deficiency anaemia, pernicious (megaloblastic) anaemia, thalassaemia, haemolytic anaemia, sickle cell anaemia, aplastic anaemia, anaemia of chronic renal failure, anaemia of haemorrhage.',
   risk:'Iron deficiency: vegetarian diet, chronic poverty, pregnancy, chronic bleeding/menstruation. B12/folate deficiency: malnutrition, alcohol abuse, pregnancy, gastrointestinal disorder, autoimmune gastric disease.',
   diagnosis:'Full blood count (FBC), blood film, haemoglobin level, MCV, MCH, serum ferritin, serum iron, B12 and folate levels, reticulocyte count, bone marrow biopsy in complex cases.',
   treatment:'Iron deficiency: dietary iron (meat, beans, lentils), vitamin C to enhance absorption, oral iron supplements (ferrous ion preferred), IV/IM iron, transfusion if severe. B12/folate deficiency: dietary sources (meat, eggs, cheese), IV cyanocobalamin, folate supplements.',
   drugs:'Ferrous sulfate/fumarate (oral iron), IV iron sucrose, IV cyanocobalamin (B12), folic acid, erythropoietin (in renal anaemia), transfusion (packed red cells).'
 }, flash:[['Normal Hb in women','120–160 g/L'],['Normal Hb in men','135–180 g/L'],['Microcytic anaemia','Small RBCs — iron deficiency or thalassaemia'],['Macrocytic anaemia','Large RBCs — B12 deficiency, pernicious anaemia'],['Normocytic anaemia','Normal-sized RBCs — haemorrhage or haemolytic cause'],['Iron-deficiency anaemia appearance','Microcytic hypochromic'],['Pernicious anaemia appearance','Macrocytic normochromic'],['Iron treatment preference','Ferrous ion form, oral or IV/IM']]},
 {category:'Blood', id:'specific_anaemias', name:'Thalassaemia, Sickle Cell & Haemolytic Disease of the Newborn', tags:['thalassaemia','sickle cell','HDN','haemolytic'], summary:'These anaemias arise from inherited haemoglobin abnormalities or immune incompatibility, leading to erythrocyte destruction.', fields:{
   definition:'Thalassaemia: inherited mutations causing reduced or absent synthesis of globin chains, leading to haemolytic anaemia and iron overload. Sickle cell anaemia: autosomal recessive mutation in the β-globin chain producing variant haemoglobin (HbS) that causes erythrocytes to adopt a sickle shape. Haemolytic Disease of the Newborn (HDN): occurs when maternal antibodies cross the placenta and destroy foetal erythrocytes.',
   mechanism:'Thalassaemia: defective α (common in South-East Asian/Chinese populations) or β globin chains (common in Mediterranean heritage) leads to ineffective erythropoiesis and haemolysis; iron accumulates in organs. Sickle cell: homozygous HbS causes rigid sickle-shaped cells that obstruct capillaries causing ischaemia and organ damage; the spleen destroys these cells causing haemolysis; heterozygous carriers have partial malaria resistance. HDN: Rh-negative mother sensitised to Rh-positive foetal blood at delivery; anti-Rh antibodies cross the placenta in subsequent pregnancies causing foetal haemolysis, normochromic normocytic anaemia, hyperbilirubinaemia, jaundice, and kernicterus.',
   manifestations:'Thalassaemia: microcytic hypochromic anaemia, hepatosplenomegaly, bronze skin, heart failure, growth retardation, bilirubin elevation. Sickle cell: haemolytic anaemia, painful vaso-occlusive crises, ischaemia, organ failure. HDN: foetal anaemia, hyperbilirubinaemia, jaundice, kernicterus (brain damage from bilirubin).',
   comparisons:'Alpha-thalassaemia more common in South-East Asian and Chinese populations. Beta-thalassaemia more common in Mediterranean heritage. Thalassaemia and sickle cell are more common in malaria-endemic regions as they confer some protection. HDN from Rh incompatibility affects about 10% of pregnancies; HDN from ABO incompatibility affects about 25%.',
   types:'α-thalassaemia, β-thalassaemia (minor, intermedia, major). Sickle cell anaemia (HbSS), sickle cell trait (HbAS). HDN from Rh incompatibility, HDN from ABO incompatibility.',
   risk:'Thalassaemia: autosomal recessive inheritance. Sickle cell: autosomal recessive, Sub-Saharan African, Middle Eastern, South Asian, Mediterranean, Caribbean heritage. HDN: Rh-negative mother with Rh-positive foetus; does not affect first pregnancy.',
   diagnosis:'Thalassaemia: blood film, Hb electrophoresis, genetic testing. Sickle cell: sickling test, Hb electrophoresis (HbS). HDN: maternal blood grouping, indirect Coombs test (antenatal), direct Coombs test (newborn).',
   treatment:'Thalassaemia: regular transfusions, chelation therapy (to remove excess iron), splenectomy. Sickle cell: analgesics for crises, hydration, oxygen, hydroxyurea, transfusion, bone marrow transplant. HDN: Anti-D immunoglobulin to Rh-negative mothers after each delivery; IV immunoglobulin, transfusion, phototherapy, oxygen for affected newborn.',
   drugs:'Chelation agents (desferrioxamine), hydroxyurea (sickle cell), Anti-D immunoglobulin (HDN prevention), phototherapy, IV immunoglobulin.'
 }, flash:[['Thalassaemia inheritance','Autosomal recessive'],['Alpha-thalassaemia population','South-East Asian and Chinese'],['Beta-thalassaemia population','Mediterranean heritage'],['Sickle cell mutation','β-globin chain produces HbS instead of HbA'],['HbSS consequence','Sickle-shaped cells obstruct capillaries → ischaemia and organ damage'],['Heterozygous sickle cell carriers','Usually symptom-free; partial malaria resistance'],['HDN and first pregnancy','First pregnancy is NOT affected; sensitisation occurs at delivery'],['HDN prevention','Anti-D immunoglobulin to Rh-negative mother after delivery'],['Kernicterus','Brain damage from severe hyperbilirubinaemia in HDN']]},
 {category:'Blood', id:'bleeding_polycythaemia', name:'Polycythaemia, Bleeding Disorders & Thrombocytopenia', tags:['polycythaemia','haemophilia','thrombocytopenia','von willebrand','bleeding'], summary:'Polycythaemia is excess red cell production; haemophilias and thrombocytopenia are bleeding disorders from clotting factor or platelet deficiencies.', fields:{
   definition:'Polycythaemia: overproduction of erythrocytes that increases blood viscosity and promotes thrombus formation. Haemophilia: hereditary X-linked bleeding disorder from deficiency in clotting factors. Von Willebrand disease: group of 6 autosomal dominant bleeding disorders. Thrombocytopenia: reduction in platelet levels causing impaired haemostasis.',
   mechanism:'Polycythaemia raises blood viscosity, promoting thrombosis, ischaemia, and organ damage; absolute polycythaemia is driven by increased erythropoietin secretion (e.g. chronic hypoxia, erythropoietin-secreting tumours). Haemophilias reduce key clotting factors, prolonging bleeding time. The coagulation cascade has extrinsic (tissue factor + factor VII → tissue factor complex → factor X), common (factor X → prothrombinase → prothrombin → thrombin → fibrinogen → fibrin), and intrinsic (activated factor XII → factor X activator complex) pathways. Thrombocytopenia impairs primary haemostasis.',
   manifestations:'Polycythaemia: splenomegaly, aquagenic pruritus, raised platelets, thrombosis, hypertension. Haemophilia: excessive bleeding after trauma or surgery (mild, 5–35% factor level), or spontaneous bleeding (severe, <1% factor level). Thrombocytopenia: haemorrhage severity depends on platelet loss.',
   comparisons:'Haemophilia A (classic haemophilia) — factor VIII deficiency; Haemophilia B (Christmas disease) — factor IX deficiency; Haemophilia C — factor XI deficiency; Von Willebrand disease — autosomal dominant, platelet-related. Absolute polycythaemia involves true increased RBC mass; relative polycythaemia is due to dehydration.',
   types:'Absolute polycythaemia (primary and secondary), relative polycythaemia, haemophilia A/B/C, von Willebrand disease, immune thrombocytopenia, drug-induced thrombocytopenia.',
   risk:'Polycythaemia: chronic hypoxia (most common), high altitude, EPO-secreting tumours. Haemophilia: X-linked recessive — predominantly in males. Thrombocytopenia: immune responses to platelets, heparin therapy, nutritional deficiencies (B12, folate, iron), viral infections (HIV), chemotherapy, bone marrow transplantation.',
   diagnosis:'Polycythaemia: FBC, blood viscosity, oxygen saturation. Haemophilia: clotting factor assay, APTT (prolonged in A and B). Thrombocytopenia: platelet count, bone marrow biopsy.',
   treatment:'Polycythaemia: periodic phlebotomy, radioactive phosphorus, fluid replacement, antihistamines (pruritus), aspirin, splenectomy. Haemophilia: factor replacement therapy; avoid aspirin. Thrombocytopenia: reduce traumatic interventions, fresh frozen plasma, platelet transfusion, IV immunoglobulin, splenectomy, corticosteroids, azathioprine, discontinue heparin if implicated.',
   drugs:'Factor VIII concentrate, factor IX concentrate, desmopressin (mild haemophilia A), recombinant factors, corticosteroids, azathioprine, IV immunoglobulin, aspirin (polycythaemia), antihistamines.'
 }, flash:[['Polycythaemia','Overproduction of erythrocytes → increased blood viscosity'],['Main cause of absolute polycythaemia','Chronic hypoxia increasing erythropoietin'],['Haemophilia A','Factor VIII deficiency (classic haemophilia)'],['Haemophilia B','Factor IX deficiency (Christmas disease)'],['Von Willebrand disease','Autosomal dominant platelet-related bleeding disorder'],['Thrombocytopenia','Reduction in platelets → impaired haemostasis'],['Coagulation cascade end product','Fibrin clot'],['Heparin complication','Can induce thrombocytopenia']]},
 {category:'Respiratory', id:'rsp_rti', name:'Respiratory Tract Infections', tags:['pneumonia','tuberculosis','influenza','covid','bronchiolitis','rti'], summary:'RTIs range from minor upper tract infections to life-threatening lower tract disease. Common causes are viruses and bacteria.', fields:{definition:'Respiratory tract infections are classified as upper (above the carina: rhinitis, sinusitis, pharyngitis, tonsillitis, laryngitis, tracheitis, epiglottitis) or lower (below the carina: bronchitis, bronchiolitis, pneumonia, influenza, pertussis, tuberculosis). Upper and lower are divided anatomically at the level of the carina.', mechanism:'Pathogens enter via inhalation, droplets, or direct inoculation. URTIs: rhinovirus most common. LRTIs: RSV, influenza, Streptococcus pneumoniae, Mycobacterium tuberculosis. The upper airway normally filters inspired air; LRTI occurs when defences fail. Inflammation causes alveolar oedema, vascular congestion, exudate, and impaired gas exchange.', manifestations:'Pneumonia: hypoxaemia, tachypnoea, dyspnoea, tachycardia, pyrexia, productive cough, lethargy, pain, reduced lung expansion, dehydration. Sputum colour guides aetiology: rusty/red = Streptococcus; green = Pseudomonas; foul-smelling = anaerobic; gelatinous = Klebsiella. TB: chronic cough, haemoptysis, weight loss, pyrexia, fatigue, night sweats. COVID-19: fever, cough, fatigue, dyspnoea progressing to ARDS, multi-organ failure, clotting disorders.', comparisons:'Community-acquired pneumonia (Streptococcus, Mycoplasma, Legionella) vs hospital-acquired (Staphylococcus aureus, Pseudomonas). Lobar pneumonia affects a whole lobe; bronchopneumonia has scattered patchy distribution. TB is a chronic granulomatous bacterial disease; influenza is an acute viral infection.', types:'URTIs: sinusitis, rhinitis, pharyngitis, tonsillitis, laryngitis, tracheitis, epiglottitis, croup. LRTIs: bronchitis, bronchiolitis, pneumonia, influenza, pertussis, tuberculosis, histoplasmosis, legionellosis.', risk:'Immunodeficiency, impaired mucociliary clearance, extremes of age, surfactant immaturity (premature infants), smoking, chronic disease, hospitalisation, poor nutrition, close contact or droplet exposure.', diagnosis:'Physical examination, oxygen saturation, vital signs, chest X-ray, FBC (leucocytosis), sputum analysis, Mantoux/tuberculin skin test and interferon gamma release assay (TB), arterial blood gas, PSI or CURB-65 severity scores, nasal/oral swab (COVID-19), CRP, ESR.', treatment:'Pneumonia: antibiotics (bacterial), antiviral (viral), supplemental oxygen, paracetamol, fluid balance. TB: combination therapy — ethambutol, isoniazid, rifampicin, pyrazinamide for months. COVID-19: supportive care, oxygen, mechanical ventilation, corticosteroids, antivirals, vaccines. Bronchiolitis: supportive care, oxygen, hydration.', drugs:'Amoxicillin, ceftriaxone, azithromycin (community pneumonia); vancomycin, piperacillin-tazobactam (hospital pneumonia); ethambutol, isoniazid, rifampicin, pyrazinamide (TB); oseltamivir (influenza); corticosteroids, antivirals (COVID-19); antipyretics.'}, flash:[['Rusty sputum suggests','Streptococcus pneumoniae'],['Green sputum suggests','Pseudomonas infection'],['TB causative organism','Mycobacterium tuberculosis'],['Mantoux test','Tuberculin skin test — induration ≥5 mm is positive'],['Community pneumonia common cause','Streptococcus pneumoniae'],['Hospital pneumonia common cause','Staphylococcus aureus or Pseudomonas'],['Bronchiolitis most common cause','Respiratory syncytial virus (RSV)'],['COVID-19 receptor','Angiotensin-converting enzyme 2 (ACE2) receptor']]},
 {category:'Respiratory', id:'rsp_old', name:'Obstructive Lung Disorders (Asthma, COPD, CF)', tags:['asthma','copd','cystic fibrosis','bronchiectasis','obstructive'], summary:'Obstructive disorders share airflow limitation during expiration. Asthma is reversible; COPD is progressive and largely irreversible.', fields:{definition:'Obstructive airway disease: airflow obstruction causing more difficulty during expiration; FEV1/FVC ratio is decreased. Key disorders: asthma (chronic inflammatory airway narrowing — reversible), COPD (progressive irreversible obstruction encompassing chronic bronchitis and/or emphysema), cystic fibrosis (defective CFTR chloride transport → thick mucus), bronchiectasis (abnormal bronchial dilation with loss of functioning cilia).', mechanism:'Asthma: mast cell stimulation → cytokines (histamine, kinins, prostaglandins) → smooth muscle contraction, mucus hypersecretion, increased capillary permeability → airway narrowing and flooding. COPD: tobacco smoke → epithelial inflammation → inflammatory cytokines → bronchial irritation (chronic bronchitis) and elastic tissue destruction (emphysema). Emphysema: proteases from neutrophils/macrophages destroy elastic fibres → alveolar over-inflation, loss of elastic recoil. CF: CFTR gene defect on chromosome 7 → defective chloride secretion → dehydrated viscous mucus → mucus plugs → chronic bacterial infection and inflammation.', manifestations:'Asthma: dyspnoea, wheezing, coughing, tachypnoea, chest tightness. COPD: dyspnoea, cough, hypoxaemia, hypercapnia, cor pulmonale. Chronic bronchitis: chronic productive cough ≥3 months for ≥2 years ("blue bloater" — cyanosis, oedema). Emphysema: severe dyspnoea early, barrel chest ("pink puffer" — hyperinflation, pursed-lip breathing). CF: barrel chest, digital clubbing, haemoptysis, pancreatic insufficiency, fatty stools, meconium ileus.', comparisons:'Asthma: reversible, episodic; COPD: progressive, irreversible. Blue bloater (chronic bronchitis): cyanosis, productive cough, oedema, age 40–45. Pink puffer (emphysema): severe dyspnoea, hyperinflation, barrel chest, age 50–75. Obstructive (decreased FEV1/FVC) vs restrictive (decreased FVC, normal FEV1/FVC).', types:'Allergic, exercise-induced, nocturnal, occupational asthma; COPD (chronic bronchitis + emphysema); cystic fibrosis; bronchiectasis.', risk:'Asthma: allergens, exercise, cold air, stress, smoke, occupational agents. COPD: smoking (main cause), air pollution, alpha-1 antitrypsin deficiency. CF: autosomal recessive CFTR mutation. Bronchiectasis: recurrent infections, CF, immunodeficiency.', diagnosis:'Spirometry (FEV1/FVC <0.70 in COPD), peak expiratory flow, chest X-ray, CT, pulse oximetry, ABG, sputum culture, sweat test (CF — elevated chloride), genetic testing (CF).', treatment:'Asthma: high Fowler\'s position, oxygen, nebulised bronchodilators, inhaled/oral steroids, anti-leukotrienes, mast cell stabilisers. COPD: smoking cessation, bronchodilators, inhaled steroids, pulmonary rehabilitation, influenza vaccination, oxygen. CF: aerosolised DNAse, antibiotics, chest physiotherapy, nutritional support, lung transplantation. Bronchiectasis: chest physiotherapy, antibiotics.', drugs:'Short-acting β2-agonists (salbutamol), long-acting β2-agonists (salmeterol), inhaled corticosteroids (fluticasone), anti-leukotrienes (montelukast), mast cell stabilisers (cromoglicate), anticholinergics (ipratropium), aerosolised DNAse/dornase alfa (CF).'}, flash:[['FEV1/FVC in obstruction','Decreased below 0.70 in COPD'],['Blue bloater','Chronic bronchitis — cyanosis, productive cough, oedema'],['Pink puffer','Emphysema — severe dyspnoea, barrel chest, hyperinflation'],['Asthma trigger cell','Mast cell releases histamine, kinins, prostaglandins'],['Cystic fibrosis gene defect','CFTR mutation — chromosome 7'],['CF diagnostic test','Sweat test — elevated chloride'],['COPD main cause','Cigarette smoking'],['Bronchiectasis','Irreversible dilation of bronchi with impaired cilia']]},
 {category:'Respiratory', id:'rsp_rld', name:'Restrictive Lung Disorders & ARDS', tags:['restrictive','ards','fibrosis','pneumoconiosis'], summary:'Restrictive disorders limit lung expansion and reduce FVC. ARDS is an acute life-threatening form of restrictive failure.', fields:{definition:'Restrictive airway disease: decreased lung compliance and increased work of breathing — difficulty expanding the thorax fully during inhalation. FEV1 and FVC both decreased; FEV1/FVC ratio is normal or higher than normal. Causes include intrinsic lung disease (asbestosis, pneumoconiosis, pulmonary fibrosis), chest wall conditions (kyphosis, scoliosis), and neuromuscular disease. ARDS (Acute Respiratory Distress Syndrome): life-threatening acute lung inflammation with diffuse alveolar-capillary injury.', mechanism:'Restrictive disease: lung tissue or chest wall stiffening reduces compliance and tidal volume. ARDS 3 stages: (1) Exudative (days 1–7): inflammation → alveolar-capillary injury → oedema, microvascular thrombi, proteinaceous alveolar deposits, surfactant loss, cell destruction. (2) Proliferative (days 7–21): fibroblast activation and fibrinolysis → collagen deposition, cellular regeneration. (3) Fibrotic (>21 days): coagulation-fibrinolysis imbalance → interstitial fibrin deposits → reduced compliance.', manifestations:'Restrictive: dyspnoea, reduced exercise tolerance, reduced FVC. ARDS: dyspnoea, rapid shallow breathing, inspiratory crackles, respiratory alkalosis, hypoxaemia, cyanosis, hypercapnia, diffuse bilateral alveolar infiltrates on X-ray, reduced lung compliance, pulmonary hypertension.', comparisons:'Obstructive: FEV1/FVC decreased, difficulty expiring. Restrictive: FVC decreased, FEV1/FVC normal or raised, difficulty inspiring. ARDS is an acute severe restrictive condition; pneumoconiosis and fibrosis are chronic. Not as prevalent as obstructive diseases in Australia and New Zealand.', types:'Intrinsic: pneumoconiosis, asbestosis, pulmonary fibrosis, ARDS, radiation-induced. Extrinsic: kyphosis, scoliosis, obesity hypoventilation. Neuromuscular: poliomyelitis, muscular dystrophy, myasthenia gravis.', risk:'ARDS: sepsis, pneumonia, trauma, aspiration, blood transfusion reactions, pancreatitis, burns. Pneumoconiosis: occupational inhalation of coal dust, asbestos, or silica. Neuromuscular: inherited conditions, infections.', diagnosis:'ARDS: ABG, chest X-ray (bilateral infiltrates), CT scan, physical examination. Restrictive: spirometry (reduced FVC, normal FEV1/FVC), lung biopsy, CT, occupational history.', treatment:'ARDS: PEEP ventilation, mechanical ventilation, supplemental oxygen, sedation, prone positioning, fluid support, inotropes, corticosteroids. Chronic restrictive: treat underlying cause, oxygen therapy, pulmonary rehabilitation.', drugs:'Corticosteroids (ARDS, inflammatory), inotropes (dobutamine), bronchodilators where applicable, supplemental oxygen. No pharmacological treatment reverses established pulmonary fibrosis.'}, flash:[['FEV1/FVC in restriction','Normal or above normal (FVC is reduced)'],['ARDS exudative stage','Days 1–7: oedema, surfactant loss, alveolar cell destruction'],['ARDS proliferative stage','Days 7–21: fibroblast activation, collagen deposition'],['ARDS fibrotic stage','>21 days: fibrin deposits, reduced compliance'],['PEEP in ARDS','Positive end-expiratory pressure — keeps alveoli open'],['Pneumoconiosis cause','Occupational inhalation of industrial dusts (coal, silica, asbestos)'],['Prone positioning in ARDS','Improves ventilation-perfusion matching'],['Restrictive spirometry','FVC decreased; FEV1/FVC normal or raised']]},
 {category:'Respiratory', id:'rsp_failure', name:'Respiratory Failure & Assessment', tags:['respiratory failure','hypoxia','hypercapnia','spirometry','assessment'], summary:'Respiratory failure occurs when the lungs cannot maintain adequate gas exchange. Assessment uses clinical signs, blood gases, and spirometry.', fields:{definition:'Respiratory failure: the lungs cannot get enough oxygen into the blood to sustain metabolic needs. Normal SpO₂ is 95–99%. Hypoxaemia: reduced oxygen in arterial blood. Hypoxia: lack of oxygen at tissue level. Hypercapnia: CO₂ accumulation leading to respiratory acidosis. Central cyanosis is a clinical sign of hypoxaemia.', mechanism:'Type I (hypoxaemic): hypoxaemia with normal or low CO₂ — caused by V/Q mismatch, diffusion impairment, or shunt. Type II (hypercapnic/ventilatory): hypoxaemia with elevated CO₂ — caused by reduced respiratory drive, airway obstruction, or chest wall disease. Acute failure: rapid onset (pneumonia, opioid overdose, stroke, lung injury). Chronic failure: gradual development (COPD, neuromuscular disease).', manifestations:'Shortness of breath, extreme tiredness, inability to exercise, sleepiness, confusion, central cyanosis, tachypnoea, use of accessory muscles. Chronic failure: cor pulmonale (right heart failure from chronic pulmonary hypertension).', comparisons:'Acute respiratory failure: rapid onset, often reversible with treatment. Chronic respiratory failure: gradual, managed with long-term oxygen therapy and rehabilitation. Type I: oxygenation failure. Type II: ventilatory failure.', types:'Type I (hypoxaemic), Type II (hypercapnic/ventilatory), acute, chronic.', risk:'Pneumonia, opioid/sedative overdose, stroke, spinal cord injury, severe asthma/COPD exacerbation, ARDS, trauma, neuromuscular disease, sleep apnoea.', diagnosis:'Pulse oximetry (SpO₂), arterial blood gas (PaO₂, PaCO₂, pH), spirometry (FEV1, FVC, FEV1/FVC ratio), chest X-ray, CT scan, peak expiratory flow, chest auscultation, clinical assessment of breathing pattern and accessory muscle use.', treatment:'Supplemental oxygen (controlled in Type II to avoid CO₂ retention), non-invasive ventilation (CPAP/BiPAP), mechanical ventilation for severe cases, treat underlying cause, bronchodilators, physiotherapy, pulmonary rehabilitation.', drugs:'Supplemental oxygen, bronchodilators (β2-agonists, anticholinergics), corticosteroids, naloxone (opioid overdose reversal), diuretics for cor pulmonale, antibiotics for infective exacerbations.'}, flash:[['Normal SpO₂ range','95–99%'],['Hypoxaemia','Reduced oxygen in arterial blood'],['Hypoxia','Insufficient oxygen at tissue level'],['Hypercapnia consequence','Respiratory acidosis'],['Type I respiratory failure','Hypoxaemia with normal/low CO₂ — oxygenation failure'],['Type II respiratory failure','Hypoxaemia with elevated CO₂ — ventilatory failure'],['Central cyanosis','Sign of hypoxaemia — bluish discolouration of lips and tongue'],['Cor pulmonale','Right heart failure from chronic pulmonary hypertension']]},

 {category:'GI', id:'gi_upper', name:'GORD, PUD & Helicobacter pylori', tags:['gord','pud','peptic ulcer','helicobacter','reflux'], summary:'GORD results from lower oesophageal sphincter dysfunction; PUD involves mucosal erosion caused by H. pylori, NSAIDs, and acid hypersecretion.', fields:{definition:'GORD (gastro-oesophageal reflux disease): involuntary reflux of gastric juice into the oesophagus that impairs quality of life, caused by dysfunction of the lower oesophageal sphincter (LOS). NERD (non-erosive reflux disease): reflux without mucosal damage. PUD (peptic ulcer disease): mucosal erosive injury >5 mm in depth exposing smooth muscle, blood vessels, and nerves; occurs in the stomach or duodenum.', mechanism:'GORD: LOS loses tone → gastric acid refluxes → mucosal injury. Factors preventing reflux: gravity, LOS pressure, oesophagogastric junction anatomy, diaphragm contraction, gastric emptying. Causes of GORD: delayed gastric emptying, pro-inflammatory cytokines, altered neuromuscular control, increased intra-abdominal pressure (obesity, pregnancy, poor posture, smoking). PUD mechanisms: (1) Breakdown of protective mucosal barrier (H. pylori, NSAIDs, alcohol, tobacco); (2) Excessive chronic acid/pepsin exposure. H. pylori: secretes urease to alkalinise environment, promotes cytokines, reduces mucosal thickness, induces gastrin → HCl release, inhibits somatostatin.', manifestations:'GORD: heartburn, regurgitation, epigastric/chest pain, nausea, haematemesis, flatulence, chronic cough, hoarseness. Complications: oesophagitis, Barrett\'s oesophagus (columnar cells replace squamous — pre-cancerous state), oesophageal adenocarcinoma, aspiration pneumonia. PUD: dyspepsia, diarrhoea, vomiting, anorexia, haematemesis, abdominal/chest pain, weight loss.', comparisons:'Barrett\'s oesophagus is a pre-cancerous metaplastic complication of GORD. ~80% of gastric ulcer patients have H. pylori; ~95% of duodenal ulcer patients have H. pylori. H. pylori found in 50% of population but only 5–10% develop ulcers. GORD vs NERD: NERD has no mucosal damage.', types:'GORD, NERD, Barrett\'s oesophagus, oesophageal adenocarcinoma; gastric ulcer, duodenal ulcer.', risk:'GORD: obesity, poor posture, smoking, large/acidic meals, pregnancy, delayed gastric emptying. PUD: H. pylori infection, NSAID use, high salt diet, smoking, alcohol, Zollinger-Ellison syndrome, gastric cell hyperplasia.', diagnosis:'GORD: symptomatology, gastroscopy/oesophagogastroduodenoscopy, capsular endoscopy, oesophageal manometry. PUD: endoscopy (gold standard), rapid urease test of mucosal sample, H. pylori isolation, haematology/biochemistry.', treatment:'GORD: lifestyle modification (smaller meals, avoid acidic foods), antacids, H2 receptor antagonists; severe disease → fundoplication surgery. PUD: H. pylori eradication (triple therapy), cease NSAIDs and smoking, acid reduction (H2 antagonists or proton pump inhibitors), mucosal coating (bismuth or prostaglandin E2 analogue), control blood loss, nutritional supplements.', drugs:'Proton pump inhibitors (omeprazole), H2 receptor antagonists (ranitidine), antacids, prokinetics, clarithromycin + amoxicillin + metronidazole (H. pylori triple therapy), bismuth compounds, prostaglandin E2 analogues.'}, flash:[['Key GORD mechanism','Lower oesophageal sphincter (LOS) dysfunction'],['Barrett\'s oesophagus','Pre-cancerous metaplasia — columnar cells replace squamous cells'],['H. pylori survival trick','Secretes urease to create alkaline microenvironment'],['H. pylori Nobel Prize year','2005 — Barry Marshall and Robin Warren'],['PUD gold standard diagnosis','Endoscopy and lesion visualisation'],['GORD severe treatment','Fundoplication surgery to strengthen LOS'],['H. pylori in duodenal ulcers','~95% of patients'],['PUD mucosal protection drug','Bismuth or prostaglandin E2 analogue']]},
 {category:'GI', id:'gi_immune', name:'Coeliac Disease, Crohn\'s Disease & Diarrhoeas', tags:['coeliac','crohns','diarrhoea','IBD','gluten'], summary:'Coeliac disease is a gluten-triggered autoimmune enteropathy; Crohn\'s is a transmural inflammatory bowel disease; diarrhoea has four major pathophysiological mechanisms.', fields:{definition:'Coeliac disease (gluten-sensitivity enteropathy): aberrant autoimmune response to gluten causing malabsorption; predominantly affects Caucasians and Indians; associated with HLA-DQ2 or HLA-DQ8. Crohn\'s disease: chronic transmural inflammation of any part of the GI tract, most commonly the ileum; also known as regional ileitis. Diarrhoea: three categories — acute (1 to several days), chronic (>4 weeks), episodic.', mechanism:'Coeliac: gluten partially digested → gliadin → crosses permeable mucosa → cross-links with tissue transglutaminase → detected as antigenic → CD4 T cell activation → anti-transglutaminase IgG antibodies → mucosal villi become blunt/flattened → malabsorption. Crohn\'s: unknown cause; imbalance between pro-inflammatory and immunoregulatory factors; autoimmune loss of tolerance to GI bacteria; transmural inflammation (all 4 layers); skip lesions; ulceration → fissures → cobblestone appearance → perforation/fistula/abscess. Diarrhoea mechanisms: osmotic (osmotically active substances draw water into lumen), secretory (↑ water/↓ salt into bowel from e.g. rotavirus, E. coli), exudative/inflammatory (disruption of intestinal epithelium — E. coli, Shigella, Giardia), motility disturbances.', manifestations:'Coeliac: chronic diarrhoea, weight loss, failure to thrive, abdominal pain/distension, vomiting, glossitis, malnutrition, electrolyte imbalance. Crohn\'s: variable — malaise, lethargy, anorexia, diarrhoea, abscesses, fistulas, bowel obstruction; extra-intestinal manifestations (skin, liver, joints, mouth); lifelong with remissions and relapses; increased risk of colon cancer. Acute diarrhoea: dehydration, electrolyte imbalance, nausea, vomiting, abdominal pain.', comparisons:'Crohn\'s: transmural (all 4 layers), skip lesions, any GI segment, more common in smokers, risk of colon cancer (lower than UC). UC: superficial (mucosa only), continuous from anorectal margin, colon only, more common in non-/ex-smokers. Acute diarrhoea causes: food poisoning, gastroenteritis, anxiety, alcohol, antibiotics, infection. Chronic causes: IBD, coeliac, IBS, hormone disorders, bowel cancer, lactose intolerance.', types:'Coeliac disease; Crohn\'s disease; Ulcerative colitis; Acute infectious diarrhoea (viral: rotavirus, adenovirus; bacterial: E. coli, Campylobacter, Vibrio cholerae, Shigella, Salmonella, Staph aureus; parasitic: Giardia, Cryptosporidium, tapeworm); Chronic diarrhoea.', risk:'Coeliac: HLA-DQ2/DQ8 genetics; Caucasian/Indian heritage; triggered by rotavirus (children) or Campylobacter (adults). Crohn\'s: ~0.1% of Australians; onset mostly before 25; ~20% have first-degree relative affected; defects in innate immunity. Diarrhoea: food poisoning, travel, immunocompromise, antibiotic use, anxiety.', diagnosis:'Coeliac: elevated serum IgA, anti-transglutaminase antibodies, tissue biopsy (villous atrophy), HLA typing. Crohn\'s: X-ray with barium meal, colonoscopy, MRI/CT, biopsy, blood tests (anaemia, leucocytosis), raised CRP and ESR.', treatment:'Coeliac: gluten-free diet (avoid wheat, rye, barley, oats), micronutrient supplementation, osteoporosis assessment; severe → corticosteroids, total parenteral nutrition. Crohn\'s: sulphasalazine or mesalazine, immunosuppressants, corticosteroids, antibiotics, antidiarrhoeals, antispasmodics, high-fibre diet; surgery for complications. Diarrhoea: fluid support, electrolyte replacement, antiemetics, antispasmodics; antidiarrhoeals with caution; vaccination.', drugs:'Corticosteroids, sulphasalazine, mesalazine, immunomodifiers (azathioprine, methotrexate), biological therapy (anti-TNF), antibiotics, antispasmodics, antidiarrhoeals (with caution), oral rehydration solutions.'}, flash:[['Coeliac trigger','Gliadin fragment from partially digested gluten'],['Coeliac HLA association','HLA-DQ2 or HLA-DQ8'],['Crohn\'s histology finding','Cobblestone appearance from ulceration and fissures'],['Crohn\'s depth','Transmural — all 4 layers of intestinal wall'],['Crohn\'s vs UC','Crohn\'s: skip lesions, any GI segment; UC: colon only, continuous'],['Coeliac diagnosis','Elevated IgA + anti-transglutaminase antibodies + tissue biopsy'],['Safe foods in coeliac','Corn, millet, sorghum, rice, quinoa'],['Diarrhoea 4 mechanisms','Osmotic, secretory, exudative, motility disturbances']]},
 {category:'GI', id:'gi_liver', name:'Hepatitis B, Cirrhosis & Hepatocellular Carcinoma', tags:['hepatitis','cirrhosis','liver cancer','HBV','jaundice'], summary:'HBV is a DNA virus causing liver inflammation that can progress to cirrhosis and hepatocellular carcinoma.', fields:{definition:'Hepatitis B (HBV): DNA virus, incubation 6–24 weeks, transmitted via body fluids. Cirrhosis: extensive liver scarring disrupting organised tissue framework and blood/bile flow; regeneration produces non-functional hepatocyte nodules. Hepatocellular carcinoma (HCC): primary liver cancer developing in chronic liver disease; cirrhosis is the predisposing factor in ~80%.', mechanism:'HBV → hepatocyte damage via immune-mediated response → liver inflammation. In 90–98% of adults, virus is eliminated; 2–10% progress to chronic infection. Chronic infection → ongoing hepatocyte destruction → fibrosis → cirrhosis. Regenerating hepatocytes undergo high mitotic activity → scope for oncogenic mutations → HCC. Malignant cells produce alpha-fetoprotein (AFP) — normally only synthesised in foetal liver.', manifestations:'Acute HBV: fever, anorexia, vomiting, abdominal pain, joint pain, dark urine, jaundice, steatorrhoea; 2–10% asymptomatic. Cirrhosis: fatigue, bleeding/bruising, anorexia, nausea, oedema, weight loss, itchy skin, jaundice, ascites, spider angiomas, palmar erythema, gynecomastia (men), confusion. Complications: portal hypertension, splenomegaly, hepatic encephalopathy, bacterial peritonitis, bone disease, HCC.', comparisons:'HBV (DNA virus, vaccine available, 6–24 week incubation) vs HCV (RNA virus, no vaccine, 6–10 weeks acute, >70% chronicity) vs HAV (RNA, faecal-oral, 14–28 days, no chronic infection, vaccine available). Acute HBV resolves in most adults; children more likely to become chronic carriers.', types:'Hepatitis A, B, C. HBV: acute, chronic, fulminant. Cirrhosis: alcohol-induced, viral hepatitis-induced. HCC: primary (cirrhosis-associated), secondary (metastatic from lung, breast, colon).', risk:'HBV: sexual contact, vertical (birth) transmission, injecting drug use, sharing razors/toothbrushes, medical/dental procedures. Cirrhosis: alcohol abuse, viral hepatitis, fatty liver disease. HCC: cirrhosis (~80%), chronic hepatitis B/C, alcoholic liver disease.', diagnosis:'HBV: HBsAg or anti-HBV antibodies in blood, elevated ALT/AST, low albumin, leukopenia. Cirrhosis: liver function tests, ultrasound/CT/MRI, liver biopsy. HCC: elevated AFP, 6-monthly liver ultrasound, CT/MRI, biopsy.', treatment:'HBV: interferon-alpha (IFN-α) for chronic infection (up to 50% respond); recombinant HBsAg vaccine (Engerix-B, Recombivax-HB; available since 1986). Cirrhosis: address cause (stop alcohol, antivirals), stop smoking, reduce salt, increase protein (muscle wasting), diuretics, medicines for confusion/bleeding/ascites, 6-monthly monitoring, vaccination. Liver transplant for end-stage disease.', drugs:'Interferon-alpha (IFN-α), antivirals (tenofovir, entecavir for chronic HBV), diuretics (spironolactone, furosemide), beta-blockers (portal hypertension), lactulose (hepatic encephalopathy), nutritional supplements, HBV vaccine.'}, flash:[['HBV type','DNA virus with 6–24 week incubation'],['HBV diagnostic marker','Hepatitis B surface antigen (HBsAg) or anti-HBV antibodies'],['Cirrhosis pathology','Extensive liver scarring — nodule formation replaces functional tissue'],['Cirrhosis sign — abdomen','Ascites (fluid accumulation in abdomen)'],['Caput medusae','Dilated abdominal veins from portal hypertension'],['Alpha-fetoprotein','Tumour marker for hepatocellular carcinoma'],['HBV vaccination','Available since 1986 — Engerix-B, Recombivax-HB'],['Hepatic encephalopathy','Brain dysfunction from inability to clear toxins in cirrhosis']]},
 {category:'GI', id:'gi_pancreas', name:'Pancreatitis, Cholecystitis & Gallstones', tags:['pancreatitis','gallstones','cholecystitis','cholelithiasis','pancreas'], summary:'Acute pancreatitis involves autodigestion from trapped enzymes; chronic pancreatitis leads to fibrosis; cholecystitis is gallbladder inflammation usually from gallstones.', fields:{definition:'Acute pancreatitis: obstruction blocks the pancreatic duct; enzymes back up, activate within the pancreas, and cause autodigestion (proteolysis and lipolysis of the pancreas itself). Chronic pancreatitis: ongoing inflammation → irreversible fibrosis and calcification, destroying islets of Langerhans. Cholecystitis: gallbladder inflammation, usually from gallstones (cholelithiasis) blocking bile drainage. Cholelithiasis: gallstones forming when cholesterol in bile becomes over-concentrated and precipitates.', mechanism:'Pancreatitis: obstruction (gallstones, alcohol) → blocked pancreatic duct → enzyme activation within pancreas → autodigestion → haemorrhage, oedema, vascular permeability increase, necrosis. Chronic pancreatitis: repeated insults → fibrosis, calcification, ductal obstruction, beta-cell damage → deranged glucose homeostasis. Gallstones: bile concentration → supersaturation of cholesterol/calcium → crystallisation → choleliths → obstruction. Gallstones blocking both common bile duct and pancreatic duct → acute pancreatitis. Pancreas exocrine functions: lipase (fat digestion), protease (protein digestion), amylase (carbohydrate digestion). Endocrine: insulin (beta cells), glucagon (alpha cells), gastrin, amylin.', manifestations:'Acute pancreatitis: epigastric pain radiating to back, pyrexia, nausea, vomiting, abdominal distension, raised blood sugar, malabsorption, tachypnoea, hypoxaemia, tachycardia, hypotension, renal impairment. Chronic pancreatitis: severe pain, weight loss, steatorrhoea, type 1 diabetes. Gallstones/cholecystitis: biliary colic, tachycardia, fat intolerance, nausea, vomiting, diaphoresis (Collin\'s sign).', comparisons:'Acute pancreatitis: reversible but potentially fatal; serum amylase and lipase elevated. Chronic pancreatitis: irreversible morphological changes (fibrosis, calcification). Acute cholecystitis: sudden onset. Chronic cholecystitis: long-term, often from repeated acute episodes.', types:'Acute pancreatitis, chronic pancreatitis; acute and chronic cholecystitis; cholesterol gallstones, pigment gallstones.', risk:'Pancreatitis: gallstones (most common), alcohol, trauma, drugs. Chronic: alcohol abuse most common. Gallstones: female sex, age >40, obesity, pregnancy, rapid weight loss, high-fat diet, diabetes, family history.', diagnosis:'Pancreatitis: elevated serum amylase and lipase, raised blood glucose, CT/MRI/ultrasound. Gallstones: ultrasound (first-line), CT, ERCP, liver function tests.', treatment:'Acute pancreatitis: nil by mouth, IV fluid support, antiemetics, analgesia, monitor blood sugar, treat cause. Chronic: analgesia, insulin, low-fat diet, coeliac ganglion block, endoscopic duct decompression. Gallstones: analgesia, low-fat diet, fluids, antiemetics, cholecystectomy, oral dissolution therapy, extracorporeal shock wave lithotripsy (ESWL).', drugs:'Antiemetics, analgesics, insulin, pancreatic enzyme replacement, ursodeoxycholic acid (oral dissolution of gallstones), antibiotics, IV fluids.'}, flash:[['Acute pancreatitis cause','Gallstones or alcohol → blocked duct → enzyme autodigestion'],['Elevated in acute pancreatitis','Serum amylase and lipase'],['Chronic pancreatitis complication','Fibrosis destroys islets of Langerhans → diabetes'],['Cholecystitis definition','Inflammation of the gallbladder'],['Gallstone formation','Cholesterol supersaturation in bile → crystallisation'],['Cholecystokinin role','Signals gallbladder to release bile into small intestine'],['Gallstone + pancreatic duct obstruction','Causes acute pancreatitis'],['Gallstone treatment options','Cholecystectomy, ESWL, or oral dissolution therapy']]},
