 {category:'Endocrine', id:'pituitary', name:'Pituitary Dysfunction: Acromegaly & Dwarfism', tags:['acromegaly','dwarfism','growth hormone','pituitary','GH'], summary:'The pituitary gland interfaces between the nervous and endocrine systems. GH excess causes acromegaly or gigantism; GH deficiency causes pituitary dwarfism.', fields:{definition:'Acromegaly: GH overproduction after bone maturity, most commonly from a benign pituitary macroadenoma. Pituitary dwarfism: GH hyposecretion causing growth failure; affects 1 in 25,000.', mechanism:'Acromegaly: slow-growing pituitary macroadenoma → excess GH → disproportionate connective tissue and skeletal growth in adults. In children, excess GH before bone maturity causes proportionate gigantism. Dwarfism: primary causes = abnormal foetal pituitary development or traumatic brain injury; secondary = anterior pituitary fails to respond to hypothalamic signals.', manifestations:'Acromegaly: tall stature; enlarged hands/feet; protruding jaw; enlarged tongue; thickened skin; cardiac enlargement; excess sweating; insulin resistance; hyperglycaemia. Dwarfism: stunted musculoskeletal growth; delayed teeth maturation; delayed puberty; hypoglycaemic episodes.', comparisons:'Acromegaly (GH excess) causes hyperglycaemia and disproportionate growth in adults; pituitary dwarfism (GH deficiency) causes hypoglycaemia and stunted growth. Gigantism occurs when GH excess develops before bone maturity — growth is proportionate, unlike acromegaly.', types:'GH excess: gigantism (pre-bone maturity), acromegaly (post-bone maturity). GH deficiency: pituitary dwarfism.', risk:'Acromegaly: benign pituitary macroadenoma (most common cause); rare — ~50 per million. Dwarfism: improper foetal pituitary development, traumatic brain injury, inability of anterior pituitary to respond to hypothalamic products.', diagnosis:'Acromegaly: pituitary hormone levels; GH remains elevated after oral glucose tolerance test (normally glucose suppresses GH); MRI/CT for pituitary tumour. Dwarfism: careful history; exclude GI disorders and malnutrition; blood hormone levels (GH, TSH, LH, FSH).', treatment:'Acromegaly: transsphenoidal surgical removal of tumour; radiation therapy if GH remains high; somatostatin analogue to suppress GH. Dwarfism: GH replacement therapy; synthetic GH analogues.', drugs:'Somatostatin analogues (acromegaly — suppress GH); synthetic GH analogues (dwarfism replacement therapy).'}, flash:[['Acromegaly cause','Benign pituitary macroadenoma → GH excess after bone maturity'],['Gigantism vs Acromegaly','Gigantism = GH excess in children (proportionate); Acromegaly = GH excess in adults (disproportionate)'],['Acromegaly metabolic effect','Insulin resistance and hyperglycaemia'],['Dwarfism glucose finding','Hypoglycaemia (opposite of acromegaly)'],['GH suppression test','Normally glucose suppresses GH — in acromegaly it does not'],['Acromegaly surgery route','Transsphenoidal — through the nose'],['Dwarfism management','Synthetic GH analogue replacement therapy'],['Acromegaly prevalence','~50 per million population']]},
 {category:'Endocrine', id:'thyroid', name:'Thyroid Dysfunction: Hyperthyroidism, Hypothyroidism & Hashimoto\'s', tags:['thyroid','hyperthyroidism','hypothyroidism','graves','hashimoto','T3','T4','TSH'], summary:'The thyroid secretes T3, T4, and calcitonin. Excess hormone causes hyperthyroidism (Graves\' disease); deficiency causes hypothyroidism; Hashimoto\'s is an autoimmune cause of hypothyroidism.', fields:{definition:'Hyperthyroidism (thyrotoxicosis): excess thyroid hormone (T3/T4) — most commonly from Graves\' disease (autoimmune). Hypothyroidism: deficient thyroid hormone — most common functional thyroid disorder; severe acquired form = myxoedema. Hashimoto\'s thyroiditis (chronic lymphocytic thyroiditis): autoimmune destruction of thyroid tissue causing hypothyroidism.', mechanism:'Graves\' disease: autoantibodies bind and activate TSH receptors on follicular cells → continuous T3/T4 overproduction → TSH falls via negative feedback. Hypothyroidism: primary = deficient TH production (abnormal development, autoimmune attack, iodine deficiency, post-treatment tissue loss); secondary = pituitary/hypothalamus failure → inadequate TSH. Hashimoto\'s: autoantibodies vs thyroid peroxidase, thyroglobulin, and TSH receptors → T lymphocyte infiltration and fibrosis → tissue destruction. Myxoedema: mucopolysaccharide accumulation in tissue → thick gel-like non-pitting oedema.', manifestations:'Hyperthyroidism: tachycardia, palpitations, muscle weakness, fatigue, increased GI motility, heat intolerance, weight loss, increased appetite, nervousness, hyperreflexia, insomnia, menstrual irregularities. Graves\' specific: exophthalmos (bulging eyes from autoantibody-mediated inflammation behind eye sockets), goitre. Hypothyroidism: weight gain, lethargy, slow mental function, hyporeflexia, cold intolerance, bradycardia, constipation, loss of appetite. Myxoedema: thickened skin/tongue, periorbital puffiness, dry coarse skin, brittle hair, menstrual dysfunction, infertility.', comparisons:'Hyperthyroidism: heat intolerance, tachycardia, weight loss, HIGH T3/T4, LOW TSH. Hypothyroidism: cold intolerance, bradycardia, weight gain, LOW T3/T4, HIGH TSH (primary) or LOW TSH (secondary). Graves\' disease: overactivates thyroid via TSH-receptor autoantibodies. Hashimoto\'s: destroys thyroid tissue via T lymphocyte infiltration. Both are autoimmune but have opposite hormonal effects.', types:'Hyperthyroidism: Graves\' disease (most common), pituitary tumour, thyroid tumour, iodine-containing medications. Hypothyroidism: congenital/neonatal, acquired (myxoedema), primary, secondary. Also: Hashimoto\'s thyroiditis; thyroid storm (life-threatening extreme of hyperthyroidism).', risk:'Graves\': female sex, familial inheritance, possible Yersinia enterocolitica link (TSH receptor mimicry). Hypothyroidism: iodine deficiency, post-treatment tissue loss, autoimmune (Hashimoto\'s). Hashimoto\'s: genetic predisposition (HLA-DR5, CTLA-4), high iodine intake, selenium deficiency, certain drugs, infections.', diagnosis:'Hyperthyroidism: physical exam (goitre), thyroid function test (HIGH T3/T4 + LOW TSH), TSH-receptor autoantibodies, thyroid scan/CT/MRI/ultrasound. Hypothyroidism: goitre, LOW free T4 / LOW T3/T4, HIGH TSH (primary), antithyroid antibodies, low radioiodine uptake. Hashimoto\'s: elevated TPO antibodies, anti-thyroglobulin antibodies.', treatment:'Hyperthyroidism: antithyroid drugs (propylthiouracil, carbimazole) block hormone synthesis; radioactive iodine (I-123/I-131) destroys thyroid tissue; surgery (rare). Complication of treatment: hypothyroidism. Hypothyroidism: levothyroxine (thyroid hormone replacement), start low dose and increase; myxoedema coma = intensive care emergency. Hashimoto\'s: levothyroxine replacement.', drugs:'Antithyroid drugs: propylthiouracil, carbimazole (hyperthyroidism). Radioactive iodine (I-123, I-131). Thyroid hormone replacement: levothyroxine (hypothyroidism, Hashimoto\'s).'}, flash:[['Graves\' disease mechanism','Autoantibodies activate TSH receptors → continuous T3/T4 overproduction'],['Exophthalmos','Bulging eyes — characteristic of Graves\' disease; autoantibody-mediated retro-orbital inflammation'],['Hyperthyroidism TFT result','HIGH T3/T4, LOW TSH'],['Hypothyroidism TFT result (primary)','LOW T3/T4, HIGH TSH'],['Myxoedema','Non-pitting oedema from mucopolysaccharide accumulation — severe hypothyroidism'],['Hashimoto\'s cell type','T lymphocyte infiltration destroying thyroid tissue'],['Thyroid storm','Life-threatening extreme hyperthyroidism from massive T3/T4 release'],['Hypothyroidism treatment','Levothyroxine — start at low dose and gradually increase']]},
 {category:'Endocrine', id:'parathyroid', name:'Hypoparathyroidism', tags:['parathyroid','PTH','hypocalcaemia','calcium','tetany'], summary:'Low or absent PTH causes hypocalcaemia, increasing neuromuscular excitability and causing muscle spasms, tetany, and cardiac arrhythmia.', fields:{definition:'Hypoparathyroidism: low or absent parathyroid hormone (PTH) leading to hypocalcaemia and increased neuromuscular excitability.', mechanism:'PTH regulates calcium. Without PTH: osteoclast activity falls → hypocalcaemia → increased nerve and muscle excitability. Magnesium is essential for PTH receptor activation — hypomagnesaemia (from renal disease, alcoholism, malnutrition) can trigger hypoparathyroidism. Common iatrogenic cause: accidental parathyroid removal during thyroidectomy.', manifestations:'Muscle spasms, twitching, and tetany; paraesthesia; fatigue; mood changes; cardiac arrhythmia.', comparisons:'Hypocalcaemia increases neuromuscular excitability (spasms, tetany). Hypercalcaemia (seen in Cushing\'s disease) causes the opposite — kidney stones and bone loss. Hypoparathyroidism is distinguished from other causes of hypocalcaemia by low PTH levels.', types:'Iatrogenic (post-thyroidectomy), autoimmune, hypomagnesaemia-induced.', risk:'Thyroidectomy (most common — parathyroid glands may be inadvertently removed or devascularised); autoimmune disease; renal disease, alcoholism, malnutrition (via hypomagnesaemia).', diagnosis:'Low serum calcium; X-ray/densitometry showing increased bone density in specific regions; low serum magnesium.', treatment:'Goal: normalise serum calcium. High-calcium diet and oral calcium gluconate; vitamin D supplementation; IV synthetic PTH therapy (rare).', drugs:'Calcium gluconate (oral or IV), vitamin D analogues (calcitriol), magnesium supplements if needed, IV synthetic PTH (teriparatide) in rare refractory cases.'}, flash:[['Hypoparathyroidism key consequence','Hypocalcaemia → increased neuromuscular excitability'],['Tetany','Involuntary muscle spasms from hypocalcaemia'],['Most common cause of hypoparathyroidism','Inadvertent parathyroid removal during thyroidectomy'],['Magnesium role','Essential for PTH receptor activation — deficiency can cause hypoparathyroidism'],['Hypoparathyroidism diagnosis','Low serum calcium + low serum PTH'],['Treatment goal','Normalise serum calcium'],['Cardiac risk in hypoparathyroidism','Arrhythmia from hypocalcaemia'],['X-ray finding','Increased bone density in specific regions']]},
 {category:'Endocrine', id:'adrenal', name:'Adrenal Dysfunction: Cushing\'s, Addison\'s & Pheochromocytoma', tags:['cushing','addison','pheochromocytoma','adrenal','cortisol','aldosterone','catecholamine'], summary:'Adrenal disorders include Cushing\'s (cortisol excess), Addison\'s (adrenal insufficiency), and pheochromocytoma (catecholamine excess from adrenal medulla tumour).', fields:{definition:'Cushing\'s disease: excessive cortisol production from pituitary or adrenal tumour. Cushing\'s syndrome: cortisol excess from prolonged glucocorticoid drug therapy. Addison\'s disease: primary adrenal insufficiency — deficiency of all corticosteroids (cortisol, aldosterone, androgens). Pheochromocytoma: catecholamine-secreting tumour of the adrenal medulla (adrenaline and noradrenaline excess).', mechanism:'Adrenal cortex functions (4S): Stress response (cortisol), Sugar availability (glucocorticoids), Salt balance (aldosterone), Sexual development (gonadocorticoids). Cushing\'s: tumour in pituitary/adrenal cortex → excess ACTH or cortisol → metabolic, immune, and skeletal effects. Addison\'s: most common = autoimmune antibodies against 21-beta-hydroxylase (key enzyme in adrenal steroidogenesis) → all corticosteroid deficiency → compensatory ACTH rise → hyperpigmentation (ACTH acts like MSH on skin). Pheochromocytoma: medullary neuroendocrine tumour → surges of adrenaline/noradrenaline → sympathetic storm.', manifestations:'Cushing\'s: moon face, central obesity, weight gain (Na/water retention), hypertension, gluconeogenesis increase + insulin resistance → diabetes, hypercalcaemia → kidney stones, osteoporosis, T-cell immunosuppression. Addison\'s: fatigue, anorexia, weight loss, hypoglycaemia, hypotension, muscle weakness, depression, hyponatraemia, hyperkalaemia, sparse body hair, hyperpigmentation of skin (palmar creases, buccal mucosa, lips, nipples). Pheochromocytoma (5H): Hypertension, Headache, Hyperglycaemia, Hypermetabolism, Hyperhidrosis; also flushing, tremor, anxiety, cardiovascular symptoms.', comparisons:'Cushing\'s = cortisol EXCESS: moon face, obesity, hypertension, hyperglycaemia, immunosuppression, HIGH urinary cortisol. Addison\'s = cortisol DEFICIENCY: weight loss, hypotension, hypoglycaemia, hyperpigmentation, LOW cortisol. Cushing\'s Syndrome (drug-induced) vs Cushing\'s Disease (tumour-driven). Pheochromocytoma affects the medulla (catecholamines); Cushing\'s and Addison\'s affect the cortex (corticosteroids).', types:'Cushing\'s disease (tumour), Cushing\'s syndrome (iatrogenic); primary Addison\'s (autoimmune) vs secondary (ACTH deficiency); pheochromocytoma (adrenal medulla), paraganglioma (extra-adrenal catecholamine-secreting tumour).', risk:'Cushing\'s: pituitary or adrenal tumour; prolonged glucocorticoid therapy. Addison\'s: autoimmune (most common), inflammation, tumour, congenital malformation, pituitary ACTH deficiency. Pheochromocytoma: adrenal medullary tumour; extra-adrenal paraganglioma.', diagnosis:'Cushing\'s: high 24-hour urinary free cortisol. Addison\'s: low serum/urine cortisol, aldosterone, androgens, and ACTH; autoantibodies to 21-beta-hydroxylase. Pheochromocytoma: elevated urinary free catecholamines and metabolites; CT/MRI scan.', treatment:'Cushing\'s: remove pituitary-dependent tumour or radiation therapy; adrenal steroidogenesis inhibitors. Addison\'s: hormone replacement — intermediate-acting prednisolone or long-acting dexamethasone. Pheochromocytoma: surgical removal of tumour; beta-blockers and vasodilators for cardiac complications.', drugs:'Cushing\'s: adrenal steroidogenesis inhibitors (metyrapone, ketoconazole). Addison\'s: prednisolone (intermediate-acting), dexamethasone (long-acting corticosteroid replacement). Pheochromocytoma: beta-blockers, vasodilators (alpha-blockers pre-operatively).'}, flash:[['Cushing\'s disease cause','Pituitary or adrenal cortex tumour → cortisol excess'],['Cushing\'s vs Addison\'s hyperpigmentation','Addison\'s: YES (compensatory ACTH excess mimics MSH). Cushing\'s: NO'],['Addison\'s electrolytes','Hyponatraemia (low Na) + Hyperkalaemia (high K) — aldosterone deficiency'],['Addison\'s autoimmune target','21-beta-hydroxylase (enzyme in adrenal steroidogenesis)'],['Pheochromocytoma 5H','Hypertension, Headache, Hyperglycaemia, Hypermetabolism, Hyperhidrosis'],['Pheochromocytoma diagnosis','Elevated urinary catecholamines + CT/MRI scan'],['Cushing\'s diagnosis','High 24-hour urinary free cortisol'],['Adrenal 4S functions','Stress response, Sugar availability, Salt balance, Sexual development']]},
 {category:'Endocrine', id:'diabetes', name:'Diabetes Mellitus: T1D & T2D', tags:['diabetes','T1D','T2D','insulin','hyperglycaemia','beta cell','DKA'], summary:'Diabetes mellitus is a metabolic disorder of insulin secretion and/or action causing hyperglycaemia. T1D involves autoimmune beta-cell destruction; T2D involves insulin resistance in peripheral tissues.', fields:{definition:'Diabetes mellitus (DM): metabolic disorder characterised by abnormal insulin secretion and/or action → hyperglycaemia. T1D: autoimmune destruction of pancreatic beta cells → absolute insulin deficiency (~10% of DM). T2D: insulin resistance in peripheral tissue with receptor downregulation → compensatory hyperinsulinaemia → eventually beta-cell exhaustion (~90% of DM).', mechanism:'Insulin: secreted by beta cells of islets of Langerhans; primary regulator of glucose metabolism; promotes glycogen synthesis, protein synthesis, lipogenesis; suppresses gluconeogenesis and lipolysis. T1D: immune-mediated (T cells dominant) destruction of beta cells → hypoinsulinaemia → hyperglycaemia. T2D: receptor downregulation on peripheral cells → deranged intracellular signalling → decreased glucose uptake → hyperglycaemia despite high insulin; obesity → excess free fatty acids → gluconeogenesis, insulin resistance, beta-cell impairment. Metabolic syndrome (obesity + insulin resistance + hypertension + dyslipidaemia) = high T2D risk.', manifestations:'Hyperglycaemia → increased osmotic pressure → cellular dehydration. Cardinal symptoms: polydipsia (thirst), polyuria (excess urine output), glycosuria (glucose in urine), polyphagia (hunger — cells starved despite high blood glucose). Complications: DKA (T1D — fat mobilisation → ketone bodies → acidosis), non-ketotic hyperosmolar coma (NKHC), microvascular disease (retinopathy, nephropathy, cataracts), macrovascular disease (atherosclerosis, coronary heart disease, stroke), neuropathy.', comparisons:'T1D: autoimmune, absolute insulin deficiency, autoantibodies PRESENT, peak onset 10–19 years, DKA common. T2D: insulin resistance, no autoantibodies, associated with obesity/age/inactivity, gradual onset, NKHC more common. Normal blood glucose: 4–8 mmol/L. Glucose normal range must be maintained — both hypoglycaemia and hyperglycaemia cause complications.', types:'T1D (immune-mediated), T2D (insulin resistance/metabolic), gestational diabetes. DKA: acute complication of T1D. NKHC: acute complication, more common in T2D.', risk:'T1D: HLA genetic predisposition, viral infection triggers, dietary proteins, hormonal stress at puberty, altered gut flora. T2D: obesity (strongly associated), inactivity, age, family history, metabolic syndrome, excess free fatty acids. T2D accounts for 90% of DM; global prevalence ~500 million and rising.', diagnosis:'2-hour post OGTT: ≥8–9 mmol/L; fasting blood glucose ≥6.1 mmol/L; HbA1c ≥8% (poor long-term glucose control); medical history (polyuria, polydipsia, blurred vision, weight loss, recurrent infections).', treatment:'T1D: exogenous insulin replacement (essential), dietary management, exercise, electrolyte and fluid support for DKA. T2D: diet and weight loss (restore insulin sensitivity), oral hypoglycaemic agents; medications for complications (antihypertensives, lipid-lowering drugs, antibiotics).', drugs:'T1D: exogenous insulin (rapid, intermediate, long-acting). T2D oral agents: euglycaemic agents, α-glucosidase inhibitors, metformin, sulfonylureas. Other: antihypertensives, lipid-lowering drugs, antibiotics.'}, flash:[['Defining feature of all DM','Hyperglycaemia (high blood glucose)'],['T1D mechanism','Autoimmune T-cell mediated beta-cell destruction → absolute insulin deficiency'],['T2D mechanism','Peripheral insulin resistance (receptor downregulation) → compensatory hyperinsulinaemia'],['Autoantibodies in T2D','ABSENT — their presence suggests T1D or autoimmune component'],['DKA pathophysiology','Cells starved → fat mobilised → free fatty acids → ketone bodies → metabolic acidosis'],['Polydipsia mechanism','Hyperglycaemia → raised osmolality → cellular dehydration → thirst'],['HbA1c ≥8%','Indicates poor long-term blood glucose control'],['Metabolic syndrome components','Central obesity + insulin resistance + hypertension + dyslipidaemia']]},

 {category:'Blood', id:'white_cell_disorders', name:'Leukaemia, Lymphoma, Multiple Myeloma & Agranulocytosis', tags:['leukaemia','lymphoma','myeloma','agranulocytosis','white cell'], summary:'White cell disorders include malignant proliferation of bone marrow cells (leukaemia), lymphoid cells (lymphoma), plasma cells (myeloma), and reduced granulocytes (agranulocytosis).', fields:{
   definition:'Leukaemia: malignant neoplastic disorder of white cells in the bone marrow with blocked differentiation of haemopoietic stem cells; tumour cells flood the circulating blood. Lymphoma: malignant neoplastic disorder of lymphoid cells — does NOT initially involve the bone marrow. Multiple myeloma: malignant B-cell tumour (plasma cell neoplasm) that produces abnormal immunoglobulins, destroying bone marrow and bone. Agranulocytosis: significant decrease in granulocytes (neutrophils, eosinophils, basophils) due to bone marrow failure.',
   mechanism:'Leukaemia: progenitor cell alteration leads to leukocyte production disorder and bone marrow overcrowding, displacing normal cells. Lymphoma: Hodgkin lymphoma originates from a single lymph node/chain and is characterised by Reed-Sternberg cells (large multinucleated cells). Non-Hodgkin lymphoma has a multifocal origin involving B and T lymphocytes without Reed-Sternberg cells. Multiple myeloma: abnormal immunoglobulins (M proteins) cause lytic bone lesions. Agranulocytosis: autoimmune destruction of neutrophils, congenital forms, or drug-induced.',
   manifestations:'Leukaemia: CNS manifestations, enlarged lymphatic structures, anorexia, fatigue, infections, bone marrow overcrowding causing secondary anaemia, thrombocytopenia, haemorrhage, and bone pain. Lymphoma: lymphadenopathy, fever, night sweats, weight loss. Multiple myeloma: bone pain, pathological fractures, hypercalcaemia, renal failure, anaemia, infections. Agranulocytosis: severe infections from lack of neutrophil defence.',
   comparisons:'Leukaemia involves the bone marrow from the start; lymphoma does not initially but may progress to it. Hodgkin lymphoma (Reed-Sternberg cells, single node origin) vs Non-Hodgkin lymphoma (multifocal, no Reed-Sternberg cells, older adults 50–70 years, associated with EBV, oncogenes, radiation, chemicals). Acute leukaemias (lymphoblastic or myelogenous) present rapidly and involve immature cells; chronic leukaemias involve more mature cells and have slower onset.',
   types:'Acute lymphoblastic leukaemia (ALL), acute myelogenous leukaemia (AML), chronic lymphocytic leukaemia (CLL), chronic myelogenous leukaemia (CML), Hodgkin lymphoma, Non-Hodgkin lymphoma, multiple myeloma, agranulocytosis.',
   risk:'Leukaemia: wide age range; pathophysiology varies by type. Multiple myeloma: increasing age, radiation, chemical exposure (herbicides), genetic mutations. Non-Hodgkin lymphoma: EBV, oncogenes, radiation, chemicals. Agranulocytosis: congenital, autoimmune, drug-induced.',
   diagnosis:'FBC and differential, bone marrow biopsy, immunophenotyping, cytogenetics, lymph node biopsy (lymphoma), serum protein electrophoresis — M protein (myeloma), skeletal survey (myeloma).',
   treatment:'Leukaemia: corticosteroids, chemotherapy, immunomodulators, bone marrow transplant, nutrition support, infection control, analgesia. Lymphoma: chemotherapy, radiotherapy, immunotherapy. Multiple myeloma: chemotherapy, proteasome inhibitors, stem cell transplant, bisphosphonates. Agranulocytosis: stop offending medication, antibiotics, G-CSF/GM-CSF (granulocyte macrophage colony stimulating factor), bone marrow transplant.',
   drugs:'Corticosteroids, cytotoxic chemotherapy agents, G-CSF (filgrastim), GM-CSF, rituximab (anti-CD20 for B-cell lymphoma), proteasome inhibitors (bortezomib for myeloma), bisphosphonates, antibiotics.'
 }, flash:[['Leukaemia definition','Malignant WBC disorder from bone marrow with cells flooding the blood'],['Reed-Sternberg cells','Large multinucleated cells — hallmark of Hodgkin lymphoma'],['Hodgkin vs Non-Hodgkin','Hodgkin: single node, Reed-Sternberg. Non-Hodgkin: multifocal, no Reed-Sternberg'],['Multiple myeloma cell','Malignant B cell (plasma cell) producing abnormal immunoglobulins'],['Multiple myeloma bone effect','Lytic lesions from abnormal immunoglobulin destruction'],['Agranulocytosis','Significant drop in granulocytes due to bone marrow failure'],['CML treatment clue','Bone marrow transplant, chemotherapy'],['Acute lymphoblastic leukaemia','Most common in children; involves immature B and T lymphocytes']]},

 {category:'Reproductive', id:'female_menstrual', name:'Female: Menstrual Disorders', tags:['dysmenorrhoea','amenorrhoea','menorrhagia','menstrual','PCOS'], summary:'Menstrual disorders include painful periods (dysmenorrhoea), absent periods (amenorrhoea), and abnormal bleeding patterns including heavy, irregular, and intermenstrual bleeding.', fields:{definition:'Dysmenorrhoea: uterine pain before or during menstruation — primary (no pathological cause) or secondary (identifiable cause such as endometriosis). Amenorrhoea: absence or cessation of menses — primary (failure by age 16) or secondary (absent ≥3 months in previously regular cycles). Heavy menstrual bleeding (HMB): excessive blood loss across several cycles. Menorrhagia: >80 mL per cycle. Metrorrhagia: prolonged irregular menstruation. Polymenorrhoea: cycles <21 days. Oligomenorrhoea: infrequent scanty menstruation.', mechanism:'Primary dysmenorrhoea: elevated prostaglandins → intense uterine contractions and spasm → myometrial ischaemia → pain and systemic effects (nausea, vomiting, diarrhoea, headache). Secondary dysmenorrhoea: caused by an underlying pathology such as endometriosis. Amenorrhoea results from disorders affecting normal, decreased, or increased ovarian hormone secretion — causes include PCOS, hypothalamic dysfunction (excess exercise, weight loss), hyperprolactinaemia, and primary ovarian insufficiency.', manifestations:'Dysmenorrhoea: crampy lower abdominal pain, sharp or dull ache, nausea, vomiting, diarrhoea, headache, back pain. Amenorrhoea: absent periods, may include signs of underlying cause (galactorrhoea in hyperprolactinaemia, virilisation in PCOS). HMB: heavy prolonged periods, anaemia, fatigue.', comparisons:'Primary dysmenorrhoea: adolescent onset, pain first 2–3 days, no other pain types. Secondary dysmenorrhoea: onset any age after pain-free years, exacerbated by menstruation but may persist throughout cycle, associated dyspareunia. Primary amenorrhoea: never menstruated. Secondary amenorrhoea: previously menstruated.', types:'Primary dysmenorrhoea, secondary dysmenorrhoea; primary amenorrhoea, secondary amenorrhoea; menorrhagia, metrorrhagia, polymenorrhoea, oligomenorrhoea, postcoital bleeding, intermenstrual bleeding, postmenopausal bleeding.', risk:'Dysmenorrhoea: low BMI, smoking, early menarche (<12 years), nulliparity, heavy or long cycles, family history, elevated prostaglandins. Amenorrhoea: PCOS, extreme exercise or weight loss, hyperprolactinaemia, primary ovarian insufficiency.', diagnosis:'History, physical and gynaecological examination, pelvic ultrasound, hormone levels (FSH, LH, prolactin, oestrogen), thyroid function, pregnancy test.', treatment:'Dysmenorrhoea: NSAIDs, oral contraceptive pill, exercise (releases endorphins). Amenorrhoea: target the underlying cause. HMB: levonorgestrel IUD, tranexamic acid, NSAIDs, combined OCP, oral or injected progesterone. Polymenorrhoea: OCP, clomiphene for anovulation.', drugs:'NSAIDs (dysmenorrhoea), combined oral contraceptive pill, levonorgestrel, tranexamic acid, clomiphene, progesterone preparations, GnRH agonists.'}, flash:[['Primary dysmenorrhoea cause','Elevated prostaglandins → uterine spasm and ischaemia'],['Secondary dysmenorrhoea associated with','Endometriosis (identifiable pathological cause)'],['Primary amenorrhoea definition','Failure to menstruate by age 16'],['Secondary amenorrhoea definition','Absent menses ≥3 months in previously regular cycles'],['Menorrhagia threshold','>80 mL blood loss per cycle'],['Polymenorrhoea','Cycles shorter than 21 days'],['Dysmenorrhoea first-line treatment','NSAIDs and/or oral contraceptive pill'],['Prostaglandin excess systemic effect','Nausea, vomiting, diarrhoea, headache, back pain']]},
 {category:'Reproductive', id:'female_neoplasms', name:'Female: Endometriosis, PCOS & Uterine Fibroids', tags:['endometriosis','PCOS','fibroids','polycystic','ovarian cyst'], summary:'Endometriosis involves ectopic endometrial tissue outside the uterus; PCOS is a hormonal disorder linked to insulin resistance; uterine fibroids are benign myometrial tumours.', fields:{definition:'Endometriosis: ectopic endometrial tissue (implants) outside the uterine cavity, affecting 5–10% of women; proposed mechanism is retrograde menstruation through open fallopian tubes. PCOS (polycystic ovary syndrome): diagnosed when two of three criteria are present — irregular or absent ovulation, hyperandrogenaemia, polycystic ovaries. Uterine fibroids (leiomyomas/myomas): benign tumours of the myometrium — intramural, submucosal, pedunculated, or mixed.', mechanism:'Endometriosis: endometrial fragments enter pelvic cavity → must evade body defences → adhere to peritoneum → establish self-sustaining system that cycles with hormones. PCOS: hyperinsulinaemia → decreased SHBG + increased ovarian androgen production + disordered LH/FSH release → hyperandrogenism → anovulation → polycystic ovaries. Fibroids: oestrogen and progesterone dependent proliferation; particularly sensitive to progesterone but later dependent on a mix of endogenous hormones.', manifestations:'Endometriosis: secondary dysmenorrhoea, dyspareunia, pelvic pain, infertility. PCOS: hirsutism, acne, obesity, amenorrhoea, infertility. Fibroids: abnormal uterine bleeding, pelvic pain/pressure, urinary symptoms, infertility (location dependent).', comparisons:'Endometriosis is ectopic endometrial tissue causing cyclical inflammation. PCOS is a metabolic-hormonal disorder with androgen excess and anovulation. Fibroids are benign structural tumours of myometrium sensitive to sex hormones.', types:'Endometriosis (peritoneal, ovarian, deep infiltrating). PCOS. Fibroids: intramural, submucosal, pedunculated, mixed.', risk:'Endometriosis: retrograde menstruation, genetic susceptibility. PCOS: hyperinsulinaemia, insulin resistance, genetic predisposition; associated with obesity and metabolic syndrome. Fibroids: oestrogen/progesterone sensitivity, most common in women of reproductive age.', diagnosis:'Endometriosis: laparoscopy (gold standard). PCOS: ultrasound (polycystic ovaries), serum androgens, LH/FSH ratio, glucose and insulin levels. Fibroids: pelvic ultrasound, MRI, hysteroscopy.', treatment:'Endometriosis: NSAIDs, hormonal suppression (OCP, GnRH agonists), laparoscopic excision. PCOS: lifestyle modification, metformin (insulin sensitiser), OCP for menstrual regulation, clomiphene for ovulation induction. Fibroids: watchful waiting, NSAIDs, hormonal therapy (GnRH agonists to shrink fibroids pre-surgery), myomectomy, hysterectomy.', drugs:'NSAIDs, OCP, GnRH agonists, metformin, clomiphene, progesterone analogues, levonorgestrel IUD.'}, flash:[['Endometriosis mechanism','Retrograde menstruation → peritoneal implantation → cyclical inflammation'],['PCOS diagnosis criteria','Two of three: irregular ovulation, hyperandrogenaemia, polycystic ovaries'],['PCOS metabolic driver','Hyperinsulinaemia → ovarian androgen excess → anovulation'],['PCOS key symptoms','Hirsutism, acne, obesity, amenorrhoea, infertility'],['Uterine fibroids histology','Benign myometrial smooth muscle tumours (leiomyomas)'],['Fibroid hormone dependency','Oestrogen and progesterone dependent proliferation'],['Endometriosis gold standard diagnosis','Laparoscopy'],['PCOS insulin treatment','Metformin — restores insulin sensitivity']]},
 {category:'Reproductive', id:'female_cancers', name:'Female: Cervical, Uterine & Ovarian Cancer', tags:['cervical cancer','uterine cancer','ovarian cancer','HPV','endometrial'], summary:'Cervical cancer is strongly linked to HPV; uterine (endometrial) cancer is common in post-menopausal women; ovarian cancer is a silent disease with poor prognosis.', fields:{definition:'Cervical cancer: one of the leading causes of cancer death worldwide; most are squamous cell carcinomas; causal relationship with HPV serotypes 16 and 18 via cervical intraepithelial neoplasia (CIN). Uterine (endometrial) cancer: malignant cells in the endometrium; one of the most common cancers in women, particularly post-menopausal aged 50–70. Ovarian cancer: considered a top gynaecological malignancy; most arise from the epithelial surface; silent disease with poor prognosis; diagnosed mainly in postmenopausal women aged 50–80.', mechanism:'Cervical cancer: HPV infection → CIN (pre-malignant precursor) → invasive carcinoma. Uterine cancer: risk factors → endometrial hyperplasia → malignant transformation → invasion of myometrium → metastasis via FIGO staging. Ovarian cancer: often advanced at diagnosis due to vague symptoms; can spread via peritoneal seeding to omentum, liver, diaphragm, stomach, colon.', manifestations:'Cervical cancer: malodorous vaginal discharge, postcoital bleeding, dyspareunia. Uterine cancer: unusual vaginal bleeding after menopause, pelvic pain, vague abdominal pain, nausea, dysuria. Ovarian cancer: vague and non-specific — abdominal bloating, pelvic pain, bowel/urinary complaints; often asymptomatic until advanced.', comparisons:'Cervical: HPV-driven, affects younger women, preventable by vaccine and screening; squamous cell type. Uterine: oestrogen-driven, post-menopausal, good prognosis if detected early; adenocarcinoma. Ovarian: silent, poor prognosis, epithelial origin, BRCA1/BRCA2 risk genes.', types:'Cervical: squamous cell carcinoma (most), glandular tissue; FIGO Stages I–IV. Uterine: endometrial adenocarcinoma; FIGO Stages IA–IVB. Ovarian: epithelial (most common), germ cell, stromal; FIGO Stages I–IV.', risk:'Cervical: HPV, smoking, immunodeficiency, multiple sexual partners. Uterine: obesity, metabolic syndrome, tamoxifen, unopposed oestrogen, PCOS, HRT, family history, endometrial hyperplasia. Ovarian: advancing age, family history, BRCA1/BRCA2 mutations, increased ovulatory cycles, endometriosis.', diagnosis:'Cervical: Pap smear, colposcopy, biopsy, FIGO staging. Uterine: transvaginal ultrasound (endometrium >4 mm warrants biopsy), endometrial biopsy, histopathology, CT/MRI staging. Ovarian: pelvic/transvaginal ultrasound, CA-125 tumour marker, CT/MRI, laparotomy for definitive staging.', treatment:'Cervical: HPV vaccine (prevention), cone biopsy/trachelectomy (early), hysterectomy, radiotherapy (chemoradiation). Uterine: hysterectomy (primary), progestin therapy, chemotherapy (carboplatin, paclitaxel, doxorubicin), radiotherapy. Ovarian: cytoreductive surgery (debulking), oophorectomy, chemotherapy (platinum-based), HRT post-treatment.', drugs:'Cervical: HPV vaccine, cisplatin (chemoradiation). Uterine: carboplatin, cisplatin, paclitaxel, docetaxel, doxorubicin, progestin. Ovarian: platinum-based agents, paclitaxel, PARP inhibitors (BRCA-positive).'}, flash:[['Cervical cancer HPV types','Serotypes 16 and 18 — causal relationship established'],['CIN definition','Cervical intraepithelial neoplasia — pre-malignant precursor to cervical cancer'],['Uterine cancer most common type','Endometrial adenocarcinoma'],['Uterine cancer key risk factor','Obesity and unopposed oestrogen stimulation'],['Ovarian cancer prognosis','Poor — often silent until advanced stage'],['Ovarian cancer genetic risk','BRCA1 and BRCA2 mutations; Lynch syndrome'],['Cervical cancer prevention','HPV vaccination and regular Pap smear screening'],['Ovarian cancer metastasis sites','Peritoneum, omentum, diaphragm, liver, colon']]},
 {category:'Reproductive', id:'male_penis', name:'Male: Disorders of the Penis', tags:['phimosis','paraphimosis','peyronie','erectile dysfunction','priapism'], summary:'Penis disorders include phimosis, paraphimosis, Peyronie disease (fibrous plaque causing curvature), erectile dysfunction (psychogenic or organic), and priapism (persistent painful erection).', fields:{definition:'Phimosis: inability to retract the foreskin from the glans due to tightness — normal in infancy. Paraphimosis: inability to replace the foreskin once retracted — acute paraphimosis is a medical emergency. Peyronie disease (bent nail syndrome): slow development of fibrous plaques in the tunica albuginea causing lateral penile curvature during erection. Erectile dysfunction (ED): sexual arousal disorder — inability to achieve or maintain erection. Priapism: persistent penile erection unrelated to sexual stimulation, lasting 30 minutes to 3 hours — a urological emergency.', mechanism:'Phimosis: tightness from poor hygiene, infection, inflammation, or trauma. Paraphimosis: failure of foreskin to return to usual position → vascular engorgement and oedema. Peyronie: fibrous plaque formation in tunica albuginea → restricts expansion on one side during erection → curvature. ED (psychogenic): performance anxiety, stress, psychiatric conditions, drug side effects. ED (organic): neurogenic (Parkinson, stroke, spinal injury), vascular (hypertension, atherosclerosis, diabetes), hormonal (hypogonadism). Priapism: imbalance between arterial inflow and venous outflow — low flow (ischaemic, from sickle cell anaemia, neurological disease, cancer) or high flow (non-ischaemic, from trauma).', manifestations:'Phimosis: itching, pain, discomfort, bleeding on intercourse, smegma. Paraphimosis: painful oedematous glans. Peyronie: painful erections, lateral curvature, difficulty with intercourse in middle-aged men. ED: inability to achieve erection, reduced libido, early ejaculation. Priapism: persistent painful erection, corpus cavernosum engorgement.', comparisons:'Phimosis vs Paraphimosis: phimosis = cannot retract foreskin; paraphimosis = cannot return retracted foreskin. ED psychogenic vs organic: psychogenic causes include anxiety, stress, psychiatric conditions, and drug effects; organic causes include neurological, vascular, and hormonal factors. Priapism low flow vs high flow: low flow is ischaemic and more dangerous; high flow is non-ischaemic and from trauma.', types:'Phimosis, paraphimosis, Peyronie disease, erectile dysfunction (psychogenic, organic, combined), priapism (low-flow/ischaemic, high-flow/non-ischaemic).', risk:'ED: age, hypertension, smoking, diabetes, drug/alcohol abuse, hyperlipidaemia, psychiatric conditions, SSRIs, statins, beta-blockers, nicotine. Peyronie: middle age, Dupuytren contracture, diabetes, keloid scarring tendency. Priapism: sickle cell anaemia, neurological disease, cancer, trauma.', diagnosis:'Phimosis/Paraphimosis: clinical examination. Peyronie: clinical examination. ED: duplex ultrasound, hormonal blood tests (testosterone, LH, prolactin), psychological testing, physical examination, detailed history. Priapism: clinical diagnosis; blood gases from corpus cavernosum aspirate to distinguish type.', treatment:'Phimosis/Paraphimosis: hygiene changes, antimicrobial therapy, possibly circumcision after infection treated; paraphimosis requires urgent manual reduction. Peyronie: conservative management, collagenase injections, surgery in severe cases. ED: phosphodiesterase-5 inhibitors, hormonal replacement, vasodilator injection, psychotherapy, surgery. Priapism: ice packs, perineal compression, adrenergic agonists (arteriolar vasoconstriction), aspiration of blood from corpus cavernosum, urinary catheterisation.', drugs:'ED: phosphodiesterase-5 inhibitors (sildenafil, tadalafil), testosterone replacement, vasodilators. Priapism: adrenergic agonists (phenylephrine), aspiration. Peyronie: collagenase clostridium histolyticum.'}, flash:[['Phimosis','Cannot retract foreskin — normal in infancy'],['Paraphimosis emergency','Cannot return retracted foreskin — acute medical emergency'],['Peyronie disease cause','Fibrous plaque in tunica albuginea → lateral penile curvature'],['Peyronie another name','Bent nail syndrome'],['ED organic — vascular causes','Hypertension, atherosclerosis, diabetes mellitus'],['Priapism low-flow cause','Sickle cell anaemia, neurological disease, or cancer'],['Priapism high-flow cause','Trauma to perineum or genitalia'],['ED first-line drug class','Phosphodiesterase-5 inhibitors (e.g. sildenafil, tadalafil)']]},
 {category:'Reproductive', id:'male_scrotal', name:'Male: Disorders of the Scrotum & Testes', tags:['cryptorchidism','varicocele','hydrocele','spermatocele','testicular torsion','orchitis'], summary:'Scrotal and testicular disorders include undescended testes (cryptorchidism), varicocele (leading cause of male infertility), hydrocele (fluid accumulation), spermatocele (epididymal cyst), testicular torsion (emergency), and orchitis/epididymitis (inflammation).', fields:{definition:'Cryptorchidism: failure of one or more testes to descend from the abdominal cavity into the scrotum — common in premature males; testes usually descend by 1 year of age. Varicocele: dilation of the testicular vein (pampiniform plexus); most common cause of scrotal enlargement in young adults and the leading cause of male infertility. Hydrocele: scrotal swelling from fluid accumulation within the tunica vaginalis. Spermatocele: epididymal cyst (painless diverticulum) containing milky sperm-containing fluid. Testicular torsion: rotation of the testis within the scrotum → ischaemia → necrosis if untreated. Orchitis: inflammation of the testis/testes. Epididymitis: inflammation of the epididymis.', mechanism:'Cryptorchidism: failure of normal testicular descent — hormonal, environmental, or genetic factors. Varicocele: inadequate or absent valves in pampiniform plexus veins → blood pools → varicose veins → increased scrotal temperature → impaired spermatogenesis. Hydrocele: idiopathic, or from venous/lymphatic obstruction (trauma, infection, torsion, surgery); chronic hydrocele (>40 years) = imbalance between fluid secretion and reabsorption. Spermatocele: outpouching of epididymis. Testicular torsion: twisting interrupts blood supply → testicular ischaemia → necrosis. Orchitis/Epididymitis: infectious (usually ascending from UTI) → scrotal pain and swelling.', manifestations:'Cryptorchidism: absent testis in scrotum; risk of infertility and cancer. Varicocele: mostly asymptomatic; sometimes aching scrotal pain; reduced testicular function. Hydrocele: painless scrotal swelling, usually asymptomatic. Spermatocele: typically asymptomatic, soft scrotal lump discovered on examination. Testicular torsion: sudden severe scrotal/testicular pain, nausea, vomiting. Orchitis/Epididymitis: scrotal pain and swelling, fever.', comparisons:'Varicocele: dilated veins (spermatic cord), most often left side, commonest cause of male infertility. Hydrocele: fluid between tunica vaginalis layers, mostly asymptomatic, more common >40 years. Spermatocele: epididymal cyst, sperm-containing fluid, asymptomatic. Testicular torsion is a urological emergency; orchitis and epididymitis are infectious/inflammatory conditions.', types:'Cryptorchidism, varicocele, hydrocele, spermatocele, testicular torsion, orchitis, epididymitis.', risk:'Cryptorchidism: low birth weight, prematurity, sexual development disorders. Varicocele: adolescence onset; valve incompetence in pampiniform plexus. Testicular torsion: bell-clapper deformity. Orchitis/Epididymitis: ascending UTI, STI pathogens.', diagnosis:'Cryptorchidism: physical examination. Varicocele: clinical (bag of worms feel), scrotal ultrasound. Hydrocele: transillumination, ultrasound. Spermatocele: ultrasound. Testicular torsion: clinical urgency — surgical exploration; Doppler ultrasound for blood flow. Orchitis/Epididymitis: ultrasound, urinalysis, swabs.', treatment:'Cryptorchidism: hormone therapy (GnRH, LHRH, hCG) or orchiopexy (orchioplasty). Varicocele: varicocele repair (varicocelectomy). Hydrocele: scrotal elevation; aspiration or surgery if symptomatic. Spermatocele: analgesia; spermatocelectomy if needed. Testicular torsion: manual or surgical detorsion (emergency within 6 hours). Orchitis/Epididymitis: scrotal elevation, antibiotics, analgesia.', drugs:'Cryptorchidism: GnRH, LHRH, hCG. Orchitis/Epididymitis: antibiotics, analgesics. Hydrocele/Spermatocele: analgesia.'}, flash:[['Cryptorchidism','Undescended testis — risks infertility and cancer'],['Varicocele side','Usually left testis — commonest cause of male infertility'],['Varicocele mechanism','Valve incompetence in pampiniform plexus → blood pools → heat → impairs spermatogenesis'],['Hydrocele','Fluid in tunica vaginalis — often idiopathic, usually asymptomatic'],['Spermatocele contents','Milky sperm-containing fluid — epididymal cyst'],['Testicular torsion','Urological emergency — surgical detorsion needed within 6 hours'],['Cryptorchidism treatment','Orchiopexy (orchioplasty) or hormone therapy (GnRH/hCG)'],['Hydrocele vs varicocele','Hydrocele = fluid; Varicocele = dilated veins']]},
 {category:'Reproductive', id:'male_prostate', name:'Male: Prostatitis, BPH & Prostate Cancer', tags:['prostate','BPH','prostate cancer','prostatitis','PSA','5-DHT'], summary:'Prostate disorders include prostatitis (inflammation), benign prostatic hyperplasia (BPH — the most common prostate condition), and prostate cancer (the most common cancer in men).', fields:{definition:'Prostatitis: inflammation of the prostate — acute (ascending UTI, younger men), chronic (recurrent UTI symptoms, Gram-negative bacteria, 40–70 years), or non-bacterial (most common — inflammation without bacterial evidence). BPH (benign prostatic hyperplasia): enlargement from abnormal cell number expansion and glandular hypertrophy causing urethral compression; androgen-dependent (5-DHT is the key metabolite). Prostate cancer: most common cancer in men; most arise as adenocarcinomas in glandular tissue; asymptomatic until advanced; influenced by genetics, ethnicity, hormonal status, and chronic inflammation.', mechanism:'BPH: androgen-driven — testosterone converted to 5-alpha-dihydrotestosterone (5-DHT) by 5-alpha-reductase → epithelial proliferation + reduced apoptosis → nodular hyperplasia + glandular hypertrophy → urethral compression. Chronic inflammation: prostatic stromal cells activate CD4+ T lymphocytes → pro-inflammatory cytokine release. Prostate cancer: classic pathway — testosterone → 5-DHT → androgen receptor activation → prostate cancer growth. Men with certain isoforms of 5-alpha-reductase type II have increased cancer risk. Over time, prostate cancer becomes hormone refractory; dysfunctional androgen receptor allows other mediators (growth factors, tyrosine kinase signalling) to promote progression.', manifestations:'Prostatitis: pelvic pain, dysuria, frequency, urgency, sexual dysfunction. BPH: reduced urine flow, dysuria, nocturia, urinary retention, urgency, reflux. Prostate cancer: asymptomatic until advanced; lower urinary tract symptoms (pelvic pain, dysuria, frequency, urgency, sexual dysfunction) similar to BPH.', comparisons:'Prostatitis: inflammatory/infectious — acute or chronic; managed with antibiotics. BPH: benign hyperplastic enlargement; treated with medications or TURP. Prostate cancer: malignant, adenocarcinoma type; BPH is NOT a pre-malignant condition. Both BPH and prostate cancer share lower urinary tract symptoms but have different prognosis and treatment.', types:'Prostatitis: acute, chronic, non-bacterial. BPH. Prostate cancer: adenocarcinoma (most), neuro-endocrine stem cell origin (some). Metastases: bone 90%, lung 46%, liver 25%, pleura 21%, adrenal glands 13%.', risk:'BPH: advancing age, family history, heart disease, obesity, diabetes, ED. Prostate cancer: genetic predisposition, ethnicity, hormonal factors, chronic inflammation, dietary factors; antioxidants and lycopene may be protective.', diagnosis:'Prostatitis: ultrasound, CT, cystoscopy, urinalysis, prostatic secretions, urine culture, CBC, PSA. BPH: urinalysis, urine culture, digital rectal examination, blood PSA, prostate biopsy, X-ray, ultrasound. Prostate cancer: digital rectal examination, blood PSA, TRUS biopsy (transrectal ultrasound-guided), X-ray, MRI, CT.', treatment:'Prostatitis: long-term antibiotics (based on MCS), NSAIDs, muscarinic receptor antagonist (oxybutynin), education. BPH: alpha-adrenergic receptor blocker (terazosin), 5-alpha reductase inhibitor (finasteride), phosphodiesterase-5 inhibitor (tadalafil), TURP surgery. Prostate cancer: surgery (TURP, radical prostatectomy), radiation therapy (external beam, brachytherapy), hormonal manipulation (LHRH agonists such as leuprolide, anti-androgens such as flutamide, oestrogen compounds), chemotherapy, manage incontinence and pain.', drugs:'BPH: terazosin (alpha blocker), finasteride (5-alpha reductase inhibitor), tadalafil (PDE-5 inhibitor). Prostatitis: antibiotics, NSAIDs, oxybutynin. Prostate cancer: LHRH agonists (leuprolide), anti-androgens (flutamide, megastrol acetate), diethylstilboestrol, GnRH antagonists, bisphosphonates, chemotherapy.'}, flash:[['5-DHT in BPH','Testosterone → 5-alpha-DHT via 5-alpha-reductase → key driver of BPH'],['BPH first-line drugs','Alpha blocker (terazosin) and/or 5-alpha reductase inhibitor (finasteride)'],['BPH surgery','TURP — trans-urethral resection of prostate'],['Prostate cancer most common metastasis site','Bone (90%)'],['PSA','Prostate specific antigen — used in BPH and prostate cancer diagnosis'],['Prostate cancer hormone pathway','Testosterone → 5-DHT → androgen receptor activation → tumour growth'],['Non-bacterial prostatitis','Most common type — inflammation without bacterial evidence'],['Prostate cancer hormone treatment','LHRH agonists (leuprolide), anti-androgens (flutamide)']]},

 {category:'MSK', id:'oa', name:'Osteoarthritis (OA)', tags:['OA','arthritis','cartilage','degenerative'], summary:'The most common arthritis — mechanical cartilage destruction driven by pro-inflammatory cytokines and MMPs, primarily affecting weight-bearing joints.', fields:{definition:'Degenerative arthritis caused by loss of articular cartilage; most common in older adults.', mechanism:'IL-1 and TNF-α activate MMPs → degrade type II collagen and aggrecan → cartilage fibrillation → vertical clefts → subchondral bone exposed → eburnation (ivory-like densification).', manifestations:'Asymmetric joint pain relieved by rest; morning stiffness <15 min; crepitus; muscle wasting; bony enlargement.', comparisons:'OA is degenerative/mechanical; RA is autoimmune/symmetric; gout is metabolic/monoarticular. OA stiffness <15 min vs RA >1 hour.', types:'Primary (idiopathic) vs secondary (post-injury, obesity, metabolic disease). Affects knees, hips, hands, spine.', risk:'Older age, female sex, obesity, joint injury, repetitive loading, genetics.', diagnosis:'X-ray: joint space narrowing, osteophytes, subchondral sclerosis (cannot show cartilage). Synovial fluid analysis.', treatment:'NSAIDs, weight loss, exercise, physiotherapy, glucosamine/chondroitin, intra-articular corticosteroids, joint replacement.', drugs:'NSAIDs, intra-articular corticosteroids, glucosamine/chondroitin (adjunct).'}, flash:[['Eburnation','Ivory-like densification of exposed subchondral bone in OA'],['OA morning stiffness','Less than 15 minutes'],['IL-1 & TNF-α','Pro-inflammatory cytokines driving MMP-mediated cartilage destruction'],['Key X-ray finding','Joint space narrowing + osteophytes (cannot visualise cartilage)']]},
 {category:'MSK', id:'ra', name:'Rheumatoid Arthritis (RA)', tags:['RA','autoimmune','arthritis','anti-CCP'], summary:'Chronic autoimmune arthritis targeting synovium; symmetric small joints; extra-articular complications; 3× higher mortality than healthy individuals.', fields:{definition:'Chronic autoimmune condition where auto-reactive CD4+ T cells attack joint synovium; affects women 2–3× more than men.', mechanism:'Auto-reactive CD4+ T cells → macrophage activation → TNF-α, IL-1, MMPs, RANK ligand → cartilage destruction and bone dissolution → pannus formation.', manifestations:'Symmetric small joints (hands, feet, wrists); morning stiffness >1 hour; warm, oedematous joints; swan neck deformity; boutonnière deformity; extra-articular: nodules, eye (scleritis), cardiovascular disease.', comparisons:'Unlike OA (asymmetric, large joints, <15 min stiffness), RA is symmetric, small joints, >1 hour stiffness, with systemic involvement.', types:'Seropositive (RF+/anti-CCP+) vs seronegative. Extra-articular: pulmonary, cardiovascular, renal, ocular.', risk:'Female sex, family history, smoking, HLA-DR4 haplotype, age 40–60.', diagnosis:'Anti-CCP antibody (~90% specific), rheumatoid factor, elevated ESR and CRP; ACR/EULAR diagnostic score ≥6.', treatment:'DMARDs (methotrexate — first-line), biologics (anti-TNF: infliximab, adalimumab), corticosteroids, physiotherapy, joint surgery.', drugs:'Methotrexate (DMARD), infliximab/adalimumab (anti-TNF biologics), prednisolone, hydroxychloroquine.'}, flash:[['Anti-CCP antibody','~90% specific for RA; present years before symptoms'],['RA morning stiffness','More than 1 hour (vs OA <15 min)'],['DMARD first-line','Methotrexate'],['Swan neck deformity','PIP hyperextension + DIP flexion — classic RA hand deformity']]},
 {category:'MSK', id:'gout', name:'Gout', tags:['gout','urate','crystals','hyperuricaemia','MTP'], summary:'Most common inflammatory arthritis in men; monosodium urate crystal deposition from hyperuricaemia causes acute, intensely painful monoarthritis.', fields:{definition:'Metabolic disorder caused by monosodium urate monohydrate crystal deposition in joints due to hyperuricaemia.', mechanism:'In >90% of cases: reduced renal uric acid excretion (genetically determined) → hyperuricaemia → crystal deposition → neutrophil-mediated inflammatory response → tissue damage. Crystals cannot be dissolved.', manifestations:'Acute monoarthritis; 1st MTP joint (big toe) in >50%; extreme, sudden onset pain; erythema, warmth, swelling; self-limiting in 5–14 days. Tophi in chronic gout.', comparisons:'Unlike RA (symmetric polyarthritis), gout is monoarticular and episodic. Unlike OA (insidious), gout is acute and extremely painful. Serum uric acid elevated (unlike RA/OA).', types:'Acute gouty arthritis → intercritical gout → chronic tophaceous gout.', risk:'Male sex, high purine diet (organ meats, anchovies, wine, beer), diuretics, renal disease, genetics, obesity.', diagnosis:'Serum uric acid; arthrocentesis (polarising microscopy — needle-shaped, negatively birefringent crystals); renal function tests.', treatment:'Acute: NSAIDs, colchicine, corticosteroids. Prophylaxis: allopurinol (xanthine oxidase inhibitor), probenecid (uricosuric). Dietary modification (avoid purines).', drugs:'Allopurinol, probenecid, colchicine, NSAIDs, corticosteroids.'}, flash:[['1st MTP joint','Most common site of acute gout (>50% of first attacks)'],['Crystal type in gout','Monosodium urate monohydrate — needle-shaped, negatively birefringent'],['Allopurinol mechanism','Xanthine oxidase inhibitor → reduces uric acid production'],['Why crystals persist','Urate crystals cannot be dissolved; must prevent further formation']]},
 {category:'MSK', id:'fractures', name:'Bone Fractures & Healing', tags:['fracture','bone healing','osteoblast','callus','remodelling'], summary:'Fractures occur when force exceeds bone absorptive capacity; healing follows three ordered phases: inflammation, consolidation, and remodelling.', fields:{definition:'A fracture is a break in bone continuity when applied force exceeds bone\'s absorptive capacity.', mechanism:'Bone matrix disruption → haematoma → cytokine release → MSC recruitment → callus formation → mineralisation → bone remodelling via osteoblasts and osteoclasts.', manifestations:'Pain, swelling, ecchymosis (bruising), deformity, loss of function, crepitus at fracture site.', comparisons:'Fatigue fractures result from repetitive stress (athletes); pathological fractures occur in weakened bone (osteoporosis, cancer, Paget\'s); traumatic fractures from acute force.', types:'By cause: sudden injury, fatigue, pathological. By skin: open/closed. By location: proximal/mid-shaft/distal. By pattern: transverse, oblique, spiral, comminuted, impacted.', risk:'Bone density (osteoporosis), age, sports participation, repetitive stress, metastatic disease, Paget\'s disease.', diagnosis:'X-ray (primary); CT for complex fractures; MRI for soft tissue/occult fractures.', treatment:'Immobilisation (casting, splinting) — critical during consolidation phase; surgical fixation (ORIF, intramedullary nail); physiotherapy for rehabilitation.', drugs:'Analgesia, calcium/vitamin D supplementation, bisphosphonates (if underlying osteoporosis).'}, flash:[['Phase 1: Inflammation','Haematoma → cytokines → granulation tissue (days 1–7)'],['Phase 2: Consolidation','Fibrocartilage callus → mineralised bone callus (weeks); immobilisation critical'],['Phase 3: Remodelling','Mature lamellar bone formed over months–years'],['Pathological fracture','Occurs in structurally weakened bone: osteoporosis, tumour, Paget\'s']]},
 {category:'MSK', id:'osteosarcoma', name:'Bone Tumours (Osteosarcoma)', tags:['osteosarcoma','bone tumour','TP53','RB1','malignant'], summary:'Primary malignant bone tumour predominantly in adolescent males; linked to TP53/RB1 mutations; rapidly metastasises to lungs; key symptom is night pain.', fields:{definition:'Osteosarcoma is the most common primary malignant bone tumour, predominantly affecting adolescent males at the metaphysis of long bones.', mechanism:'TP53 and RB1 tumour suppressor mutations → uncontrolled osteoblastic proliferation → aggressive bone matrix production → rapid haematogenous spread to lungs.', manifestations:'Night pain (characteristic), localised swelling, tenderness, pathological fractures; pulmonary metastases → respiratory symptoms. Elevated alkaline phosphatase and LDH.', comparisons:'Osteosarcoma (primary malignant, adolescents, long bones) vs Ewing sarcoma (small round cells, younger children, flat bones) vs bone metastases (adults, from breast/prostate/lung).', types:'Conventional (most common), parosteal, periosteal, telangiectatic. Located at distal femur, proximal tibia, proximal humerus most commonly.', risk:'Adolescent males, rapid bone growth, prior radiation, retinoblastoma (RB1 mutation), Li-Fraumeni syndrome (TP53).', diagnosis:'X-ray (sunburst pattern, Codman triangle); MRI for local extent; CT chest for metastases; PET scan; biopsy for histology. Elevated ALP and LDH.', treatment:'Neoadjuvant chemotherapy → surgical resection (limb-salvage preferred over amputation) → adjuvant chemotherapy. Radiotherapy for unresectable cases.', drugs:'Methotrexate, doxorubicin, cisplatin (MAP chemotherapy protocol).'}, flash:[['Key symptom of osteosarcoma','Night pain — distinguishes from mechanical causes'],['Gene mutations','TP53 and RB1 tumour suppressor mutations'],['X-ray appearance','Sunburst pattern + Codman triangle (periosteal elevation)'],['Metastasis site','Lungs — leading cause of death in osteosarcoma']]},
 {category:'MSK', id:'fibromyalgia', name:'Fibromyalgia & CFS', tags:['fibromyalgia','chronic fatigue','CFS','ME','pain','serotonin'], summary:'Fibromyalgia is a syndrome of widespread chronic pain and allodynia driven by neuroendocrine dysfunction; CFS/ME is debilitating fatigue unrelieved by rest for ≥6 months.', fields:{definition:'Fibromyalgia: a syndrome (not a disease) of widespread chronic musculoskeletal pain, fatigue, and sleep disturbance. CFS/ME: debilitating fatigue ≥6 months, unrelieved by rest, with multi-system involvement.', mechanism:'Fibromyalgia: altered serotonin (reduced), elevated substance P, HPA axis dysregulation → central sensitisation. CFS: immune dysfunction (reduced NK cells), HPA axis impairment, possible viral trigger (Epstein-Barr virus).', manifestations:'Fibromyalgia: widespread pain, allodynia, fatigue, sleep disturbance, anxiety, depression, cognitive dysfunction ("fibro fog"). CFS: profound fatigue unrelieved by rest, post-exertional malaise, cognitive impairment, sleep dysfunction.', comparisons:'Fibromyalgia: pain predominant, affects young–middle-aged females. CFS/ME: fatigue predominant, post-exertional malaise is hallmark. Both lack clear structural pathology and have neuroendocrine components.', types:'Fibromyalgia: primary vs secondary (associated with RA, lupus). CFS severity: mild, moderate, severe, very severe.', risk:'Female sex, stress, anxiety/depression, prior infections, poor sleep, physical inactivity, trauma.', diagnosis:'Fibromyalgia: Widespread Pain Index (WPI) + Symptom Severity Scale (SSS); no abnormal blood tests. CFS: ≥6 months debilitating fatigue + post-exertional malaise + unrefreshing sleep; diagnosis of exclusion.', treatment:'Fibromyalgia: aerobic exercise, stress management, CBT, antidepressants (duloxetine, amitriptyline). CFS: paced activity, CBT, sleep hygiene, lifestyle modification.', drugs:'Duloxetine, amitriptyline, pregabalin (fibromyalgia); low-dose antidepressants and sleep agents (CFS).'}, flash:[['Fibromyalgia diagnosis tools','Widespread Pain Index (WPI) + Symptom Severity Scale (SSS)'],['Key neurotransmitter change','Reduced serotonin + elevated substance P → central sensitisation'],['CFS hallmark','Post-exertional malaise — fatigue worsens after physical/mental activity'],['CFS possible trigger','Epstein-Barr virus (and other viral infections)']]},
 {category:'MSK', id:'musk_disorders', name:'DMD & Rhabdomyolysis', tags:['DMD','muscular dystrophy','rhabdomyolysis','myoglobin','dystrophin'], summary:'DMD results from dystrophin gene mutation causing progressive muscle necrosis; rhabdomyolysis is acute skeletal muscle destruction releasing myoglobin and potassium into blood.', fields:{definition:'DMD: X-linked inherited disorder; dystrophin gene mutation → membrane instability → calcium overload → muscle necrosis → fibrous/fatty replacement. Rhabdomyolysis: acute skeletal muscle destruction with systemic release of intracellular contents.', mechanism:'DMD: absent dystrophin → sarcolemma instability → uncontrolled calcium influx → proteolysis and cell death → fibrosis. Rhabdomyolysis: calcium homeostasis failure → abnormal actin-myosin cycling → myocyte lysis → myoglobin, K+, CK released into circulation.', manifestations:'DMD: delayed motor milestones, frequent falls, Gowers sign, pseudohypertrophy of calves, cardiomyopathy, respiratory failure. Rhabdomyolysis: muscle pain, weakness, brown/dark urine (myoglobinuria), swelling.', comparisons:'DMD is chronic/progressive (boys, genetic). Rhabdomyolysis is acute (any age, various triggers: trauma, overexercise, drugs, toxins). Both involve calcium-mediated muscle destruction.', types:'DMD (most severe, null mutation) vs Becker MD (partial dystrophin, milder). Rhabdomyolysis: traumatic, exertional, toxic, or disease-induced.', risk:'DMD: male sex, family history (X-linked). Rhabdomyolysis: extreme exercise, crush injury, statins, alcohol, hyperthermia, viral infections.', diagnosis:'DMD: genetic testing, elevated CK, muscle biopsy, EMG. Rhabdomyolysis: markedly elevated CK (>1000 U/L), serum myoglobin, urinalysis (brown urine), electrolytes (hyperkalaemia).', treatment:'DMD: corticosteroids (slow progression), physiotherapy, cardioprotection, ventilatory support; gene therapy (experimental). Rhabdomyolysis: aggressive IV fluid therapy, urine alkalinisation, monitor electrolytes.', drugs:'DMD: prednisolone, deflazacort, ataluren (gene therapy). Rhabdomyolysis: IV saline, sodium bicarbonate (urine alkalinisation).'}, flash:[['DMD gene','Dystrophin gene mutation → membrane instability → calcium overload → necrosis'],['DMD demographics','Boys predominantly; 85% of paediatric muscular dystrophy cases'],['Rhabdomyolysis early sign','Brown/dark urine = myoglobinuria'],['Life-threatening complications','Acute renal failure (myoglobin) + cardiac arrest (hyperkalaemia)']]}

const CAT_CONFIG = {
  CNS:   {color:'#312e81', label:'CNS'},
  CVS:   {color:'#7f1d1d', label:'CVS'},
  Renal: {color:'#064e3b', label:'Renal'},
  Inflammation: {color:'#7c2d12', label:'Inflammation'},
  Blood: {color:'#881337', label:'Blood'},
  Respiratory: {color:'#14532d', label:'Respiratory'},
  GI:    {color:'#78350f', label:'GI'},
  Endocrine: {color:'#0e7490', label:'Endocrine'},
  Reproductive: {color:'#9d174d', label:'Reproductive'},
  MSK: {color:'#92400e', label:'MSK'}
};

function renderTabs(){
  const cats = Object.keys(CAT_CONFIG);
  const b = document.getElementById('tabs'); if(!b) return; b.innerHTML='';
  b.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px';
  cats.forEach(c=>{
    const t = document.createElement('button');
    t.className = 'tab'+(c===activeCat?' active':'');
    t.dataset.cat = c;
    t.textContent = CAT_CONFIG[c].label;
    t.style.cssText=`padding:8px 12px;border:none;border-radius:999px;background:${CAT_CONFIG[c].color};color:#fff;font-weight:700;cursor:pointer;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)`;
    if(c===activeCat){t.style.outline='3px solid #fbbf24'; t.style.boxShadow='0 0 0 4px rgba(251,191,36,.18),0 2px 8px rgba(0,0,0,.35)';}
    t.onclick=()=>{activeCat=c; current=topics.find(x=>x.category===c)?.id||current; cardIndex=0; flip=false; renderAll();};
    b.appendChild(t);
  });
}

function renderTopics(filter=''){
  const box=document.getElementById('topics'); box.innerHTML='';
  topics.filter(t=>t.category===activeCat && (t.name.toLowerCase().includes(filter.toLowerCase())||t.tags.some(x=>x.includes(filter.toLowerCase())))).forEach(t=>{
    const b=document.createElement('button'); b.className='topic'+(t.id===current?' active':''); b.textContent=t.name; b.onclick=()=>{current=t.id; cardIndex=0; flip=false; renderAll();}; box.appendChild(b);
  });
}

function renderContent(){
  const t=byId[current]; const f=t.fields;
  document.getElementById('content').innerHTML=`
    <h2>${t.name}</h2>
    <p class="muted">${t.summary}</p>
    <div class="grid2" style="margin-top:8px">
      <div><h3 style="color:#f59e0b">Definitions & Mechanism</h3><p>${f.definition}</p><p>${f.mechanism}</p></div>
      <div><h3 style="color:#60a5fa">Comparisons</h3><p>${f.comparisons}</p></div>
      <div><h3 style="color:#22c55e">Clinical Manifestations</h3><p>${f.manifestations}</p></div>
      <div><h3 style="color:#a78bfa">Types</h3><p>${f.types}</p></div>
      <div><h3 style="color:#f97316">Risk Factors</h3><p>${f.risk}</p></div>
      <div><h3 style="color:#38bdf8">Diagnosis</h3><p>${f.diagnosis}</p></div>
      <div><h3 style="color:#34d399">Treatment & Management</h3><p>${f.treatment}</p></div>
      <div><h3 style="color:#fb7185">Drugs</h3><p>${f.drugs}</p></div>
    </div>`;
}

function renderAll(){document.body.setAttribute('data-cat', activeCat); renderTabs(); renderTopics(document.getElementById('search').value); renderContent(); renderQuiz(); updateScore();}

function renderQuiz(){
  const q=quizBank[quizIndex%quizBank.length];
  document.getElementById('quiz').innerHTML=`<div class="quiz-q">${q.q}</div>${q.opts.map(o=>`<button class="opt" data-opt="${o}">${o}</button>`).join('')}`;
  document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('good','bad')); el.classList.add(el.dataset.opt===q.a?'good':'bad');});
  document.getElementById('quizFeedback').textContent='Choose an answer, then press Check answer.';
}

function updateScore(){document.getElementById('quizScore').textContent=`Score: ${score} / ${answered}`;}

document.getElementById('search').oninput=e=>renderTopics(e.target.value);
document.getElementById('nextQuiz').onclick=()=>{quizIndex=(quizIndex+1)%quizBank.length; renderQuiz();};
document.getElementById('checkQuiz').onclick=()=>{const q=quizBank[quizIndex%quizBank.length]; const picked=[...document.querySelectorAll('.opt')].find(x=>x.classList.contains('good')||x.classList.contains('bad')); if(!picked){document.getElementById('quizFeedback').textContent='Select an answer first.'; return;} answered++; if(picked.dataset.opt===q.a){score++; document.getElementById('quizFeedback').textContent='Correct.';} else {document.getElementById('quizFeedback').textContent=`Incorrect. Correct answer: ${q.a}.`;} updateScore();};
renderAll();
</script>
