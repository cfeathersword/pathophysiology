<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSIO 230 Study App</title>
<style>
:root{--bg:#0f1020;--panel:#15192e;--card:#1b2242;--text:#f6f7ff;--muted:#b6c0e8;--accent:#8b5cf6;--accent2:#22c55e;--danger:#ef4444;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,#2b1b5a 0%,#111831 42%,#08111f 100%);color:var(--text)}
header{padding:18px 20px;background:linear-gradient(90deg,rgba(69,39,160,.85),rgba(15,23,42,.9));position:sticky;top:0;border-bottom:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);z-index:10;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:22px;white-space:nowrap} .sub{color:var(--muted);font-size:13px}
.global-search-wrap{flex:1;min-width:220px;max-width:460px;position:relative}
.global-search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:var(--text);font:inherit;outline:none;font-size:14px}
.global-search-wrap input:focus{border-color:rgba(139,92,246,.6);background:rgba(255,255,255,.1)}
.global-search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#globalResults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1b2242;border:1px solid rgba(255,255,255,.12);border-radius:12px;max-height:320px;overflow-y:auto;z-index:100;display:none}
#globalResults .gr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
#globalResults .gr-item:hover{background:rgba(255,255,255,.07)}
#globalResults .gr-item .gr-title{font-weight:600}
#globalResults .gr-item .gr-cat{font-size:11px;color:var(--muted);margin-top:2px}
#globalResults .gr-item .gr-match{font-size:12px;color:#a5b4fc;margin-top:3px;font-style:italic}
#globalResults .no-res{padding:12px 14px;color:var(--muted);font-size:13px}

.wrap{display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 68px)}
nav{padding:14px;border-right:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
button,select,input{font:inherit} button{color:inherit}
.nav-search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#111b3a,#0b1228);color:var(--text);outline:none;margin-bottom:10px;font-size:13px}
.topic{display:block;width:100%;text-align:left;padding:10px 12px;margin:5px 0;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.topic.active{outline:2px solid #f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
main{padding:18px;overflow-y:auto}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.2);margin-bottom:16px}
.card h2,.card h3{margin-top:0}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(34,197,94,.18));color:#fff;font-size:11px;margin:3px 5px 0 0}
.muted{color:var(--muted)}

/* Section divider for multi-pathology topics */
.path-block{margin:0 0 20px;padding:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px}
.path-block:last-child{margin-bottom:0}
.path-block h4{margin:0 0 12px;font-size:15px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)}

/* Field grid */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.field-item{background:rgba(255,255,255,.03);border-radius:8px;padding:12px}
.field-item h5{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.75}
.field-item p{margin:0;font-size:13px;line-height:1.55}

/* Category colors on cards */
body[data-cat='CNS'] .card{border-top:4px solid #7c3aed}
body[data-cat='CVS'] .card{border-top:4px solid #db2777}
body[data-cat='Renal'] .card{border-top:4px solid #0ea5a5}
body[data-cat='Inflammation'] .card{border-top:4px solid #f97316}
body[data-cat='Blood'] .card{border-top:4px solid #e11d48}
body[data-cat='Respiratory'] .card{border-top:4px solid #16a34a}
body[data-cat='GI'] .card{border-top:4px solid #b45309}
body[data-cat='Endocrine'] .card{border-top:4px solid #0891b2}
body[data-cat='Reproductive'] .card{border-top:4px solid #be185d}
body[data-cat='MSK'] .card{border-top:4px solid #b45309}

body[data-cat='CNS'] .card h2,.card h3{color:inherit}
body[data-cat='CNS'] h2,body[data-cat='CNS'] h3{color:#ddd6fe}
body[data-cat='CVS'] h2,body[data-cat='CVS'] h3{color:#f9a8d4}
body[data-cat='Renal'] h2,body[data-cat='Renal'] h3{color:#99f6e4}
body[data-cat='Inflammation'] h2,body[data-cat='Inflammation'] h3{color:#fed7aa}
body[data-cat='Blood'] h2,body[data-cat='Blood'] h3{color:#fecdd3}
body[data-cat='Respiratory'] h2,body[data-cat='Respiratory'] h3{color:#bbf7d0}
body[data-cat='GI'] h2,body[data-cat='GI'] h3{color:#fde68a}
body[data-cat='Endocrine'] h2,body[data-cat='Endocrine'] h3{color:#a5f3fc}
body[data-cat='Reproductive'] h2,body[data-cat='Reproductive'] h3{color:#fbcfe8}
body[data-cat='MSK'] h2,body[data-cat='MSK'] h3{color:#fde68a}

body[data-cat='CNS'] .pill{background:rgba(124,58,237,.28)}
body[data-cat='CVS'] .pill{background:rgba(219,39,119,.26)}
body[data-cat='Renal'] .pill{background:rgba(14,165,165,.24)}
body[data-cat='Inflammation'] .pill{background:rgba(249,115,22,.26)}
body[data-cat='Blood'] .pill{background:rgba(225,29,72,.26)}
body[data-cat='Respiratory'] .pill{background:rgba(22,163,74,.26)}
body[data-cat='GI'] .pill{background:rgba(180,83,9,.26)}
body[data-cat='Endocrine'] .pill{background:rgba(8,145,178,.28)}
body[data-cat='Reproductive'] .pill{background:rgba(190,24,93,.28)}
body[data-cat='MSK'] .pill{background:rgba(180,83,9,.28)}

.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tab{padding:6px 10px;border:none;border-radius:999px;color:#fff;font-weight:700;cursor:pointer;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.35)}

@media(max-width:960px){.wrap{grid-template-columns:1fr} nav{border-right:none;border-bottom:1px solid rgba(255,255,255,.08)} .field-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>PSIO 230 Study App</h1>
    <div class="sub">Select a system and topic to review notes.</div>
  </div>
  <div class="global-search-wrap">
    <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

<div class="wrap">
  <nav>
    <div class="tabs" id="tabs"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
// Each topic has:
//   pathologies: array of {name, fields:{definition,mechanism,manifestations,comparisons,types,risk,diagnosis,treatment,drugs}}
//   For single-pathology topics, pathologies has one entry (name can be '' to skip the sub-heading)
const topics = [
 // ── CNS ──────────────────────────────────────────────────────────────────────
 {category:'CNS', id:'tbi', name:'Traumatic Brain Injury & ICP', tags:['TBI','ICP','head injury'], summary:'Traumatic brain injury ranges from mild bruising to severe injury, and raised ICP can develop from swelling, bleeding, or hypoxia.',
  pathologies:[{name:'',fields:{definition:'Traumatic brain injury ranges from mild bruising to severe injury. Raised ICP is pressure from CSF, brain tissue, and blood.',mechanism:'Primary injury occurs at impact; secondary injury develops from inflammation, bleeding, oedema, hypoxia, and hypotension.',manifestations:'Decreased LOC, headache, sluggish pupils, visual disturbance, abnormal breathing, impaired motor response, bradycardia, rising systolic BP, falling diastolic BP, high temperature.',comparisons:'Primary trauma is direct impact injury; secondary trauma is delayed injury from swelling, bleeding, or reduced oxygen supply.',types:'Coup injury, contrecoup injury, raised intracranial pressure.',risk:'Traffic accidents, falls, sporting accidents, violence.',diagnosis:'Neurological assessment, pupil size and reactivity, vital signs, limb movement.',treatment:'Oxygen therapy, IV fluids, catheterization, blood glucose management, anticonvulsants, feeding support, hypertonic solutions.',drugs:'Anticonvulsants, hypertonic solutions, oxygen therapy.'}}],
  flash:[['Coup injury','Brain injury at the point of impact'],['Contrecoup injury','Injury opposite the impact'],['Raised ICP','Pressure from CSF, brain tissue, and blood'],['One management step','Neuro checks and vital signs']]},

 {category:'CNS', id:'stroke', name:'Stroke & TIA', tags:['stroke','TIA','cva'], summary:'Stroke is impaired blood flow to the brain. TIA is a brief interruption of blood supply that resolves quickly.',
  pathologies:[
   {name:'Stroke',fields:{definition:'Impaired blood flow to the brain caused by vessel occlusion or haemorrhage.',mechanism:'Ischaemic stroke occurs from blockage; haemorrhagic stroke occurs from vessel rupture and bleeding.',manifestations:'One-sided weakness, language impairment, visual field loss, poor judgement, depression, headache, focal neurological deficits.',comparisons:'Ischaemic stroke is more common and caused by blocked flow. Haemorrhagic stroke is less common but has more secondary injury and higher mortality.',types:'Ischaemic stroke, haemorrhagic stroke.',risk:'Smoking, obesity, heart disease, hyperlipidaemia, diabetes, hypertension, dyslipidaemia, sedentary lifestyle, alcohol, family history.',diagnosis:'Physical and neurological assessment, NIHSS, CT scan, MRI scan, carotid duplex, cerebral angiography, blood tests, coagulation profile.',treatment:'Ischaemic: thrombolysis as early as possible. Haemorrhagic: craniotomy, clot evacuation, aneurysm clipping, endovascular embolization, ventriculostomy, osmotic diuretics.',drugs:'Thrombolytics, osmotic diuretics, supportive medicines.'}},
   {name:'TIA (Transient Ischaemic Attack)',fields:{definition:'A brief interruption of blood flow with symptoms usually resolving within about 24 hours.',mechanism:'Temporary blockage of a cerebral artery without permanent infarction.',manifestations:'Same neurological deficits as stroke but resolve fully — weakness, speech difficulty, visual loss.',comparisons:'TIA resolves completely; stroke causes permanent deficit. TIA is a major warning sign for imminent stroke.',types:'TIA.',risk:'Same as stroke: hypertension, diabetes, smoking, atrial fibrillation.',diagnosis:'Clinical assessment, CT/MRI to exclude completed stroke, carotid imaging.',treatment:'Antiplatelet therapy, anticoagulation if AF present, risk factor control.',drugs:'Aspirin, clopidogrel, anticoagulants if indicated.'}}
  ],
  flash:[['TIA','Brief interruption of brain blood supply'],['Ischaemic stroke','Blocked cerebral artery'],['Haemorrhagic stroke','Bleeding in or around the brain'],['Common risk factor','Hypertension']]},

 {category:'CNS', id:'parkinson', name:'Parkinson Disease', tags:['parkinson','pd'], summary:'Progressive neurodegenerative disorder caused by loss of dopaminergic neurons in the nigrostriatal pathway.',
  pathologies:[{name:'',fields:{definition:'Progressive neurodegenerative disorder with loss of dopaminergic neurons in the nigrostriatal pathway.',mechanism:'Basal ganglia dysfunction occurs as dopamine-producing neurons die; Lewy bodies are often present.',manifestations:'Tremor at rest, rigidity, akinesia/bradykinesia, postural instability, shuffling gait, flexed posture, freezing, drooling, reduced facial expression, constipation, orthostatic hypotension, sleep problems, depression, anxiety, dementia.',comparisons:'Motor symptoms are the classic features; non-motor symptoms include autonomic, sensory, cognitive, and behavioural changes.',types:'Akinetic movement disorder.',risk:'Age, gender, inheritance, pesticides and herbicides, head trauma, brain tumour, neurotoxic chemicals.',diagnosis:'History, physical examination, brain imaging, olfactory testing.',treatment:'Education, daily exercise, nutritional support, deep brain stimulation.',drugs:'Muscarinic agents, L-dopa, dopamine agonists, MAO-B inhibitors, peripheral decarboxylase inhibitors.'}}],
  flash:[['TRAP','Tremor, Rigidity, Akinesia, Postural instability'],['Main neurotransmitter lost','Dopamine'],['Lewy body protein','Alpha-synuclein'],['A motor symptom','Shuffling gait']]},

 {category:'CNS', id:'ad', name:'Alzheimer Disease & Dementia', tags:['alzheimer','dementia','ad'], summary:'Dementia is progressive and irreversible; Alzheimer disease is the most common type.',
  pathologies:[{name:'',fields:{definition:'Dementia is progressive, irreversible cerebral dysfunction. Alzheimer disease is the most common type of dementia.',mechanism:'Neuronal loss, beta-amyloid plaques, and neurofibrillary tangles drive cognitive decline.',manifestations:'Forgetfulness, poor recall, confusion, loss of concentration, disorientation, irritability, agitation, mood swings, anxiety, depression, personality changes, inability to recognise family, loss of daily skills.',comparisons:'Early disease mainly affects memory and new learning; advanced disease causes total dependence.',types:'Alzheimer disease is the most common form of dementia.',risk:'Age over 65, smoking, alcohol, cerebrovascular disease, diabetes, obesity, APP, PSEN1, PSEN2, and ApoE-related genes.',diagnosis:'History, brain imaging, olfactory testing.',treatment:'Support for the person and carers, depression management, cognitive support.',drugs:'Acetylcholinesterase inhibitors, NMDA antagonists, SSRIs.'}}],
  flash:[['Beta-amyloid','Forms extracellular plaques'],['Tau protein','Forms neurofibrillary tangles'],['First common sign','Forgetfulness'],['Memantine class','NMDA antagonist']]},

 {category:'CNS', id:'ms', name:'Multiple Sclerosis', tags:['multiple sclerosis','ms'], summary:'Demyelinating disorder affecting the brain, spinal cord, and cranial nerves.',
  pathologies:[{name:'',fields:{definition:'Chronic degenerative disease caused by demyelination in the brain, spinal cord, and cranial nerves.',mechanism:'Loss of myelin in white matter blocks nerve conduction and causes inflammatory plaques.',manifestations:'Muscular weakness, heaviness in the legs, speech difficulty, numbness, vision defects, bladder and bowel dysfunction, sexual dysfunction, fatigue, depression, short-term memory loss.',comparisons:'Progressive but may relapse and remit between exacerbations.',types:'Chronic autoimmune demyelinating disorder.',risk:'Viruses, toxins, UV rays, autoimmune processes.',diagnosis:'Neurological history, physical examination, elevated CSF IgG, optic nerve conduction testing, brain imaging.',treatment:'Multidisciplinary care, symptom management, bowel and bladder support, depression support.',drugs:'Baclofen, diazepam, oxybutynin, fluoxetine, amitriptyline, imipramine, stool softeners, laxatives.'}}],
  flash:[['Main pathology','Demyelination'],['Common symptom','Visual disturbance'],['CSF finding','Persistently elevated IgG'],['Spasticity drug','Baclofen']]},

 {category:'CNS', id:'epilepsy', name:'Epilepsy', tags:['epilepsy','seizure'], summary:'Group of disorders caused by abnormal electrical discharge in the brain.',
  pathologies:[{name:'',fields:{definition:'Range of conditions caused by abnormal electrical discharge in the brain.',mechanism:'Seizures result from abnormal neuronal firing; status epilepticus is prolonged or repeated seizure activity.',manifestations:'Tonic and clonic phases, staring, brief jerks, stiff body movements, loss of consciousness in many seizure types, confusion in complex partial seizures.',comparisons:'Partial seizures involve part of the brain; generalised seizures involve both hemispheres and usually cause unconsciousness.',types:'Partial, generalised, absence, myoclonic, tonic-clonic, atonic, unclassified, status epilepticus.',risk:'Prolonged seizures can be life-threatening.',diagnosis:'Clinical history and seizure classification by onset and pattern.',treatment:'Maintain airway, provide oxygen, protect from injury, administer prescribed medication during status epilepticus, consider surgery in selected cases.',drugs:'Carbamazepine, sodium valproate, phenytoin, diazepam.'}}],
  flash:[['Partial seizure','Involves part of the brain'],['Generalised seizure','Involves both hemispheres'],['Status epilepticus','Repeated or prolonged seizure activity'],['Common drug','Sodium valproate']]},

 // ── CVS ──────────────────────────────────────────────────────────────────────
 {category:'CVS', id:'mi', name:'Myocardial Infarction & Angina', tags:['mi','angina','heart attack'], summary:'Myocardial infarction is prolonged coronary occlusion causing necrosis; angina is transient ischaemic chest pain.',
  pathologies:[
   {name:'Myocardial Infarction',fields:{definition:'Prolonged coronary occlusion causing irreversible myocardial necrosis.',mechanism:'Reduced coronary blood flow lowers oxygen supply; prolonged deprivation causes myocardial cell death.',manifestations:'Severe crushing chest pain, radiation to arm/neck/jaw, nausea, vomiting, fatigue, sweating, pallor, shortness of breath, palpitations, impending doom.',comparisons:'STEMI is transmural with ST elevation; NSTEMI is non-transmural and does not traverse the full wall.',types:'STEMI, NSTEMI.',risk:'Atherosclerosis, smoking, hypertension, diabetes, obesity, inactivity, alcohol, cocaine, age, family history.',diagnosis:'ECG, chest X-ray, blood chemistry, angiogram, echocardiogram, myocardial perfusion scan.',treatment:'Oxygen, pain relief, nitrates, beta blockers, aspirin, heparin, ACE inhibitors, lifestyle and risk-factor control.',drugs:'Vasodilators, beta blockers, platelet inhibitors, antithrombins, ACE inhibitors.'}},
   {name:'Angina',fields:{definition:'Chest pain from myocardial ischaemia without permanent cell death.',mechanism:'Temporary reduction in coronary blood flow below metabolic demand; usually from atherosclerosis.',manifestations:'Chest pain relieved by rest (stable) or occurring at rest (unstable); radiation to arm/jaw.',comparisons:'Stable angina is predictable and effort-related; unstable angina occurs at rest and is a medical emergency; variant angina is from coronary spasm.',types:'Stable angina, unstable angina, variant (Prinzmetal) angina.',risk:'Same as MI: atherosclerosis, smoking, hypertension, diabetes.',diagnosis:'Exercise ECG, coronary arteriography, stress echocardiography.',treatment:'Nitrates for acute relief; beta blockers for prevention; revascularisation for refractory cases.',drugs:'Nitrates, beta blockers, calcium channel blockers.'}}
  ],
  flash:[['STEMI','Transmural infarction with ST elevation'],['NSTEMI','Non-transmural infarction'],['Stable angina','Improves with rest'],['Common pain description','Crushing substernal pain']]},

 {category:'CVS', id:'hf', name:'Heart Failure & Cardiogenic Shock', tags:['heart failure','shock','hf'], summary:'Heart failure is pump failure; cardiogenic shock is severe failure with poor perfusion.',
  pathologies:[
   {name:'Heart Failure',fields:{definition:'The heart\'s inability to meet body demands.',mechanism:'Reduced contractility or abnormal relaxation lowers cardiac output.',manifestations:'Shortness of breath, cough or wheeze, oedema, fatigue, light-headedness, nausea, confusion, high heart rate.',comparisons:'Left HF causes pulmonary oedema; right HF causes peripheral oedema and systemic venous congestion.',types:'Left heart failure, right heart failure.',risk:'Coronary heart disease, previous MI, high blood pressure, congenital defects, cardiomyopathy, valvular disease, myocarditis.',diagnosis:'Chest X-ray, ECG, ABGs, blood chemistry, troponins, echocardiogram, cardiac perfusion scan.',treatment:'Oxygen, reduced sodium diet, laxatives, daily weight monitoring, fluid restriction, education, diuretics, anticoagulants, anti-arrhythmics.',drugs:'ACE inhibitors, selected beta blockers, diuretics, anticoagulants, anti-arrhythmics, furosemide.'}},
   {name:'Cardiogenic Shock',fields:{definition:'Severe pump failure causing inadequate tissue perfusion.',mechanism:'Myocardial damage is so severe that cardiac output cannot meet perfusion needs despite adequate filling pressures.',manifestations:'Severe hypotension, oliguria, cold skin, raised JVP, chest pain, dyspnoea, sweating.',comparisons:'Cardiogenic shock is pump failure (low CO, high SVR); distributive shock (e.g. septic) is vasodilation (low SVR).',types:'Cardiogenic shock.',risk:'Large MI, acute decompensation of severe heart failure.',diagnosis:'Clinical presentation, echocardiogram, invasive haemodynamic monitoring.',treatment:'Inotropes to improve contractility, vasopressors, mechanical circulatory support, treat underlying cause.',drugs:'Milrinone, dobutamine, vasopressors.'}}
  ],
  flash:[['Left HF','Pulmonary oedema'],['Right HF','Peripheral oedema'],['Cardiogenic shock','Inadequate tissue perfusion from pump failure'],['Daily self-care','Daily weight monitoring']]},

 {category:'CVS', id:'vascular', name:'Hypertension, Atherosclerosis, Aneurysm & DVT', tags:['hypertension','atherosclerosis','aneurysm','dvt'], summary:'Vascular disorders include high blood pressure, plaque disease, vessel dilation, and venous thrombosis.',
  pathologies:[
   {name:'Hypertension',fields:{definition:'Sustained high arterial pressure.',mechanism:'RAAS dysregulation (primary) or identifiable cause such as renal disease or endocrine disorder (secondary).',manifestations:'Often silent; may cause headache, dizziness, nosebleeds, fatigue, blurred vision, tinnitus.',comparisons:'Primary hypertension is most common; secondary has an identifiable cause.',types:'Primary, secondary, malignant, isolated systolic hypertension.',risk:'Obesity, stress, smoking, excess sodium, family history, sedentary lifestyle.',diagnosis:'Blood pressure measurement, renal function tests, ECG, urinalysis.',treatment:'Sodium reduction, weight loss, exercise, smoking cessation, antihypertensives.',drugs:'ACE inhibitors, ARBs, calcium channel blockers, thiazide diuretics, beta blockers.'}},
   {name:'Atherosclerosis',fields:{definition:'Formation of fibro-fatty plaques within arterial walls.',mechanism:'Endothelial injury → lipid accumulation → macrophage infiltration → foam cells → fibrous plaque → calcification and potential rupture.',manifestations:'Diminished pulses, pallor, cyanosis, claudication, angina, stroke, or MI depending on territory affected.',comparisons:'Atherosclerosis (plaque disease) vs arteriosclerosis (non-plaque arterial stiffening).',types:'Coronary, cerebral, peripheral arterial disease.',risk:'Hypercholesterolaemia, age, inflammation, smoking, hypertension, sedentary lifestyle.',diagnosis:'Doppler ultrasound, arteriogram, cholesterol panels.',treatment:'Diet, BP and cholesterol control, smoking cessation, antiplatelet therapy.',drugs:'Lipid-lowering drugs, antiplatelet drugs, vasodilators.'}},
   {name:'Aneurysm',fields:{definition:'Permanent localised dilatation of a blood vessel wall.',mechanism:'Wall weakness from atherosclerosis, infection, hypertension, or cystic medial degeneration → vessel balloons out.',manifestations:'Often asymptomatic until rupture; may cause pulsatile mass, abdominal or back pain (AAA), or neurological signs (cerebral).',comparisons:'True aneurysm involves all vessel wall layers; false (pseudo) aneurysm is contained by surrounding tissue.',types:'True and dissecting aneurysms; aortic, cerebral, peripheral.',risk:'Atherosclerosis, infection, hypertension, cystic medial degeneration.',diagnosis:'Angiography, ultrasound, CT, chest X-ray, blood chemistry.',treatment:'Surgical or endovascular repair for large/symptomatic aneurysms; blood pressure control.',drugs:'Antihypertensives, beta blockers to reduce wall stress.'}},
   {name:'Deep Vein Thrombosis (DVT)',fields:{definition:'Thrombus formation in deep veins without primary inflammation.',mechanism:'Virchow\'s triad: stasis + hypercoagulability + vessel wall injury → clot formation.',manifestations:'Aching limb pain, oedema, cyanosis, redness, warmth, and dilated superficial veins; risk of pulmonary embolism.',comparisons:'DVT is venous thrombosis; thrombophlebitis involves superficial veins with inflammation.',types:'DVT, thrombophlebitis, varicose veins, arterial and venous insufficiency.',risk:'Stasis, hypercoagulability, age, obesity, pregnancy, varicose veins, smoking, immobility, long-haul travel.',diagnosis:'Doppler ultrasound, venogram, D-dimer, physical examination.',treatment:'Anticoagulation, hydration, exercise, avoiding prolonged immobility, compression stockings.',drugs:'Anticoagulants (heparin, warfarin, DOACs), thrombolytics in severe cases.'}}
  ],
  flash:[['Atherosclerosis','Fibro-fatty plaque disease'],['DVT','Deep vein thrombosis'],['Hypertension','Sustained high arterial pressure'],['One prevention step','Exercise and smoking cessation']]},

 // ── Renal ─────────────────────────────────────────────────────────────────────
 {category:'Renal', id:'renal', name:'UTI, Pyelonephritis, CKD, AKI & Renal Calculi', tags:['renal','uti','ckd','aki','calculi'], summary:'Renal disorders include UTIs, pyelonephritis, acute kidney injury, chronic kidney disease, and renal calculi.',
  pathologies:[
   {name:'Urinary Tract Infection (UTI)',fields:{definition:'Infection of the urinary tract, usually from ascending bowel flora.',mechanism:'Bacteria (most commonly E. coli) colonise the urethra and ascend; females are more susceptible due to shorter urethra.',manifestations:'Dysuria, frequency, urgency, cloudy or offensive urine, fever.',comparisons:'UTI and cystitis affect the lower tract; pyelonephritis affects the kidney.',types:'Cystitis, urethritis.',risk:'Female sex, catheterisation, poor hydration, sexual activity, pregnancy, postmenopausal state, diabetes, vesicoureteral reflux.',diagnosis:'Urinalysis, dipstick, midstream urine culture.',treatment:'Fluids, catheter removal if present, antibiotics, urinary alkalinisers, cranberry supplements.',drugs:'Nitrofurantoin, trimethoprim-sulfamethoxazole, ciprofloxacin, fosfomycin.'}},
   {name:'Pyelonephritis',fields:{definition:'Bacterial infection of the renal pelvis and nephrons, usually ascending from the lower urinary tract.',mechanism:'Ascending bacteria reach the kidney → inflammatory response → renal tissue damage.',manifestations:'Fever, chills, nausea, vomiting, groin pain, haematuria, dysuria, flank pain.',comparisons:'Acute pyelonephritis is rapid onset and usually reversible; chronic pyelonephritis involves repeated episodes causing scarring.',types:'Acute pyelonephritis, chronic pyelonephritis.',risk:'Female sex, prior UTI, vesicoureteral reflux, pregnancy, urinary obstruction.',diagnosis:'Urinalysis, urine culture, blood tests, ultrasound or CT.',treatment:'Antibiotics, analgesics, anti-emetics, antipyretics, IV fluids if systemically unwell.',drugs:'Ceftriaxone, ertapenem, levofloxacin, gentamicin.'}},
   {name:'Acute Kidney Injury (AKI)',fields:{definition:'Sudden loss of kidney function.',mechanism:'Pre-renal (reduced perfusion), intrarenal (parenchymal damage), or post-renal (obstruction).',manifestations:'Raised urea and creatinine, oliguria, anuria, uraemia, malaise, anorexia.',comparisons:'AKI is abrupt and often reversible; CKD is gradual and irreversible.',types:'Pre-renal AKI, intrarenal AKI, post-renal AKI.',risk:'Dehydration, trauma, surgery, sepsis, nephrotoxins, heart or liver disease.',diagnosis:'Renal function tests (creatinine, eGFR), urine output monitoring, imaging, urinalysis.',treatment:'Supportive care, fluid and electrolyte monitoring, identify and treat cause, strict input/output.',drugs:'Supportive fluid therapy, electrolyte correction, avoid nephrotoxins.'}},
   {name:'Chronic Kidney Disease (CKD)',fields:{definition:'Progressive, irreversible loss of renal function over months to years.',mechanism:'Progressive nephron loss reduces GFR; compensatory hyperfiltration causes further damage in remaining nephrons.',manifestations:'Lethargy, headache, breathlessness, haematuria, hypertension, pallor, anaemia, oedema.',comparisons:'CKD is gradual and irreversible; ESRD requires dialysis or transplant.',types:'CKD Stages 1–5; End-Stage Renal Disease (ESRD).',risk:'Diabetes, hypertension, chronic pyelonephritis, glomerulonephritis, renal calculi, prostatic hypertrophy.',diagnosis:'eGFR, serum creatinine, proteinuria, imaging, renal biopsy.',treatment:'Dialysis, renal diet, fluid and sodium restriction, erythropoietin for anaemia, phosphate binders, transplant.',drugs:'ACE inhibitors, erythropoietin, phosphate binders, thiazide diuretics.'}},
   {name:'Renal Calculi (Kidney Stones)',fields:{definition:'Stones formed when ions precipitate and crystallise within the urinary tract.',mechanism:'Supersaturation of urine with calcium oxalate, uric acid, or struvite → crystal nucleation → stone growth.',manifestations:'Colicky flank pain (renal colic), haematuria, nausea, vomiting; asymptomatic if small.',comparisons:'Small stones often pass spontaneously; large stones may obstruct and require intervention.',types:'Calcium oxalate (most common), uric acid, struvite, cystine stones.',risk:'Dehydration, immobility, high calcium or protein intake, gout, hyperparathyroidism, family history, UTI.',diagnosis:'Imaging (ultrasound, CT KUB), urinalysis, stone analysis.',treatment:'Fluids, dietary modification, analgesia; surgery or ESWL when needed.',drugs:'Analgesics (NSAIDs, opioids), potassium citrate, thiazide diuretics (calcium stones), allopurinol (uric acid stones).'}}
  ],
  flash:[['UTI','Infection of the urinary tract'],['AKI','Sudden decline in kidney function'],['CKD','Progressive irreversible renal dysfunction'],['Renal calculi','Urinary stones']]},

 // ── Inflammation & Healing ────────────────────────────────────────────────────
 {category:'Inflammation', id:'inflammation_basics', name:'Inflammation: Overview & Cardinal Signs', tags:['inflammation','acute','vascular','cellular'], summary:'Inflammation is the body\'s first-line response to injury. It has two phases and five cardinal signs.',
  pathologies:[{name:'',fields:{definition:'Inflammation is the first-line body response to injury aimed at neutralising the injurious agent, stopping further damage, cleaning up the site, and initiating repair.',mechanism:'Vascular phase: chemical mediators (histamine, prostaglandins, bradykinin, complement, kinin-kallikrein, clotting cascade) cause vasodilation and increased capillary permeability. Cellular phase: leukocytes are attracted by chemotaxis and migrate through capillary walls by diapedesis to phagocytose debris and microbes.',manifestations:'Five cardinal signs: Rubor (redness — vasodilation), Calor (heat — increased blood flow), Tumor (swelling — exudate/oedema), Dolor (pain — nociceptor stimulation), Functio laesa (loss of function — pain and swelling).',comparisons:'Acute inflammation begins within minutes and lasts days (e.g. URTI, UTI). Chronic inflammation lasts >2 weeks, involves lymphocytes, and can cause fibrosis, scarring, and granuloma formation (e.g. tuberculosis, autoimmune diseases).',types:'Exudate types — Serous (watery, low protein); Fibrinous (high protein, fibrin clot); Purulent (pus); Haemorrhagic (red blood cells).',risk:'Infection, physical injury, chemical injury, autoimmune reactions. Pattern Recognition Molecules detect stimuli and activate NFkB signalling.',diagnosis:'Clinical assessment of cardinal signs; CRP, white cell count, ESR; imaging as appropriate.',treatment:'Corticosteroids and NSAIDs reduce vascular-phase signs; positioning reduces oedema; analgesia manages pain; antibiotics and wound cleaning address infection.',drugs:'NSAIDs (e.g. ibuprofen), corticosteroids (e.g. prednisolone), analgesics, antibiotics.'}}],
  flash:[['Rubor','Redness caused by vasodilation'],['Calor','Heat from increased blood flow'],['Tumor','Swelling from exudate accumulation'],['Dolor','Pain from nociceptor stimulation'],['Functio laesa','Loss of function from pain and swelling'],['Vascular phase','Chemical mediators causing vasodilation'],['Cellular phase','White cells entering tissue by diapedesis'],['Serous exudate','Watery, low-protein fluid']]},

 {category:'Inflammation', id:'inflammation_cells', name:'Inflammatory Mediators & Cell Types', tags:['mediators','neutrophils','macrophages','cytokines'], summary:'A range of chemical mediators and white blood cell types drive and regulate the inflammatory response.',
  pathologies:[{name:'',fields:{definition:'Inflammatory mediators include prostaglandins, histamine, bradykinin, leukotrienes, cytokines, nitric oxide, complement proteins, thromboxanes, platelet-activating factor, and C-reactive protein.',mechanism:'Prostaglandins: vasodilation, fever, hyperalgesia. Histamine: vasodilation and increased vascular permeability. Bradykinin: vasodilation, permeability, hyperalgesia, smooth muscle contraction. Complement (~10 proteins): opsonins and membrane attack complex (MAC). Clotting cascade: fibrin mesh to trap injurious agent and initiate repair.',manifestations:'Neutrophils: phagocytosis (first responders). Monocytes → macrophages: sustained phagocytosis, antigen presentation, cytokine production. Eosinophils: allergic reactions and helminthic infections. Basophils/mast cells: histamine release. Lymphocytes: B cells produce antibodies; T cells provide cell-mediated immunity.',comparisons:'Neutrophils predominate in acute inflammation; lymphocytes dominate in chronic inflammation. Basophils are blood equivalents of tissue mast cells.',types:'Pro-inflammatory mediators, complement system, clotting cascade, kinin-kallikrein system. Cell types: neutrophils, monocytes/macrophages, eosinophils, basophils/mast cells, lymphocytes.',risk:'Excessive or dysregulated mediator release can drive chronic inflammation, autoimmune disease, or systemic effects such as fever and sepsis.',diagnosis:'Blood tests for white cell differentials, complement levels, CRP, ESR, cytokine panels.',treatment:'NSAIDs inhibit COX pathway; antihistamines block histamine; corticosteroids broadly suppress mediators; immunosuppressants target lymphocyte activity.',drugs:'NSAIDs, antihistamines, corticosteroids, immunosuppressants, biologics targeting cytokines (e.g. TNF-alpha antagonists).'}}],
  flash:[['Neutrophils','First responders — phagocytosis in acute inflammation'],['Macrophages','Sustained phagocytosis, antigen presentation, healing initiation'],['Histamine','Released by mast cells; causes vasodilation and increased permeability'],['Prostaglandins','Cause vasodilation, fever, hyperalgesia'],['Complement MAC','Membrane attack complex that lyses pathogens'],['Bradykinin','Vasodilation, increased permeability, hyperalgesia'],['Lymphocytes dominant in','Chronic inflammation'],['Eosinophils','Helminthic infections and allergic reactions']]},

 {category:'Inflammation', id:'healing_repair', name:'Healing, Repair & Factors Impeding Healing', tags:['healing','repair','first intention','second intention','wound'], summary:'Healing requires debridement and neutralisation, followed by clot formation, granulation tissue growth, and remodelling.',
  pathologies:[{name:'',fields:{definition:'Healing by first intention: little tissue loss, quick healing, minimal scar (e.g. surgical incision). Healing by second intention: significant tissue loss, prolonged healing, significant scarring. Neoplasia refers to new tissue growth that serves no purpose.',mechanism:'Steps: fibrin clot fills and seals the wound; epithelialisation begins; remaining clot dissolves; granulation tissue grows in; myofibroblasts cause wound contraction; remodelling occurs over weeks to months.',manifestations:'Poor healing presents as wound dehiscence, persistent infection, excessive scar formation (keloid or hypertrophic), chronic ulceration.',comparisons:'First intention: clean wound edges, rapid epithelialisation, minimal scar. Second intention: large tissue defect, prolonged granulation, significant scarring.',types:'First intention healing, second intention healing, wound contraction, granulation tissue formation, scar remodelling.',risk:'Factors impeding healing: Infection, Movement, Poor nutrient supply, Poor oxygen delivery, Drug therapy (anticancer drugs, immunosuppressants, glucocorticoids), Poor blood flow.',diagnosis:'Wound inspection, measurement of granulation and epithelialisation progress, assessment for infection.',treatment:'Adequate nutrition, optimise blood flow, control infection, immobilise the wound, review medications, debride necrotic tissue.',drugs:'Antibiotics for infection, vitamin and mineral supplements, growth factors in specialised wound care.'}}],
  flash:[['First intention healing','Little tissue loss, quick healing, minimal scarring'],['Second intention healing','Significant tissue loss, prolonged healing, major scarring'],['Granulation tissue','New vascular tissue that fills a wound bed'],['Myofibroblasts','Cells that drive wound contraction'],['Infection on healing','Causes dehiscence and prevents wound edge adhesion'],['Drug that impairs healing','Glucocorticoids / immunosuppressants'],['Debridement','Cleaning up the site of injury to enable repair']]},

 {category:'Inflammation', id:'neoplasia', name:'Neoplasia, Carcinogenesis & Cancer Epidemiology', tags:['cancer','neoplasia','tumour','carcinogenesis','malignant'], summary:'Neoplasia is new purposeless tissue growth. Carcinogenesis involves accumulated mutations leading to malignant transformation.',
  pathologies:[{name:'',fields:{definition:'A benign tumour does not invade or spread. A malignant tumour destroys tissue, spreads, and can cause death. Oncology is the study and treatment of cancer.',mechanism:'Cancer cells accumulate irreparable DNA errors and resist apoptosis. Approximately 4–7 mutations are needed. Hallmarks of cancer: sustaining proliferative signalling, evading growth suppressors, resisting apoptosis, enabling replicative immortality, inducing angiogenesis, activating invasion and metastasis, avoiding immune destruction.',manifestations:'Pain (pressure on organs/nerves/bones), cachexia (inflammatory cytokines), fatigue (stress, reduced nutrition, immune suppression), anaemia (reduced EPO, bleeding), infection (impaired immunity).',comparisons:'Benign: adenoma, lipoma — do not invade or metastasise. Malignant: carcinoma, sarcoma, lymphoma — invade and spread.',types:'Benign: adenoma, angioma, fibroma, lipoma, neuroma, osteoma. Malignant: adenocarcinoma, blastoma, carcinoma, melanoma, sarcoma, lymphoma.',risk:'Tobacco, physical inactivity, dietary factors, obesity, alcohol, infections (H. pylori, HPV, EBV, hepatitis B/C), environmental pollution, occupational carcinogens, ionising radiation.',diagnosis:'Biopsy, histopathology, imaging (CT, MRI, PET), tumour markers, staging.',treatment:'Surgical excision, chemotherapy, radiotherapy, immunotherapy, targeted therapy, hormone therapy, palliative care.',drugs:'Anticancer drugs, erythropoietin, corticosteroids, analgesics, antibiotics.'}}],
  flash:[['Benign tumour','Does not invade, destroy, or spread'],['Malignant tumour','Destroys tissue, spreads, can cause death'],['Mutations needed for cancer','Approximately 4–7 accumulated mutations'],['Carcinoma','Malignant tumour of epithelial cells'],['Sarcoma','Malignant tumour of mesodermal/connective tissue'],['Most common in Australian males (2017)','Prostate'],['Most common in Australian females (2017)','Breast']]},

 // ── Blood ─────────────────────────────────────────────────────────────────────
 {category:'Blood', id:'anaemia_overview', name:'Anaemias: Overview & Classification', tags:['anaemia','erythrocyte','haemoglobin','iron','B12'], summary:'Anaemia is a reduction in haemoglobin or red cell count, classified by cell size and haemoglobin content.',
  pathologies:[{name:'',fields:{definition:'Anaemia is a decrease in haemoglobin below normal (120–160 g/L in women; 135–180 g/L in men), resulting from altered erythrocyte production, blood loss, or increased erythrocyte destruction.',mechanism:'Microcytic (small RBCs — iron deficiency, thalassaemia); Macrocytic (large RBCs — B12 deficiency, leukaemia); Normocytic (normal-sized RBCs — haemorrhage, renal failure, haemolytic anaemia).',manifestations:'Hypoxia, fatigue, pallor, shortness of breath, tachycardia, headache, dizziness, impaired concentration. Severe cases cause heart failure.',comparisons:'Iron-deficiency: microcytic hypochromic. Pernicious: macrocytic normochromic. Haemolytic: normocytic normochromic. Aplastic: normocytic from stem cell failure.',types:'Iron-deficiency anaemia, pernicious anaemia, thalassaemia, haemolytic anaemia, sickle cell anaemia, aplastic anaemia, anaemia of chronic renal failure, anaemia of haemorrhage.',risk:'Iron deficiency: vegetarian diet, chronic poverty, pregnancy, chronic bleeding. B12/folate deficiency: malnutrition, alcohol abuse, pregnancy, GI disorder, autoimmune gastric disease.',diagnosis:'FBC, blood film, haemoglobin, MCV, MCH, serum ferritin, serum iron, B12 and folate levels, reticulocyte count, bone marrow biopsy.',treatment:'Iron deficiency: dietary iron, vitamin C, oral iron supplements, IV/IM iron, transfusion if severe. B12/folate deficiency: dietary sources, IV cyanocobalamin, folate supplements.',drugs:'Ferrous sulfate/fumarate, IV iron sucrose, IV cyanocobalamin (B12), folic acid, erythropoietin (renal anaemia), packed red cell transfusion.'}}],
  flash:[['Normal Hb in women','120–160 g/L'],['Normal Hb in men','135–180 g/L'],['Microcytic anaemia','Small RBCs — iron deficiency or thalassaemia'],['Macrocytic anaemia','Large RBCs — B12 deficiency, pernicious anaemia'],['Normocytic anaemia','Normal-sized RBCs — haemorrhage or haemolytic cause'],['Iron treatment preference','Ferrous ion form, oral or IV/IM']]},

 {category:'Blood', id:'specific_anaemias', name:'Thalassaemia, Sickle Cell & Haemolytic Disease of the Newborn', tags:['thalassaemia','sickle cell','HDN','haemolytic'], summary:'These anaemias arise from inherited haemoglobin abnormalities or immune incompatibility.',
  pathologies:[
   {name:'Thalassaemia',fields:{definition:'Inherited mutations causing reduced or absent synthesis of globin chains, leading to haemolytic anaemia and iron overload.',mechanism:'Defective α globin chains (common in South-East Asian/Chinese populations) or β globin chains (Mediterranean heritage) → ineffective erythropoiesis and haemolysis; iron accumulates in organs.',manifestations:'Microcytic hypochromic anaemia, hepatosplenomegaly, bronze skin, heart failure, growth retardation, elevated bilirubin.',comparisons:'Alpha-thalassaemia more common in South-East Asian and Chinese populations. Beta-thalassaemia more common in Mediterranean heritage. Both more common in malaria-endemic regions.',types:'α-thalassaemia, β-thalassaemia (minor, intermedia, major).',risk:'Autosomal recessive inheritance.',diagnosis:'Blood film, Hb electrophoresis, genetic testing.',treatment:'Regular transfusions, chelation therapy (to remove excess iron), splenectomy.',drugs:'Chelation agents (desferrioxamine).'}},
   {name:'Sickle Cell Anaemia',fields:{definition:'Autosomal recessive mutation in the β-globin chain producing variant haemoglobin (HbS) that causes erythrocytes to adopt a sickle shape.',mechanism:'Homozygous HbS causes rigid sickle-shaped cells that obstruct capillaries causing ischaemia and organ damage; the spleen destroys these cells causing haemolysis. Heterozygous carriers have partial malaria resistance.',manifestations:'Haemolytic anaemia, painful vaso-occlusive crises, ischaemia, organ failure.',comparisons:'Sickle cell anaemia (HbSS) is severe; sickle cell trait (HbAS) is usually asymptomatic with partial malaria resistance.',types:'Sickle cell anaemia (HbSS), sickle cell trait (HbAS).',risk:'Autosomal recessive; Sub-Saharan African, Middle Eastern, South Asian, Mediterranean, Caribbean heritage.',diagnosis:'Sickling test, Hb electrophoresis (HbS).',treatment:'Analgesics for crises, hydration, oxygen, hydroxyurea, transfusion, bone marrow transplant.',drugs:'Hydroxyurea, analgesics, transfusion.'}},
   {name:'Haemolytic Disease of the Newborn (HDN)',fields:{definition:'Occurs when maternal antibodies cross the placenta and destroy foetal erythrocytes.',mechanism:'Rh-negative mother sensitised to Rh-positive foetal blood at delivery → anti-Rh antibodies cross the placenta in subsequent pregnancies → foetal haemolysis, hyperbilirubinaemia, jaundice, and kernicterus.',manifestations:'Foetal anaemia, hyperbilirubinaemia, jaundice, kernicterus (brain damage from bilirubin).',comparisons:'HDN from Rh incompatibility affects ~10% of pregnancies; ABO incompatibility affects ~25% but is usually milder.',types:'HDN from Rh incompatibility, HDN from ABO incompatibility.',risk:'Rh-negative mother with Rh-positive foetus; does not affect the first pregnancy.',diagnosis:'Maternal blood grouping, indirect Coombs test (antenatal), direct Coombs test (newborn).',treatment:'Anti-D immunoglobulin to Rh-negative mothers after each delivery; IV immunoglobulin, transfusion, phototherapy, oxygen for affected newborn.',drugs:'Anti-D immunoglobulin, phototherapy, IV immunoglobulin.'}}
  ],
  flash:[['Thalassaemia inheritance','Autosomal recessive'],['Sickle cell mutation','β-globin chain produces HbS instead of HbA'],['HbSS consequence','Sickle-shaped cells obstruct capillaries → ischaemia and organ damage'],['HDN and first pregnancy','First pregnancy NOT affected; sensitisation occurs at delivery'],['HDN prevention','Anti-D immunoglobulin to Rh-negative mother after delivery'],['Kernicterus','Brain damage from severe hyperbilirubinaemia in HDN']]},

 {category:'Blood', id:'bleeding_polycythaemia', name:'Polycythaemia, Bleeding Disorders & Thrombocytopenia', tags:['polycythaemia','haemophilia','thrombocytopenia','von willebrand','bleeding'], summary:'Polycythaemia is excess red cell production; haemophilias and thrombocytopenia are bleeding disorders.',
  pathologies:[
   {name:'Polycythaemia',fields:{definition:'Overproduction of erythrocytes that increases blood viscosity and promotes thrombus formation.',mechanism:'Absolute polycythaemia driven by increased erythropoietin secretion (e.g. chronic hypoxia, EPO-secreting tumours). Raises blood viscosity → thrombosis, ischaemia, organ damage.',manifestations:'Splenomegaly, aquagenic pruritus, raised platelets, thrombosis, hypertension.',comparisons:'Absolute polycythaemia is true increased RBC mass; relative polycythaemia is due to dehydration.',types:'Absolute (primary and secondary), relative polycythaemia.',risk:'Chronic hypoxia (most common), high altitude, EPO-secreting tumours.',diagnosis:'FBC, blood viscosity, oxygen saturation.',treatment:'Periodic phlebotomy, radioactive phosphorus, fluid replacement, antihistamines (pruritus), aspirin, splenectomy.',drugs:'Aspirin, antihistamines, radioactive phosphorus.'}},
   {name:'Haemophilia',fields:{definition:'Hereditary X-linked bleeding disorder from deficiency in clotting factors.',mechanism:'Haemophilias reduce key clotting factors, prolonging bleeding time. Coagulation cascade has extrinsic, intrinsic, and common pathways all converging on fibrin formation.',manifestations:'Mild: excessive bleeding after trauma or surgery (5–35% factor level). Severe: spontaneous bleeding (<1% factor level).',comparisons:'Haemophilia A — factor VIII deficiency; Haemophilia B (Christmas disease) — factor IX deficiency; Haemophilia C — factor XI deficiency.',types:'Haemophilia A, B, C; Von Willebrand disease (autosomal dominant, platelet-related).',risk:'X-linked recessive — predominantly in males.',diagnosis:'Clotting factor assay, APTT (prolonged in A and B).',treatment:'Factor replacement therapy; avoid aspirin.',drugs:'Factor VIII concentrate, factor IX concentrate, desmopressin (mild haemophilia A), recombinant clotting factors.'}},
   {name:'Thrombocytopenia',fields:{definition:'Reduction in platelet levels causing impaired haemostasis.',mechanism:'Immune-mediated destruction, drug-induced suppression, nutritional deficiency (B12, folate, iron), viral infections (HIV), chemotherapy, or bone marrow failure.',manifestations:'Haemorrhage severity depends on degree of platelet loss; petechiae, purpura, easy bruising.',comparisons:'Immune thrombocytopenia (ITP) — autoimmune platelet destruction; drug-induced — reversible on cessation.',types:'Immune thrombocytopenia, drug-induced thrombocytopenia, thrombocytopenia from bone marrow disease.',risk:'Autoimmune, heparin therapy, viral infections, chemotherapy, bone marrow transplantation.',diagnosis:'Platelet count, bone marrow biopsy.',treatment:'Reduce traumatic interventions, fresh frozen plasma, platelet transfusion, IV immunoglobulin, splenectomy, corticosteroids, azathioprine, discontinue heparin if implicated.',drugs:'Corticosteroids, azathioprine, IV immunoglobulin.'}}
  ],
  flash:[['Polycythaemia','Overproduction of erythrocytes → increased blood viscosity'],['Main cause of absolute polycythaemia','Chronic hypoxia increasing erythropoietin'],['Haemophilia A','Factor VIII deficiency (classic haemophilia)'],['Haemophilia B','Factor IX deficiency (Christmas disease)'],['Von Willebrand disease','Autosomal dominant platelet-related bleeding disorder'],['Thrombocytopenia','Reduction in platelets → impaired haemostasis'],['Heparin complication','Can induce thrombocytopenia']]},

 {category:'Blood', id:'white_cell_disorders', name:'Leukaemia, Lymphoma, Multiple Myeloma & Agranulocytosis', tags:['leukaemia','lymphoma','myeloma','agranulocytosis','white cell'], summary:'White cell disorders include malignant proliferation of bone marrow cells, lymphoid cells, plasma cells, and reduced granulocytes.',
  pathologies:[
   {name:'Leukaemia',fields:{definition:'Malignant neoplastic disorder of white cells in the bone marrow with blocked differentiation of haemopoietic stem cells; tumour cells flood the circulating blood.',mechanism:'Progenitor cell alteration → leukocyte production disorder → bone marrow overcrowding → displacement of normal cells.',manifestations:'CNS manifestations, enlarged lymphatic structures, anorexia, fatigue, infections, secondary anaemia, thrombocytopenia, haemorrhage, bone pain.',comparisons:'Acute leukaemias present rapidly with immature cells; chronic leukaemias involve more mature cells and have slower onset.',types:'ALL (acute lymphoblastic), AML (acute myelogenous), CLL (chronic lymphocytic), CML (chronic myelogenous).',risk:'Wide age range; pathophysiology varies by type.',diagnosis:'FBC and differential, bone marrow biopsy, immunophenotyping, cytogenetics.',treatment:'Corticosteroids, chemotherapy, immunomodulators, bone marrow transplant, nutrition support, infection control.',drugs:'Cytotoxic chemotherapy agents, corticosteroids, G-CSF (filgrastim).'}},
   {name:'Lymphoma',fields:{definition:'Malignant neoplastic disorder of lymphoid cells — does NOT initially involve the bone marrow.',mechanism:'Hodgkin lymphoma originates from a single lymph node/chain and is characterised by Reed-Sternberg cells. Non-Hodgkin lymphoma has multifocal origin involving B and T lymphocytes without Reed-Sternberg cells.',manifestations:'Lymphadenopathy, fever, night sweats, weight loss (B symptoms).',comparisons:'Hodgkin (single node origin, Reed-Sternberg cells) vs Non-Hodgkin (multifocal, older adults 50–70, associated with EBV, oncogenes).',types:'Hodgkin lymphoma, Non-Hodgkin lymphoma.',risk:'Non-Hodgkin: EBV, oncogenes, radiation, chemicals.',diagnosis:'Lymph node biopsy, FBC, imaging, bone marrow biopsy.',treatment:'Chemotherapy, radiotherapy, immunotherapy.',drugs:'Rituximab (anti-CD20 for B-cell lymphoma), cytotoxic agents.'}},
   {name:'Multiple Myeloma',fields:{definition:'Malignant B-cell tumour (plasma cell neoplasm) that produces abnormal immunoglobulins, destroying bone marrow and bone.',mechanism:'Abnormal immunoglobulins (M proteins) cause lytic bone lesions; plasma cell proliferation crowds out normal bone marrow cells.',manifestations:'Bone pain, pathological fractures, hypercalcaemia, renal failure, anaemia, infections.',comparisons:'Myeloma involves plasma cells and bone marrow; lymphoma initially involves lymph nodes; leukaemia involves the bone marrow from the start.',types:'Multiple myeloma.',risk:'Increasing age, radiation, chemical exposure (herbicides), genetic mutations.',diagnosis:'Serum protein electrophoresis (M protein), skeletal survey, bone marrow biopsy, FBC.',treatment:'Chemotherapy, proteasome inhibitors, stem cell transplant, bisphosphonates.',drugs:'Proteasome inhibitors (bortezomib), bisphosphonates.'}},
   {name:'Agranulocytosis',fields:{definition:'Significant decrease in granulocytes (neutrophils, eosinophils, basophils) due to bone marrow failure.',mechanism:'Autoimmune destruction of neutrophils, congenital forms, or drug-induced bone marrow suppression.',manifestations:'Severe infections from lack of neutrophil defence.',comparisons:'Agranulocytosis is a granulocyte deficiency; thrombocytopenia is a platelet deficiency; aplastic anaemia affects all cell lines.',types:'Autoimmune, congenital, drug-induced agranulocytosis.',risk:'Congenital, autoimmune, drug-induced.',diagnosis:'FBC and differential, bone marrow biopsy.',treatment:'Stop offending medication, antibiotics, G-CSF/GM-CSF (granulocyte macrophage colony stimulating factor), bone marrow transplant.',drugs:'G-CSF (filgrastim), GM-CSF, antibiotics.'}}
  ],
  flash:[['Leukaemia definition','Malignant WBC disorder from bone marrow with cells flooding the blood'],['Reed-Sternberg cells','Large multinucleated cells — hallmark of Hodgkin lymphoma'],['Hodgkin vs Non-Hodgkin','Hodgkin: single node, Reed-Sternberg. Non-Hodgkin: multifocal, no Reed-Sternberg'],['Multiple myeloma cell','Malignant B cell (plasma cell) producing abnormal immunoglobulins'],['Multiple myeloma bone effect','Lytic lesions from abnormal immunoglobulin destruction'],['Agranulocytosis','Significant drop in granulocytes due to bone marrow failure']]},

 // ── Respiratory ───────────────────────────────────────────────────────────────
 {category:'Respiratory', id:'rsp_rti', name:'Respiratory Tract Infections', tags:['pneumonia','tuberculosis','influenza','covid','bronchiolitis','rti'], summary:'RTIs range from minor upper tract infections to life-threatening lower tract disease.',
  pathologies:[
   {name:'Pneumonia',fields:{definition:'Infection of the lung parenchyma below the carina causing alveolar inflammation and exudate.',mechanism:'Pathogens enter via inhalation or aspiration; defences fail → alveolar oedema, vascular congestion, exudate, impaired gas exchange.',manifestations:'Hypoxaemia, tachypnoea, dyspnoea, tachycardia, pyrexia, productive cough, lethargy, pain, reduced lung expansion, dehydration. Sputum colour: rusty/red = Streptococcus; green = Pseudomonas; foul-smelling = anaerobic; gelatinous = Klebsiella.',comparisons:'Community-acquired (Streptococcus, Mycoplasma, Legionella) vs hospital-acquired (Staphylococcus aureus, Pseudomonas). Lobar pneumonia affects a whole lobe; bronchopneumonia has patchy distribution.',types:'Bacterial pneumonia, viral pneumonia, atypical pneumonia.',risk:'Immunodeficiency, smoking, chronic disease, hospitalisation, extremes of age.',diagnosis:'Chest X-ray, FBC (leucocytosis), sputum analysis, oxygen saturation, CURB-65 severity score.',treatment:'Antibiotics (bacterial), antivirals (viral), supplemental oxygen, paracetamol, fluid balance.',drugs:'Amoxicillin, ceftriaxone, azithromycin (community); vancomycin, piperacillin-tazobactam (hospital).'}},
   {name:'Tuberculosis (TB)',fields:{definition:'Chronic granulomatous infection caused by Mycobacterium tuberculosis.',mechanism:'Inhaled droplet nuclei reach alveoli → macrophage engulfment → granuloma formation (Ghon focus) → dormancy or progressive disease.',manifestations:'Chronic cough, haemoptysis, weight loss, pyrexia, fatigue, night sweats.',comparisons:'TB is a chronic granulomatous bacterial disease; influenza is an acute viral infection.',types:'Primary TB, post-primary (reactivation) TB, miliary TB.',risk:'Immunodeficiency, close contact or droplet exposure, HIV, malnutrition.',diagnosis:'Mantoux/tuberculin skin test, interferon gamma release assay (IGRA), sputum culture, chest X-ray.',treatment:'Combination therapy: ethambutol, isoniazid, rifampicin, pyrazinamide for months.',drugs:'Ethambutol, isoniazid, rifampicin, pyrazinamide.'}},
   {name:'Influenza',fields:{definition:'Acute viral respiratory infection caused by Influenza A or B.',mechanism:'Viral attachment via haemagglutinin to respiratory epithelium → local inflammation and systemic immune response.',manifestations:'Sudden onset fever, myalgia, headache, cough, malaise; can progress to viral pneumonia.',comparisons:'Influenza is acute and self-limiting in most; can be severe in elderly, immunocompromised, or pregnant.',types:'Influenza A, B, C; seasonal vs pandemic strains.',risk:'Extremes of age, immunodeficiency, chronic illness, pregnancy.',diagnosis:'Clinical diagnosis; nasal/throat swab for confirmation.',treatment:'Supportive; antivirals within 48 hours of onset for high-risk groups; annual vaccination.',drugs:'Oseltamivir (Tamiflu), zanamivir; annual influenza vaccine.'}},
   {name:'COVID-19',fields:{definition:'Acute respiratory illness caused by SARS-CoV-2.',mechanism:'Viral binding to ACE2 receptors on respiratory epithelium → local inflammation → potential ARDS, multi-organ failure, clotting disorders.',manifestations:'Fever, cough, fatigue, dyspnoea; may progress to ARDS, multi-organ failure, clotting disorders.',comparisons:'COVID-19 shares features with influenza but causes more severe systemic inflammation and coagulopathy in high-risk groups.',types:'Mild, moderate, severe, critical illness.',risk:'Older age, obesity, diabetes, cardiovascular disease, immunodeficiency.',diagnosis:'Nasal/oral PCR swab, rapid antigen test, CT chest.',treatment:'Supportive care, oxygen, mechanical ventilation, corticosteroids, antivirals, vaccines.',drugs:'Corticosteroids (dexamethasone), antivirals (nirmatrelvir/ritonavir), vaccines (mRNA, viral vector).'}},
   {name:'Bronchiolitis',fields:{definition:'Viral infection causing inflammation and obstruction of the small airways (bronchioles), predominantly in infants.',mechanism:'RSV (most common) → bronchiolar epithelial necrosis and oedema → plugging of small airways → air trapping and atelectasis.',manifestations:'Rhinorrhoea, cough, wheeze, tachypnoea, fever, feeding difficulties, hypoxaemia in severe cases.',comparisons:'Bronchiolitis affects small airways in infants; adult bronchitis affects large airways.',types:'RSV bronchiolitis (most common), adenovirus, rhinovirus.',risk:'Premature infants, <2 years of age, daycare attendance, second-hand smoke exposure.',diagnosis:'Clinical diagnosis; pulse oximetry; chest X-ray if uncertain.',treatment:'Supportive care: oxygen, hydration. Palivizumab prophylaxis for high-risk infants.',drugs:'Supplemental oxygen, palivizumab (RSV prophylaxis for high-risk).'}}
  ],
  flash:[['Rusty sputum suggests','Streptococcus pneumoniae'],['Green sputum suggests','Pseudomonas infection'],['TB causative organism','Mycobacterium tuberculosis'],['Mantoux test','Tuberculin skin test — induration ≥5 mm is positive'],['Community pneumonia common cause','Streptococcus pneumoniae'],['Bronchiolitis most common cause','Respiratory syncytial virus (RSV)'],['COVID-19 receptor','ACE2 (angiotensin-converting enzyme 2)']]},

 {category:'Respiratory', id:'rsp_old', name:'Obstructive Lung Disorders: Asthma, COPD & CF', tags:['asthma','copd','cystic fibrosis','bronchiectasis','obstructive'], summary:'Obstructive disorders share airflow limitation during expiration. Asthma is reversible; COPD is progressive and largely irreversible.',
  pathologies:[
   {name:'Asthma',fields:{definition:'Chronic inflammatory airway narrowing that is reversible.',mechanism:'Mast cell stimulation → cytokines (histamine, kinins, prostaglandins) → smooth muscle contraction, mucus hypersecretion, increased capillary permeability → airway narrowing.',manifestations:'Dyspnoea, wheezing, coughing, tachypnoea, chest tightness.',comparisons:'Reversible and episodic; COPD is progressive and irreversible.',types:'Allergic, exercise-induced, nocturnal, occupational asthma.',risk:'Allergens, exercise, cold air, stress, smoke, occupational agents.',diagnosis:'Spirometry (FEV1/FVC ratio), peak expiratory flow, methacholine challenge, chest X-ray.',treatment:'High Fowler\'s position, oxygen, nebulised bronchodilators, inhaled/oral steroids, anti-leukotrienes, mast cell stabilisers.',drugs:'Short-acting β2-agonists (salbutamol), long-acting β2-agonists (salmeterol), inhaled corticosteroids (fluticasone), anti-leukotrienes (montelukast), cromoglicate.'}},
   {name:'COPD (Chronic Obstructive Pulmonary Disease)',fields:{definition:'Progressive irreversible obstruction encompassing chronic bronchitis and/or emphysema.',mechanism:'Tobacco smoke → epithelial inflammation → cytokines → bronchial irritation (chronic bronchitis) and elastic tissue destruction (emphysema). Emphysema: proteases destroy elastic fibres → alveolar over-inflation, loss of elastic recoil.',manifestations:'Chronic bronchitis ("blue bloater"): cyanosis, productive cough ≥3 months for ≥2 years, oedema. Emphysema ("pink puffer"): severe dyspnoea, barrel chest, hyperinflation, pursed-lip breathing.',comparisons:'Asthma: reversible, episodic. COPD: progressive, irreversible. Blue bloater (bronchitis) vs pink puffer (emphysema).',types:'Chronic bronchitis, emphysema.',risk:'Smoking (main cause), air pollution, alpha-1 antitrypsin deficiency.',diagnosis:'Spirometry (FEV1/FVC <0.70), peak expiratory flow, chest X-ray, CT, pulse oximetry, ABG.',treatment:'Smoking cessation, bronchodilators, inhaled steroids, pulmonary rehabilitation, influenza vaccination, long-term oxygen.',drugs:'Short/long-acting β2-agonists, inhaled corticosteroids, anticholinergics (ipratropium).'}},
   {name:'Cystic Fibrosis (CF)',fields:{definition:'Defective CFTR chloride transport causing thick mucus and chronic lung infections.',mechanism:'CFTR gene defect on chromosome 7 → defective chloride secretion → dehydrated viscous mucus → mucus plugs → chronic bacterial infection and inflammation.',manifestations:'Barrel chest, digital clubbing, haemoptysis, pancreatic insufficiency, fatty stools, meconium ileus, recurrent chest infections.',comparisons:'CF affects multiple organs (lungs, pancreas, GI tract); asthma and COPD primarily affect airways.',types:'CF with class I–VI CFTR mutations.',risk:'Autosomal recessive CFTR mutation.',diagnosis:'Sweat test (elevated chloride), genetic testing, spirometry.',treatment:'Aerosolised DNAse, antibiotics, chest physiotherapy, nutritional support, lung transplantation.',drugs:'Dornase alfa (aerosolised DNAse), antibiotics, CFTR modulators (ivacaftor, lumacaftor).'}}
  ],
  flash:[['FEV1/FVC in obstruction','Decreased below 0.70 in COPD'],['Blue bloater','Chronic bronchitis — cyanosis, productive cough, oedema'],['Pink puffer','Emphysema — severe dyspnoea, barrel chest, hyperinflation'],['Asthma trigger cell','Mast cell releases histamine, kinins, prostaglandins'],['Cystic fibrosis gene defect','CFTR mutation — chromosome 7'],['CF diagnostic test','Sweat test — elevated chloride'],['COPD main cause','Cigarette smoking']]},

 {category:'Respiratory', id:'rsp_rld', name:'Restrictive Lung Disorders & ARDS', tags:['restrictive','ards','fibrosis','pneumoconiosis'], summary:'Restrictive disorders limit lung expansion and reduce FVC. ARDS is an acute life-threatening form of restrictive failure.',
  pathologies:[
   {name:'Restrictive Lung Disease',fields:{definition:'Decreased lung compliance and increased work of breathing — difficulty expanding the thorax during inhalation. FEV1 and FVC both decreased; FEV1/FVC ratio is normal or above normal.',mechanism:'Lung tissue or chest wall stiffening reduces compliance and tidal volume. Causes: intrinsic lung disease (asbestosis, pneumoconiosis, pulmonary fibrosis), chest wall conditions (kyphosis, scoliosis), neuromuscular disease.',manifestations:'Dyspnoea, reduced exercise tolerance, reduced FVC.',comparisons:'Obstructive: FEV1/FVC decreased, difficulty expiring. Restrictive: FVC decreased, FEV1/FVC normal or raised, difficulty inspiring.',types:'Intrinsic: pneumoconiosis, asbestosis, pulmonary fibrosis. Extrinsic: kyphosis, scoliosis, obesity hypoventilation. Neuromuscular: poliomyelitis, muscular dystrophy.',risk:'Occupational inhalation of dusts (coal, silica, asbestos), systemic autoimmune disease, chest wall deformity.',diagnosis:'Spirometry (reduced FVC, normal FEV1/FVC), CT, occupational history, lung biopsy.',treatment:'Treat underlying cause, oxygen therapy, pulmonary rehabilitation.',drugs:'Corticosteroids (inflammatory causes); no drug reverses established fibrosis.'}},
   {name:'ARDS (Acute Respiratory Distress Syndrome)',fields:{definition:'Life-threatening acute lung inflammation with diffuse alveolar-capillary injury.',mechanism:'3 stages: (1) Exudative (days 1–7): inflammation → oedema, microvascular thrombi, surfactant loss, cell destruction. (2) Proliferative (days 7–21): fibroblast activation → collagen deposition, cellular regeneration. (3) Fibrotic (>21 days): interstitial fibrin deposits → reduced compliance.',manifestations:'Dyspnoea, rapid shallow breathing, inspiratory crackles, respiratory alkalosis, hypoxaemia, cyanosis, diffuse bilateral alveolar infiltrates on X-ray.',comparisons:'ARDS is an acute severe restrictive condition; pneumoconiosis and fibrosis are chronic.',types:'Pulmonary ARDS (direct), extra-pulmonary ARDS (indirect).',risk:'Sepsis, pneumonia, trauma, aspiration, blood transfusion reactions, pancreatitis, burns.',diagnosis:'ABG, chest X-ray (bilateral infiltrates), CT scan, physical examination.',treatment:'PEEP ventilation, mechanical ventilation, supplemental oxygen, sedation, prone positioning, fluid support, inotropes, corticosteroids.',drugs:'Corticosteroids, inotropes (dobutamine), supplemental oxygen.'}}
  ],
  flash:[['FEV1/FVC in restriction','Normal or above normal (FVC is reduced)'],['ARDS exudative stage','Days 1–7: oedema, surfactant loss, alveolar cell destruction'],['ARDS proliferative stage','Days 7–21: fibroblast activation, collagen deposition'],['ARDS fibrotic stage','>21 days: fibrin deposits, reduced compliance'],['PEEP in ARDS','Positive end-expiratory pressure — keeps alveoli open'],['Prone positioning in ARDS','Improves ventilation-perfusion matching'],['Restrictive spirometry','FVC decreased; FEV1/FVC normal or raised']]},

 {category:'Respiratory', id:'rsp_failure', name:'Respiratory Failure & Assessment', tags:['respiratory failure','hypoxia','hypercapnia','spirometry','assessment'], summary:'Respiratory failure occurs when the lungs cannot maintain adequate gas exchange.',
  pathologies:[{name:'',fields:{definition:'Respiratory failure: lungs cannot get enough oxygen into the blood. Normal SpO₂ is 95–99%. Hypoxaemia: reduced oxygen in arterial blood. Hypoxia: lack of oxygen at tissue level. Hypercapnia: CO₂ accumulation causing respiratory acidosis.',mechanism:'Type I (hypoxaemic): hypoxaemia with normal or low CO₂ — V/Q mismatch, diffusion impairment, or shunt. Type II (hypercapnic): hypoxaemia with elevated CO₂ — reduced respiratory drive, airway obstruction, or chest wall disease.',manifestations:'Shortness of breath, extreme tiredness, inability to exercise, sleepiness, confusion, central cyanosis, tachypnoea, accessory muscle use. Chronic failure: cor pulmonale.',comparisons:'Acute failure: rapid onset, often reversible. Chronic failure: gradual, managed long-term. Type I: oxygenation failure. Type II: ventilatory failure.',types:'Type I (hypoxaemic), Type II (hypercapnic/ventilatory), acute, chronic.',risk:'Pneumonia, opioid overdose, stroke, spinal cord injury, severe asthma/COPD exacerbation, ARDS, trauma, neuromuscular disease.',diagnosis:'Pulse oximetry (SpO₂), ABG (PaO₂, PaCO₂, pH), spirometry (FEV1, FVC, FEV1/FVC), chest X-ray, CT, peak expiratory flow.',treatment:'Supplemental oxygen (controlled in Type II), non-invasive ventilation (CPAP/BiPAP), mechanical ventilation for severe cases, treat underlying cause, bronchodilators, physiotherapy.',drugs:'Supplemental oxygen, β2-agonists, anticholinergics, corticosteroids, naloxone (opioid overdose reversal), diuretics for cor pulmonale.'}}],
  flash:[['Normal SpO₂ range','95–99%'],['Hypoxaemia','Reduced oxygen in arterial blood'],['Hypoxia','Insufficient oxygen at tissue level'],['Hypercapnia consequence','Respiratory acidosis'],['Type I respiratory failure','Hypoxaemia with normal/low CO₂ — oxygenation failure'],['Type II respiratory failure','Hypoxaemia with elevated CO₂ — ventilatory failure'],['Central cyanosis','Sign of hypoxaemia — bluish discolouration of lips and tongue'],['Cor pulmonale','Right heart failure from chronic pulmonary hypertension']]},
