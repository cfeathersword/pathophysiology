 {category:'GI', id:'gi_upper', name:'GORD, PUD & Helicobacter pylori', tags:['gord','pud','peptic ulcer','helicobacter','reflux'], summary:'GORD results from lower oesophageal sphincter dysfunction; PUD involves mucosal erosion caused by H. pylori, NSAIDs, and acid hypersecretion.',
  pathologies:[
   {name:'GORD (Gastro-Oesophageal Reflux Disease)',fields:{definition:'Involuntary reflux of gastric juice into the oesophagus that impairs quality of life, caused by dysfunction of the lower oesophageal sphincter (LOS). NERD (non-erosive reflux disease): reflux without mucosal damage.',mechanism:'LOS loses tone → gastric acid refluxes → mucosal injury. Factors preventing reflux: gravity, LOS pressure, oesophagogastric junction anatomy, diaphragm contraction, gastric emptying. Causes: delayed gastric emptying, pro-inflammatory cytokines, increased intra-abdominal pressure (obesity, pregnancy, poor posture, smoking).',manifestations:'Heartburn, regurgitation, epigastric/chest pain, nausea, haematemesis, flatulence, chronic cough, hoarseness. Complications: oesophagitis, Barrett\'s oesophagus (pre-cancerous columnar metaplasia), oesophageal adenocarcinoma, aspiration pneumonia.',comparisons:'Barrett\'s oesophagus is a pre-cancerous complication. GORD vs NERD: NERD has no mucosal damage.',types:'GORD, NERD, Barrett\'s oesophagus, oesophageal adenocarcinoma.',risk:'Obesity, poor posture, smoking, large/acidic meals, pregnancy, delayed gastric emptying.',diagnosis:'Symptomatology, gastroscopy/OGD, capsular endoscopy, oesophageal manometry.',treatment:'Lifestyle modification (smaller meals, avoid acidic foods), antacids, H2 receptor antagonists; severe → fundoplication surgery.',drugs:'Proton pump inhibitors (omeprazole), H2 receptor antagonists (ranitidine), antacids, prokinetics.'}},
   {name:'PUD (Peptic Ulcer Disease) & H. pylori',fields:{definition:'Mucosal erosive injury >5 mm in depth in the stomach or duodenum, exposing smooth muscle, blood vessels, and nerves.',mechanism:'(1) Breakdown of protective mucosal barrier (H. pylori, NSAIDs, alcohol, tobacco). (2) Excessive chronic acid/pepsin exposure. H. pylori: secretes urease to alkalinise environment, promotes cytokines, reduces mucosal thickness, induces gastrin → HCl release, inhibits somatostatin.',manifestations:'Dyspepsia, diarrhoea, vomiting, anorexia, haematemesis, abdominal/chest pain, weight loss.',comparisons:'~80% of gastric ulcer patients have H. pylori; ~95% of duodenal ulcer patients have H. pylori. H. pylori found in 50% of population but only 5–10% develop ulcers.',types:'Gastric ulcer, duodenal ulcer.',risk:'H. pylori infection, NSAID use, high salt diet, smoking, alcohol, Zollinger-Ellison syndrome.',diagnosis:'Endoscopy (gold standard), rapid urease test, H. pylori culture, haematology/biochemistry.',treatment:'H. pylori eradication (triple therapy), cease NSAIDs and smoking, acid reduction (H2 antagonists or PPIs), mucosal coating (bismuth or prostaglandin E2 analogue), control blood loss.',drugs:'PPIs (omeprazole), H2 receptor antagonists (ranitidine), clarithromycin + amoxicillin + metronidazole (triple therapy), bismuth, prostaglandin E2 analogues.'}}
  ],
  flash:[['Key GORD mechanism','Lower oesophageal sphincter (LOS) dysfunction'],['Barrett\'s oesophagus','Pre-cancerous metaplasia — columnar cells replace squamous cells'],['H. pylori survival trick','Secretes urease to create alkaline microenvironment'],['PUD gold standard diagnosis','Endoscopy and lesion visualisation'],['GORD severe treatment','Fundoplication surgery to strengthen LOS'],['H. pylori in duodenal ulcers','~95% of patients']]},

 {category:'GI', id:'gi_immune', name:'Coeliac Disease, Crohn\'s Disease & Diarrhoeas', tags:['coeliac','crohns','diarrhoea','IBD','gluten'], summary:'Coeliac disease is a gluten-triggered autoimmune enteropathy; Crohn\'s is a transmural inflammatory bowel disease.',
  pathologies:[
   {name:'Coeliac Disease',fields:{definition:'Aberrant autoimmune response to gluten causing malabsorption; predominantly affects Caucasians and Indians; associated with HLA-DQ2 or HLA-DQ8.',mechanism:'Gluten partially digested → gliadin → crosses permeable mucosa → cross-links with tissue transglutaminase → detected as antigenic → CD4 T cell activation → anti-transglutaminase IgG antibodies → mucosal villi become blunt/flattened → malabsorption.',manifestations:'Chronic diarrhoea, weight loss, failure to thrive, abdominal pain/distension, vomiting, glossitis, malnutrition, electrolyte imbalance.',comparisons:'Coeliac is a diet-triggered autoimmune condition; Crohn\'s is an idiopathic inflammatory bowel disease.',types:'Coeliac disease (gluten-sensitivity enteropathy).',risk:'HLA-DQ2/DQ8 genetics; Caucasian/Indian heritage; triggered by rotavirus (children) or Campylobacter (adults).',diagnosis:'Elevated serum IgA, anti-transglutaminase antibodies, tissue biopsy (villous atrophy), HLA typing.',treatment:'Gluten-free diet (avoid wheat, rye, barley, oats), micronutrient supplementation, osteoporosis assessment; severe → corticosteroids, total parenteral nutrition.',drugs:'Corticosteroids (severe cases), nutritional supplements.'}},
   {name:'Crohn\'s Disease',fields:{definition:'Chronic transmural inflammation of any part of the GI tract, most commonly the ileum; also known as regional ileitis.',mechanism:'Unknown cause; imbalance between pro-inflammatory and immunoregulatory factors; autoimmune loss of tolerance to GI bacteria; transmural inflammation (all 4 layers); skip lesions; ulceration → fissures → cobblestone appearance → perforation/fistula/abscess.',manifestations:'Malaise, lethargy, anorexia, diarrhoea, abscesses, fistulas, bowel obstruction; extra-intestinal manifestations (skin, liver, joints, mouth); lifelong with remissions and relapses; increased risk of colon cancer.',comparisons:'Crohn\'s: transmural, skip lesions, any GI segment, more common in smokers. UC: superficial (mucosa only), continuous from anorectal margin, colon only, more common in non-/ex-smokers.',types:'Crohn\'s disease; Ulcerative colitis (comparison).',risk:'~0.1% of Australians; onset mostly before 25; ~20% have first-degree relative affected; defects in innate immunity.',diagnosis:'X-ray with barium meal, colonoscopy, MRI/CT, biopsy, blood tests (anaemia, leucocytosis), raised CRP and ESR.',treatment:'Sulphasalazine or mesalazine, immunosuppressants, corticosteroids, antibiotics, antidiarrhoeals, antispasmodics, high-fibre diet; surgery for complications.',drugs:'Corticosteroids, sulphasalazine, mesalazine, azathioprine, methotrexate, anti-TNF biologics.'}},
   {name:'Diarrhoeas',fields:{definition:'Frequent, loose or watery stools. Categories: acute (1 to several days), chronic (>4 weeks), episodic.',mechanism:'Four mechanisms: (1) Osmotic — osmotically active substances draw water into lumen. (2) Secretory — ↑ water/↓ salt into bowel (rotavirus, E. coli). (3) Exudative/inflammatory — disruption of intestinal epithelium (E. coli, Shigella, Giardia). (4) Motility disturbances.',manifestations:'Dehydration, electrolyte imbalance, nausea, vomiting, abdominal pain.',comparisons:'Acute causes: food poisoning, gastroenteritis, anxiety, alcohol, antibiotics, infection. Chronic causes: IBD, coeliac, IBS, hormone disorders, bowel cancer, lactose intolerance.',types:'Acute infectious (viral: rotavirus, adenovirus; bacterial: E. coli, Campylobacter, Vibrio cholerae, Shigella, Salmonella; parasitic: Giardia, Cryptosporidium); chronic diarrhoea.',risk:'Food poisoning, travel, immunocompromise, antibiotic use, anxiety.',diagnosis:'Stool culture, blood tests, colonoscopy if chronic.',treatment:'Fluid support, electrolyte replacement, antiemetics, antispasmodics; antidiarrhoeals with caution; vaccination.',drugs:'Oral rehydration solutions, antispasmodics, antidiarrhoeals (with caution), antibiotics for bacterial causes.'}}
  ],
  flash:[['Coeliac trigger','Gliadin fragment from partially digested gluten'],['Coeliac HLA association','HLA-DQ2 or HLA-DQ8'],['Crohn\'s histology finding','Cobblestone appearance from ulceration and fissures'],['Crohn\'s depth','Transmural — all 4 layers of intestinal wall'],['Crohn\'s vs UC','Crohn\'s: skip lesions, any GI segment; UC: colon only, continuous'],['Safe foods in coeliac','Corn, millet, sorghum, rice, quinoa'],['Diarrhoea 4 mechanisms','Osmotic, secretory, exudative, motility disturbances']]},

 {category:'GI', id:'gi_liver', name:'Hepatitis B, Cirrhosis & Hepatocellular Carcinoma', tags:['hepatitis','cirrhosis','liver cancer','HBV','jaundice'], summary:'HBV is a DNA virus causing liver inflammation that can progress to cirrhosis and hepatocellular carcinoma.',
  pathologies:[
   {name:'Hepatitis B (HBV)',fields:{definition:'DNA virus with 6–24 week incubation, transmitted via body fluids.',mechanism:'HBV → hepatocyte damage via immune-mediated response → liver inflammation. 90–98% of adults eliminate the virus; 2–10% progress to chronic infection → ongoing hepatocyte destruction → fibrosis → cirrhosis.',manifestations:'Acute: fever, anorexia, vomiting, abdominal pain, joint pain, dark urine, jaundice, steatorrhoea; 2–10% asymptomatic.',comparisons:'HBV (DNA, vaccine available, 6–24 week incubation) vs HCV (RNA, no vaccine, >70% chronicity) vs HAV (RNA, faecal-oral, 14–28 days, no chronic infection, vaccine available).',types:'Acute, chronic, fulminant HBV.',risk:'Sexual contact, vertical (birth) transmission, injecting drug use, sharing razors/toothbrushes, medical/dental procedures.',diagnosis:'HBsAg or anti-HBV antibodies, elevated ALT/AST, low albumin.',treatment:'Interferon-alpha (IFN-α) for chronic infection; recombinant HBsAg vaccine (Engerix-B, Recombivax-HB).',drugs:'Interferon-alpha, antivirals (tenofovir, entecavir for chronic HBV), HBV vaccine.'}},
   {name:'Cirrhosis',fields:{definition:'Extensive liver scarring disrupting organised tissue framework and blood/bile flow; regeneration produces non-functional hepatocyte nodules.',mechanism:'Chronic injury (alcohol, viral hepatitis, fatty liver disease) → ongoing hepatocyte destruction → fibrosis → cirrhosis. Regenerating hepatocytes undergo high mitotic activity → scope for oncogenic mutations → HCC.',manifestations:'Fatigue, bleeding/bruising, anorexia, nausea, oedema, weight loss, itchy skin, jaundice, ascites, spider angiomas, palmar erythema, gynaecomastia (men), confusion. Complications: portal hypertension, splenomegaly, hepatic encephalopathy, bacterial peritonitis, bone disease, HCC.',comparisons:'Compensated cirrhosis: few symptoms. Decompensated cirrhosis: ascites, encephalopathy, variceal bleeding.',types:'Alcohol-induced, viral hepatitis-induced, fatty liver-induced.',risk:'Alcohol abuse, viral hepatitis, fatty liver disease.',diagnosis:'Liver function tests, ultrasound/CT/MRI, liver biopsy.',treatment:'Address cause (stop alcohol, antivirals), stop smoking, reduce salt, increase protein, diuretics, medicines for confusion/bleeding/ascites, 6-monthly monitoring, liver transplant for end-stage.',drugs:'Diuretics (spironolactone, furosemide), beta-blockers (portal hypertension), lactulose (hepatic encephalopathy), nutritional supplements, antivirals.'}},
   {name:'Hepatocellular Carcinoma (HCC)',fields:{definition:'Primary liver cancer developing in chronic liver disease; cirrhosis is the predisposing factor in ~80%.',mechanism:'Regenerating hepatocytes undergo high mitotic activity → scope for oncogenic mutations → HCC. Malignant cells produce alpha-fetoprotein (AFP) — normally only synthesised in foetal liver.',manifestations:'Often asymptomatic until advanced; right upper quadrant pain, jaundice, ascites, weight loss.',comparisons:'Primary HCC from cirrhosis vs secondary liver metastases from lung, breast, colon cancer.',types:'Primary HCC, secondary (metastatic) liver cancer.',risk:'Cirrhosis (~80%), chronic hepatitis B/C, alcoholic liver disease.',diagnosis:'Elevated AFP, 6-monthly liver ultrasound, CT/MRI, biopsy.',treatment:'Surgical resection, ablation, TACE (transarterial chemoembolisation), liver transplant, targeted therapy.',drugs:'Sorafenib (targeted therapy), chemotherapy for unresectable disease.'}}
  ],
  flash:[['HBV type','DNA virus with 6–24 week incubation'],['HBV diagnostic marker','Hepatitis B surface antigen (HBsAg)'],['Cirrhosis pathology','Extensive liver scarring — nodule formation replaces functional tissue'],['Cirrhosis sign — abdomen','Ascites (fluid accumulation in abdomen)'],['Alpha-fetoprotein','Tumour marker for hepatocellular carcinoma'],['HBV vaccination','Available since 1986 — Engerix-B, Recombivax-HB'],['Hepatic encephalopathy','Brain dysfunction from inability to clear toxins in cirrhosis']]},

 {category:'GI', id:'gi_pancreas', name:'Pancreatitis, Cholecystitis & Gallstones', tags:['pancreatitis','gallstones','cholecystitis','cholelithiasis','pancreas'], summary:'Acute pancreatitis involves autodigestion from trapped enzymes; cholecystitis is gallbladder inflammation usually from gallstones.',
  pathologies:[
   {name:'Pancreatitis',fields:{definition:'Acute pancreatitis: obstruction blocks the pancreatic duct; enzymes back up, activate within the pancreas, and cause autodigestion. Chronic pancreatitis: ongoing inflammation → irreversible fibrosis and calcification, destroying islets of Langerhans.',mechanism:'Acute: obstruction (gallstones, alcohol) → blocked pancreatic duct → enzyme activation within pancreas → autodigestion → haemorrhage, oedema, necrosis. Chronic: repeated insults → fibrosis, calcification, ductal obstruction, beta-cell damage → deranged glucose homeostasis.',manifestations:'Acute: epigastric pain radiating to back, pyrexia, nausea, vomiting, abdominal distension, raised blood sugar, malabsorption, tachycardia, hypotension. Chronic: severe pain, weight loss, steatorrhoea, type 1 diabetes.',comparisons:'Acute pancreatitis: reversible but potentially fatal; elevated serum amylase and lipase. Chronic: irreversible fibrosis and calcification.',types:'Acute pancreatitis, chronic pancreatitis.',risk:'Gallstones (most common), alcohol, trauma, drugs. Chronic: alcohol abuse most common.',diagnosis:'Elevated serum amylase and lipase, raised blood glucose, CT/MRI/ultrasound.',treatment:'Acute: nil by mouth, IV fluid support, antiemetics, analgesia, monitor blood sugar. Chronic: analgesia, insulin, low-fat diet, endoscopic duct decompression.',drugs:'Antiemetics, analgesics, insulin, pancreatic enzyme replacement.'}},
   {name:'Cholecystitis & Gallstones (Cholelithiasis)',fields:{definition:'Cholecystitis: gallbladder inflammation, usually from gallstones (cholelithiasis) blocking bile drainage. Cholelithiasis: gallstones forming when cholesterol in bile becomes over-concentrated and precipitates.',mechanism:'Bile concentration → supersaturation of cholesterol/calcium → crystallisation → choleliths → obstruction. Gallstones blocking the common bile duct and pancreatic duct → acute pancreatitis.',manifestations:'Biliary colic, tachycardia, fat intolerance, nausea, vomiting, diaphoresis (Collin\'s sign).',comparisons:'Acute cholecystitis: sudden onset. Chronic cholecystitis: long-term, often from repeated acute episodes.',types:'Cholesterol gallstones, pigment gallstones; acute and chronic cholecystitis.',risk:'Female sex, age >40, obesity, pregnancy, rapid weight loss, high-fat diet, diabetes, family history.',diagnosis:'Ultrasound (first-line), CT, ERCP, liver function tests.',treatment:'Analgesia, low-fat diet, fluids, antiemetics, cholecystectomy, oral dissolution therapy, extracorporeal shock wave lithotripsy (ESWL).',drugs:'Ursodeoxycholic acid (oral dissolution of gallstones), antibiotics, analgesics, IV fluids.'}}
  ],
  flash:[['Acute pancreatitis cause','Gallstones or alcohol → blocked duct → enzyme autodigestion'],['Elevated in acute pancreatitis','Serum amylase and lipase'],['Chronic pancreatitis complication','Fibrosis destroys islets of Langerhans → diabetes'],['Cholecystitis definition','Inflammation of the gallbladder'],['Gallstone formation','Cholesterol supersaturation in bile → crystallisation'],['Gallstone + pancreatic duct obstruction','Causes acute pancreatitis'],['Gallstone treatment options','Cholecystectomy, ESWL, or oral dissolution therapy']]},

 {category:'Endocrine', id:'pituitary', name:'Pituitary Dysfunction: Acromegaly & Dwarfism', tags:['acromegaly','dwarfism','growth hormone','pituitary','GH'], summary:'GH excess causes acromegaly or gigantism; GH deficiency causes pituitary dwarfism.',
  pathologies:[
   {name:'Acromegaly & Gigantism',fields:{definition:'Acromegaly: GH overproduction after bone maturity, most commonly from a benign pituitary macroadenoma. Gigantism: GH excess before bone maturity causing proportionate tall stature.',mechanism:'Slow-growing pituitary macroadenoma → excess GH → disproportionate connective tissue and skeletal growth in adults. In children, excess GH before bone maturity causes proportionate gigantism.',manifestations:'Acromegaly: enlarged hands/feet, protruding jaw, enlarged tongue, thickened skin, cardiac enlargement, excess sweating, insulin resistance, hyperglycaemia.',comparisons:'Gigantism (pre-maturity): proportionate; Acromegaly (post-maturity): disproportionate facial/peripheral growth.',types:'Gigantism (pre-bone maturity), acromegaly (post-bone maturity).',risk:'Benign pituitary macroadenoma; rare — ~50 per million.',diagnosis:'Pituitary hormone levels; GH remains elevated after oral glucose tolerance test (normally glucose suppresses GH); MRI/CT for pituitary tumour.',treatment:'Transsphenoidal surgical removal; radiation therapy if GH remains high; somatostatin analogue to suppress GH.',drugs:'Somatostatin analogues (suppress GH).'}},
   {name:'Pituitary Dwarfism',fields:{definition:'GH hyposecretion causing growth failure; affects 1 in 25,000.',mechanism:'Primary: abnormal foetal pituitary development or traumatic brain injury. Secondary: anterior pituitary fails to respond to hypothalamic signals.',manifestations:'Stunted musculoskeletal growth, delayed teeth maturation, delayed puberty, hypoglycaemic episodes.',comparisons:'Dwarfism (GH deficiency) causes hypoglycaemia and stunted growth; acromegaly (excess) causes hyperglycaemia and disproportionate growth.',types:'Pituitary dwarfism.',risk:'Improper foetal pituitary development, traumatic brain injury, inability of anterior pituitary to respond to hypothalamic products.',diagnosis:'Careful history; exclude GI disorders and malnutrition; blood hormone levels (GH, TSH, LH, FSH).',treatment:'GH replacement therapy; synthetic GH analogues.',drugs:'Synthetic GH analogues (replacement therapy).'}}
  ],
  flash:[['Acromegaly cause','Benign pituitary macroadenoma → GH excess after bone maturity'],['Gigantism vs Acromegaly','Gigantism = GH excess in children; Acromegaly = GH excess in adults'],['Acromegaly metabolic effect','Insulin resistance and hyperglycaemia'],['Dwarfism glucose finding','Hypoglycaemia (opposite of acromegaly)'],['GH suppression test','Normally glucose suppresses GH — in acromegaly it does not'],['Dwarfism management','Synthetic GH analogue replacement therapy']]},

 {category:'Endocrine', id:'thyroid', name:'Thyroid Dysfunction: Hyperthyroidism, Hypothyroidism & Hashimoto\'s', tags:['thyroid','hyperthyroidism','hypothyroidism','graves','hashimoto','T3','T4','TSH'], summary:'Thyroid excess causes hyperthyroidism (Graves\'); deficiency causes hypothyroidism; Hashimoto\'s is autoimmune thyroid destruction.',
  pathologies:[
   {name:'Hyperthyroidism (Graves\' Disease)',fields:{definition:'Excess thyroid hormone (T3/T4) — most commonly from Graves\' disease (autoimmune).',mechanism:'Graves\': autoantibodies bind and activate TSH receptors on follicular cells → continuous T3/T4 overproduction → TSH falls via negative feedback.',manifestations:'Tachycardia, palpitations, muscle weakness, fatigue, increased GI motility, heat intolerance, weight loss, increased appetite, nervousness, hyperreflexia, insomnia, menstrual irregularities. Graves\' specific: exophthalmos (bulging eyes), goitre.',comparisons:'Hyperthyroidism: HIGH T3/T4, LOW TSH, heat intolerance, tachycardia, weight loss.',types:'Graves\' disease (most common), pituitary tumour, thyroid tumour, iodine-containing medications, thyroid storm.',risk:'Female sex, familial inheritance, possible Yersinia enterocolitica link (TSH receptor mimicry).',diagnosis:'Thyroid function test (HIGH T3/T4 + LOW TSH), TSH-receptor autoantibodies, thyroid scan/CT/MRI/ultrasound.',treatment:'Antithyroid drugs (propylthiouracil, carbimazole); radioactive iodine (I-131); surgery (rare).',drugs:'Propylthiouracil, carbimazole, radioactive iodine (I-123, I-131).'}},
   {name:'Hypothyroidism & Myxoedema',fields:{definition:'Deficient thyroid hormone. Severe acquired form = myxoedema.',mechanism:'Primary: deficient TH production (abnormal development, autoimmune attack, iodine deficiency, post-treatment). Secondary: pituitary/hypothalamus failure → inadequate TSH. Myxoedema: mucopolysaccharide accumulation in tissue → thick gel-like non-pitting oedema.',manifestations:'Weight gain, lethargy, slow mental function, hyporeflexia, cold intolerance, bradycardia, constipation, loss of appetite. Myxoedema: thickened skin/tongue, periorbital puffiness, dry coarse skin, brittle hair, menstrual dysfunction, infertility.',comparisons:'Hypothyroidism: LOW T3/T4, HIGH TSH (primary) or LOW TSH (secondary), cold intolerance, bradycardia, weight gain.',types:'Congenital/neonatal, acquired (myxoedema), primary, secondary hypothyroidism.',risk:'Iodine deficiency, post-treatment tissue loss, autoimmune (Hashimoto\'s).',diagnosis:'LOW free T4 / LOW T3/T4, HIGH TSH (primary), antithyroid antibodies, low radioiodine uptake.',treatment:'Levothyroxine (thyroid hormone replacement), start low dose and increase; myxoedema coma = intensive care emergency.',drugs:'Levothyroxine.'}},
   {name:'Hashimoto\'s Thyroiditis',fields:{definition:'Chronic lymphocytic thyroiditis — autoimmune destruction of thyroid tissue causing hypothyroidism.',mechanism:'Autoantibodies vs thyroid peroxidase, thyroglobulin, and TSH receptors → T lymphocyte infiltration and fibrosis → tissue destruction.',manifestations:'Gradual onset hypothyroidism, goitre.',comparisons:'Graves\' disease overactivates thyroid; Hashimoto\'s destroys thyroid tissue. Both are autoimmune but have opposite hormonal effects.',types:'Hashimoto\'s thyroiditis (chronic lymphocytic thyroiditis).',risk:'Genetic predisposition (HLA-DR5, CTLA-4), high iodine intake, selenium deficiency, certain drugs, infections.',diagnosis:'Elevated TPO antibodies, anti-thyroglobulin antibodies, low thyroid function tests.',treatment:'Levothyroxine replacement.',drugs:'Levothyroxine.'}}
  ],
  flash:[['Graves\' disease mechanism','Autoantibodies activate TSH receptors → continuous T3/T4 overproduction'],['Exophthalmos','Bulging eyes — characteristic of Graves\' disease'],['Hyperthyroidism TFT result','HIGH T3/T4, LOW TSH'],['Hypothyroidism TFT result (primary)','LOW T3/T4, HIGH TSH'],['Myxoedema','Non-pitting oedema from mucopolysaccharide accumulation — severe hypothyroidism'],['Hashimoto\'s cell type','T lymphocyte infiltration destroying thyroid tissue'],['Thyroid storm','Life-threatening extreme hyperthyroidism'],['Hypothyroidism treatment','Levothyroxine — start at low dose and gradually increase']]},

 {category:'Endocrine', id:'parathyroid', name:'Hypoparathyroidism', tags:['parathyroid','PTH','hypocalcaemia','calcium','tetany'], summary:'Low or absent PTH causes hypocalcaemia, increasing neuromuscular excitability.',
  pathologies:[{name:'',fields:{definition:'Hypoparathyroidism: low or absent parathyroid hormone (PTH) leading to hypocalcaemia and increased neuromuscular excitability.',mechanism:'PTH regulates calcium. Without PTH: osteoclast activity falls → hypocalcaemia → increased nerve and muscle excitability. Magnesium is essential for PTH receptor activation — hypomagnesaemia can trigger hypoparathyroidism. Most common iatrogenic cause: accidental parathyroid removal during thyroidectomy.',manifestations:'Muscle spasms, twitching, and tetany; paraesthesia; fatigue; mood changes; cardiac arrhythmia.',comparisons:'Hypocalcaemia increases neuromuscular excitability (spasms, tetany). Hypercalcaemia (seen in Cushing\'s) causes kidney stones and bone loss.',types:'Iatrogenic (post-thyroidectomy), autoimmune, hypomagnesaemia-induced.',risk:'Thyroidectomy (most common); autoimmune disease; renal disease, alcoholism, malnutrition (via hypomagnesaemia).',diagnosis:'Low serum calcium; increased bone density in specific regions on X-ray; low serum magnesium.',treatment:'High-calcium diet, oral calcium gluconate, vitamin D supplementation, IV synthetic PTH therapy (rare).',drugs:'Calcium gluconate (oral or IV), vitamin D analogues (calcitriol), magnesium supplements, IV synthetic PTH (teriparatide) in refractory cases.'}}],
  flash:[['Hypoparathyroidism key consequence','Hypocalcaemia → increased neuromuscular excitability'],['Tetany','Involuntary muscle spasms from hypocalcaemia'],['Most common cause','Inadvertent parathyroid removal during thyroidectomy'],['Magnesium role','Essential for PTH receptor activation'],['Treatment goal','Normalise serum calcium']]},

 {category:'Endocrine', id:'adrenal', name:'Adrenal Dysfunction: Cushing\'s, Addison\'s & Pheochromocytoma', tags:['cushing','addison','pheochromocytoma','adrenal','cortisol','aldosterone','catecholamine'], summary:'Adrenal disorders include Cushing\'s (cortisol excess), Addison\'s (adrenal insufficiency), and pheochromocytoma (catecholamine excess).',
  pathologies:[
   {name:'Cushing\'s Disease / Syndrome',fields:{definition:'Cushing\'s disease: excessive cortisol from pituitary or adrenal tumour. Cushing\'s syndrome: cortisol excess from prolonged glucocorticoid drug therapy.',mechanism:'Tumour in pituitary/adrenal cortex → excess ACTH or cortisol → metabolic, immune, and skeletal effects.',manifestations:'Moon face, central obesity, weight gain (Na/water retention), hypertension, insulin resistance → diabetes, hypercalcaemia → kidney stones, osteoporosis, T-cell immunosuppression.',comparisons:'Cushing\'s = cortisol EXCESS: moon face, obesity, hypertension, hyperglycaemia, HIGH urinary cortisol. Cushing\'s Syndrome (drug-induced) vs Cushing\'s Disease (tumour-driven).',types:'Cushing\'s disease (tumour), Cushing\'s syndrome (iatrogenic).',risk:'Pituitary or adrenal tumour; prolonged glucocorticoid therapy.',diagnosis:'High 24-hour urinary free cortisol; pituitary/adrenal imaging.',treatment:'Remove pituitary-dependent tumour or radiation therapy; adrenal steroidogenesis inhibitors.',drugs:'Metyrapone, ketoconazole (adrenal steroidogenesis inhibitors).'}},
   {name:'Addison\'s Disease',fields:{definition:'Primary adrenal insufficiency — deficiency of all corticosteroids (cortisol, aldosterone, androgens).',mechanism:'Most common cause: autoimmune antibodies against 21-beta-hydroxylase → all corticosteroid deficiency → compensatory ACTH rise → hyperpigmentation (ACTH acts like MSH on skin).',manifestations:'Fatigue, anorexia, weight loss, hypoglycaemia, hypotension, muscle weakness, depression, hyponatraemia, hyperkalaemia, sparse body hair, hyperpigmentation of skin (palmar creases, buccal mucosa, lips, nipples).',comparisons:'Addison\'s = cortisol DEFICIENCY: weight loss, hypotension, hypoglycaemia, hyperpigmentation, LOW cortisol.',types:'Primary Addison\'s (autoimmune) vs secondary (ACTH deficiency).',risk:'Autoimmune (most common), inflammation, tumour, congenital malformation, pituitary ACTH deficiency.',diagnosis:'Low serum/urine cortisol, aldosterone, androgens; autoantibodies to 21-beta-hydroxylase.',treatment:'Hormone replacement — intermediate-acting prednisolone or long-acting dexamethasone.',drugs:'Prednisolone, dexamethasone.'}},
   {name:'Pheochromocytoma',fields:{definition:'Catecholamine-secreting tumour of the adrenal medulla (adrenaline and noradrenaline excess).',mechanism:'Medullary neuroendocrine tumour → surges of adrenaline/noradrenaline → sympathetic storm.',manifestations:'5H: Hypertension, Headache, Hyperglycaemia, Hypermetabolism, Hyperhidrosis; also flushing, tremor, anxiety, cardiovascular symptoms.',comparisons:'Pheochromocytoma affects the medulla (catecholamines); Cushing\'s and Addison\'s affect the cortex (corticosteroids).',types:'Pheochromocytoma (adrenal medulla), paraganglioma (extra-adrenal catecholamine-secreting tumour).',risk:'Adrenal medullary tumour; extra-adrenal paraganglioma.',diagnosis:'Elevated urinary free catecholamines and metabolites; CT/MRI scan.',treatment:'Surgical removal of tumour; beta-blockers and vasodilators (alpha-blockers pre-operatively).',drugs:'Beta-blockers, vasodilators (alpha-blockers pre-operatively).'}}
  ],
  flash:[['Cushing\'s disease cause','Pituitary or adrenal cortex tumour → cortisol excess'],['Addison\'s hyperpigmentation','Compensatory ACTH excess mimics MSH'],['Addison\'s electrolytes','Hyponatraemia (low Na) + Hyperkalaemia (high K) — aldosterone deficiency'],['Addison\'s autoimmune target','21-beta-hydroxylase'],['Pheochromocytoma 5H','Hypertension, Headache, Hyperglycaemia, Hypermetabolism, Hyperhidrosis'],['Pheochromocytoma diagnosis','Elevated urinary catecholamines + CT/MRI'],['Cushing\'s diagnosis','High 24-hour urinary free cortisol'],['Adrenal 4S functions','Stress, Sugar, Salt, Sexual development']]},

 {category:'Endocrine', id:'diabetes', name:'Diabetes Mellitus: T1D & T2D', tags:['diabetes','T1D','T2D','insulin','hyperglycaemia','beta cell','DKA'], summary:'Metabolic disorder of insulin secretion and/or action causing hyperglycaemia.',
  pathologies:[
   {name:'Type 1 Diabetes (T1D)',fields:{definition:'Autoimmune destruction of pancreatic beta cells → absolute insulin deficiency (~10% of DM).',mechanism:'Immune-mediated (T cells dominant) destruction of beta cells → hypoinsulinaemia → hyperglycaemia. DKA: cells starved → fat mobilised → ketone bodies → metabolic acidosis.',manifestations:'Polydipsia, polyuria, glycosuria, polyphagia, weight loss. DKA: nausea, vomiting, abdominal pain, fruity breath, Kussmaul breathing, altered consciousness.',comparisons:'T1D: autoimmune, absolute insulin deficiency, autoantibodies PRESENT, peak onset 10–19 years, DKA common.',types:'T1D (immune-mediated).',risk:'HLA genetic predisposition, viral infection triggers, dietary proteins, hormonal stress at puberty.',diagnosis:'2-hour post OGTT ≥8–9 mmol/L; fasting blood glucose ≥6.1 mmol/L; HbA1c ≥8%; autoantibodies (islet cell, anti-GAD).',treatment:'Exogenous insulin replacement (essential), dietary management, exercise, electrolyte and fluid support for DKA.',drugs:'Exogenous insulin (rapid, intermediate, long-acting).'}},
   {name:'Type 2 Diabetes (T2D)',fields:{definition:'Insulin resistance in peripheral tissue with receptor downregulation → compensatory hyperinsulinaemia → eventually beta-cell exhaustion (~90% of DM).',mechanism:'Receptor downregulation on peripheral cells → deranged intracellular signalling → decreased glucose uptake → hyperglycaemia despite high insulin; obesity → excess free fatty acids → gluconeogenesis, insulin resistance, beta-cell impairment.',manifestations:'Often insidious — polydipsia, polyuria, fatigue, recurrent infections, blurred vision. Complications: retinopathy, nephropathy, neuropathy, macrovascular disease.',comparisons:'T2D: insulin resistance, no autoantibodies, associated with obesity/age/inactivity, gradual onset, NKHC more common than DKA.',types:'T2D (insulin resistance/metabolic), gestational diabetes.',risk:'Obesity, inactivity, age, family history, metabolic syndrome; accounts for 90% of DM.',diagnosis:'Same thresholds as T1D; no autoantibodies.',treatment:'Diet and weight loss (restore insulin sensitivity), oral hypoglycaemic agents; medications for complications (antihypertensives, lipid-lowering drugs).',drugs:'Metformin (first-line), sulfonylureas, α-glucosidase inhibitors, SGLT2 inhibitors, GLP-1 receptor agonists.'}}
  ],
  flash:[['Defining feature of all DM','Hyperglycaemia'],['T1D mechanism','Autoimmune beta-cell destruction → absolute insulin deficiency'],['T2D mechanism','Peripheral insulin resistance → compensatory hyperinsulinaemia'],['Autoantibodies in T2D','ABSENT — their presence suggests T1D'],['DKA pathophysiology','Fat mobilisation → ketone bodies → metabolic acidosis'],['Metabolic syndrome components','Central obesity + insulin resistance + hypertension + dyslipidaemia'],['HbA1c ≥8%','Indicates poor long-term blood glucose control']]},

 // ── Reproductive ─────────────────────────────────────────────────────────────
 {category:'Reproductive', id:'female_menstrual', name:'Female: Menstrual Disorders', tags:['dysmenorrhoea','amenorrhoea','menorrhagia','menstrual','PCOS'], summary:'Menstrual disorders include painful periods, absent periods, and abnormal bleeding patterns.',
  pathologies:[
   {name:'Dysmenorrhoea',fields:{definition:'Uterine pain before or during menstruation. Primary: no pathological cause. Secondary: identifiable cause such as endometriosis.',mechanism:'Primary: elevated prostaglandins → intense uterine contractions and spasm → myometrial ischaemia → pain and systemic effects (nausea, vomiting, diarrhoea, headache). Secondary: caused by an underlying pathology such as endometriosis.',manifestations:'Crampy lower abdominal pain, sharp or dull ache, nausea, vomiting, diarrhoea, headache, back pain.',comparisons:'Primary dysmenorrhoea: adolescent onset, pain first 2–3 days, no other pain. Secondary: onset after pain-free years, may persist throughout cycle, associated dyspareunia.',types:'Primary dysmenorrhoea, secondary dysmenorrhoea.',risk:'Low BMI, smoking, early menarche (<12 years), nulliparity, heavy or long cycles, family history.',diagnosis:'History, pelvic examination, pelvic ultrasound, laparoscopy if secondary suspected.',treatment:'NSAIDs, oral contraceptive pill, exercise (releases endorphins).',drugs:'NSAIDs, combined oral contraceptive pill, GnRH agonists (secondary).'}},
   {name:'Amenorrhoea',fields:{definition:'Primary amenorrhoea: failure to menstruate by age 16. Secondary amenorrhoea: absent menses ≥3 months in previously regular cycles.',mechanism:'Disorders affecting ovarian hormone secretion — PCOS, hypothalamic dysfunction (excess exercise, weight loss), hyperprolactinaemia, and primary ovarian insufficiency.',manifestations:'Absent periods; may include signs of underlying cause (galactorrhoea in hyperprolactinaemia, virilisation in PCOS).',comparisons:'Primary: never menstruated. Secondary: previously menstruated.',types:'Primary amenorrhoea, secondary amenorrhoea.',risk:'PCOS, extreme exercise or weight loss, hyperprolactinaemia, primary ovarian insufficiency.',diagnosis:'History, physical examination, hormone levels (FSH, LH, prolactin, oestrogen), thyroid function, pregnancy test, pelvic ultrasound.',treatment:'Target the underlying cause.',drugs:'OCP, clomiphene, progesterone preparations, GnRH analogues as appropriate.'}},
   {name:'Heavy Menstrual Bleeding (HMB) & Other Abnormal Bleeding',fields:{definition:'Menorrhagia: >80 mL blood loss per cycle. Metrorrhagia: prolonged irregular menstruation. Polymenorrhoea: cycles <21 days. Oligomenorrhoea: infrequent scanty menstruation.',mechanism:'Structural causes (fibroids, polyps), hormonal imbalance, coagulopathy, or endometrial pathology.',manifestations:'Heavy prolonged periods, anaemia, fatigue, pelvic pain.',comparisons:'Menorrhagia is regular but heavy; metrorrhagia is irregular and prolonged.',types:'Menorrhagia, metrorrhagia, polymenorrhoea, oligomenorrhoea, postcoital bleeding, intermenstrual bleeding, postmenopausal bleeding.',risk:'Structural uterine abnormalities, hormonal imbalance, bleeding disorders.',diagnosis:'FBC, hormone levels, pelvic ultrasound, hysteroscopy.',treatment:'Levonorgestrel IUD, tranexamic acid, NSAIDs, combined OCP, oral or injected progesterone.',drugs:'Levonorgestrel IUD, tranexamic acid, progesterone preparations, NSAIDs.'}}
  ],
  flash:[['Primary dysmenorrhoea cause','Elevated prostaglandins → uterine spasm and ischaemia'],['Secondary dysmenorrhoea associated with','Endometriosis (identifiable pathological cause)'],['Primary amenorrhoea definition','Failure to menstruate by age 16'],['Secondary amenorrhoea definition','Absent menses ≥3 months in previously regular cycles'],['Menorrhagia threshold','>80 mL blood loss per cycle'],['Polymenorrhoea','Cycles shorter than 21 days'],['Dysmenorrhoea first-line treatment','NSAIDs and/or oral contraceptive pill']]},

 {category:'Reproductive', id:'female_neoplasms', name:'Female: Endometriosis, PCOS & Uterine Fibroids', tags:['endometriosis','PCOS','fibroids','polycystic','ovarian cyst'], summary:'Endometriosis involves ectopic endometrial tissue; PCOS is a hormonal disorder linked to insulin resistance; uterine fibroids are benign myometrial tumours.',
  pathologies:[
   {name:'Endometriosis',fields:{definition:'Ectopic endometrial tissue (implants) outside the uterine cavity, affecting 5–10% of women; proposed mechanism is retrograde menstruation through open fallopian tubes.',mechanism:'Endometrial fragments enter pelvic cavity → evade body defences → adhere to peritoneum → establish self-sustaining system that cycles with hormones.',manifestations:'Secondary dysmenorrhoea, dyspareunia, pelvic pain, infertility.',comparisons:'Endometriosis is ectopic endometrial tissue causing cyclical inflammation. PCOS is a metabolic-hormonal disorder. Fibroids are benign structural tumours.',types:'Peritoneal, ovarian, deep infiltrating endometriosis.',risk:'Retrograde menstruation, genetic susceptibility.',diagnosis:'Laparoscopy (gold standard), pelvic ultrasound.',treatment:'NSAIDs, hormonal suppression (OCP, GnRH agonists), laparoscopic excision.',drugs:'NSAIDs, OCP, GnRH agonists.'}},
   {name:'PCOS (Polycystic Ovary Syndrome)',fields:{definition:'Hormonal disorder diagnosed when two of three criteria are present: irregular or absent ovulation, hyperandrogenaemia, polycystic ovaries.',mechanism:'Hyperinsulinaemia → decreased SHBG + increased ovarian androgen production + disordered LH/FSH release → hyperandrogenism → anovulation → polycystic ovaries.',manifestations:'Hirsutism, acne, obesity, amenorrhoea, infertility.',comparisons:'PCOS is a metabolic-hormonal disorder; endometriosis is ectopic tissue; fibroids are benign structural tumours.',types:'PCOS.',risk:'Hyperinsulinaemia, insulin resistance, genetic predisposition; associated with obesity and metabolic syndrome.',diagnosis:'Ultrasound (polycystic ovaries), serum androgens, LH/FSH ratio, glucose and insulin levels.',treatment:'Lifestyle modification, metformin (insulin sensitiser), OCP for menstrual regulation, clomiphene for ovulation induction.',drugs:'Metformin, OCP, clomiphene, progesterone analogues, levonorgestrel IUD.'}},
   {name:'Uterine Fibroids (Leiomyomas)',fields:{definition:'Benign tumours of the myometrium — intramural, submucosal, pedunculated, or mixed.',mechanism:'Oestrogen and progesterone dependent proliferation; particularly sensitive to progesterone.',manifestations:'Abnormal uterine bleeding, pelvic pain/pressure, urinary symptoms, infertility (location dependent).',comparisons:'Fibroids are benign structural tumours; endometriosis is ectopic tissue; PCOS is hormonal.',types:'Intramural, submucosal, pedunculated, mixed fibroids.',risk:'Oestrogen/progesterone sensitivity, most common in women of reproductive age.',diagnosis:'Pelvic ultrasound, MRI, hysteroscopy.',treatment:'Watchful waiting, NSAIDs, hormonal therapy (GnRH agonists to shrink fibroids pre-surgery), myomectomy, hysterectomy.',drugs:'NSAIDs, GnRH agonists, levonorgestrel IUD.'}}
  ],
  flash:[['Endometriosis mechanism','Retrograde menstruation → peritoneal implantation → cyclical inflammation'],['PCOS diagnosis criteria','Two of three: irregular ovulation, hyperandrogenaemia, polycystic ovaries'],['PCOS metabolic driver','Hyperinsulinaemia → ovarian androgen excess → anovulation'],['PCOS key symptoms','Hirsutism, acne, obesity, amenorrhoea, infertility'],['Uterine fibroids histology','Benign myometrial smooth muscle tumours (leiomyomas)'],['Endometriosis gold standard diagnosis','Laparoscopy'],['PCOS insulin treatment','Metformin — restores insulin sensitivity']]},

 {category:'Reproductive', id:'female_cancers', name:'Female: Cervical, Uterine & Ovarian Cancer', tags:['cervical cancer','uterine cancer','ovarian cancer','HPV','endometrial'], summary:'Cervical cancer is strongly linked to HPV; uterine cancer is common in post-menopausal women; ovarian cancer is a silent disease with poor prognosis.',
  pathologies:[
   {name:'Cervical Cancer',fields:{definition:'One of the leading causes of cancer death worldwide; most are squamous cell carcinomas; causal relationship with HPV serotypes 16 and 18 via cervical intraepithelial neoplasia (CIN).',mechanism:'HPV infection → CIN (pre-malignant precursor) → invasive carcinoma.',manifestations:'Malodorous vaginal discharge, postcoital bleeding, dyspareunia.',comparisons:'Cervical: HPV-driven, affects younger women, preventable by vaccine and screening; squamous cell type.',types:'Squamous cell carcinoma (most), glandular tissue; FIGO Stages I–IV.',risk:'HPV, smoking, immunodeficiency, multiple sexual partners.',diagnosis:'Pap smear, colposcopy, biopsy, FIGO staging.',treatment:'HPV vaccine (prevention), cone biopsy/trachelectomy (early), hysterectomy, radiotherapy (chemoradiation).',drugs:'HPV vaccine, cisplatin (chemoradiation).'}},
   {name:'Uterine (Endometrial) Cancer',fields:{definition:'Malignant cells in the endometrium; one of the most common cancers in women, particularly post-menopausal aged 50–70.',mechanism:'Risk factors → endometrial hyperplasia → malignant transformation → invasion of myometrium → metastasis via FIGO staging.',manifestations:'Unusual vaginal bleeding after menopause, pelvic pain, vague abdominal pain, nausea, dysuria.',comparisons:'Uterine: oestrogen-driven, post-menopausal, good prognosis if detected early; adenocarcinoma.',types:'Endometrial adenocarcinoma; FIGO Stages IA–IVB.',risk:'Obesity, metabolic syndrome, tamoxifen, unopposed oestrogen, PCOS, HRT, family history, endometrial hyperplasia.',diagnosis:'Transvaginal ultrasound (endometrium >4 mm warrants biopsy), endometrial biopsy, histopathology, CT/MRI staging.',treatment:'Hysterectomy (primary), progestin therapy, chemotherapy, radiotherapy.',drugs:'Carboplatin, cisplatin, paclitaxel, docetaxel, doxorubicin, progestin.'}},
   {name:'Ovarian Cancer',fields:{definition:'Top gynaecological malignancy; most arise from the epithelial surface; silent disease with poor prognosis; diagnosed mainly in postmenopausal women aged 50–80.',mechanism:'Often advanced at diagnosis due to vague symptoms; spreads via peritoneal seeding to omentum, liver, diaphragm, stomach, colon.',manifestations:'Vague and non-specific — abdominal bloating, pelvic pain, bowel/urinary complaints; often asymptomatic until advanced.',comparisons:'Ovarian: silent, poor prognosis, epithelial origin, BRCA1/BRCA2 risk genes.',types:'Epithelial (most common), germ cell, stromal; FIGO Stages I–IV.',risk:'Advancing age, family history, BRCA1/BRCA2 mutations, increased ovulatory cycles, endometriosis.',diagnosis:'Pelvic/transvaginal ultrasound, CA-125 tumour marker, CT/MRI, laparotomy for definitive staging.',treatment:'Cytoreductive surgery (debulking), oophorectomy, chemotherapy (platinum-based).',drugs:'Platinum-based agents, paclitaxel, PARP inhibitors (BRCA-positive).'}}
  ],
  flash:[['Cervical cancer HPV types','Serotypes 16 and 18'],['CIN definition','Cervical intraepithelial neoplasia — pre-malignant precursor'],['Uterine cancer most common type','Endometrial adenocarcinoma'],['Uterine cancer key risk factor','Obesity and unopposed oestrogen'],['Ovarian cancer prognosis','Poor — often silent until advanced stage'],['Ovarian cancer genetic risk','BRCA1 and BRCA2 mutations'],['Cervical cancer prevention','HPV vaccination and regular Pap smear screening']]},

 {category:'Reproductive', id:'male_penis', name:'Male: Disorders of the Penis', tags:['phimosis','paraphimosis','peyronie','erectile dysfunction','priapism'], summary:'Penis disorders include phimosis, paraphimosis, Peyronie disease, erectile dysfunction, and priapism.',
  pathologies:[
   {name:'Phimosis & Paraphimosis',fields:{definition:'Phimosis: inability to retract the foreskin — normal in infancy. Paraphimosis: inability to replace the foreskin once retracted — acute medical emergency.',mechanism:'Phimosis: tightness from poor hygiene, infection, inflammation, or trauma. Paraphimosis: failure of foreskin to return → vascular engorgement and oedema.',manifestations:'Phimosis: itching, pain, discomfort, bleeding on intercourse, smegma. Paraphimosis: painful oedematous glans.',comparisons:'Phimosis = cannot retract foreskin; paraphimosis = cannot return retracted foreskin.',types:'Phimosis, paraphimosis.',risk:'Recurrent infections, poor hygiene, diabetes (phimosis).',diagnosis:'Clinical examination.',treatment:'Phimosis: hygiene changes, antimicrobial therapy, possibly circumcision. Paraphimosis: urgent manual reduction.',drugs:'Topical corticosteroids (phimosis), topical anaesthetics (paraphimosis reduction).'}},
   {name:'Peyronie Disease',fields:{definition:'Slow development of fibrous plaques in the tunica albuginea causing lateral penile curvature during erection (bent nail syndrome).',mechanism:'Fibrous plaque formation in tunica albuginea → restricts expansion on one side during erection → curvature.',manifestations:'Painful erections, lateral curvature, difficulty with intercourse in middle-aged men.',comparisons:'Peyronie is structural (fibrous plaque); erectile dysfunction is functional.',types:'Peyronie disease.',risk:'Middle age, Dupuytren contracture, diabetes, keloid scarring tendency.',diagnosis:'Clinical examination.',treatment:'Conservative management, collagenase injections, surgery in severe cases.',drugs:'Collagenase clostridium histolyticum.'}},
   {name:'Erectile Dysfunction (ED)',fields:{definition:'Sexual arousal disorder — inability to achieve or maintain erection.',mechanism:'Psychogenic: performance anxiety, stress, psychiatric conditions, drug side effects. Organic: neurogenic (Parkinson, stroke, spinal injury), vascular (hypertension, atherosclerosis, diabetes), hormonal (hypogonadism).',manifestations:'Inability to achieve erection, reduced libido, early ejaculation.',comparisons:'Psychogenic causes include anxiety, stress, psychiatric conditions; organic causes include neurological, vascular, and hormonal factors.',types:'Psychogenic ED, organic ED, combined.',risk:'Age, hypertension, smoking, diabetes, drug/alcohol abuse, hyperlipidaemia, SSRIs, statins, beta-blockers.',diagnosis:'Duplex ultrasound, hormonal blood tests (testosterone, LH, prolactin), psychological testing.',treatment:'Phosphodiesterase-5 inhibitors, hormonal replacement, vasodilator injection, psychotherapy, surgery.',drugs:'PDE-5 inhibitors (sildenafil, tadalafil), testosterone replacement, vasodilators.'}},
   {name:'Priapism',fields:{definition:'Persistent penile erection unrelated to sexual stimulation, lasting 30 minutes to 3 hours — a urological emergency.',mechanism:'Imbalance between arterial inflow and venous outflow — low flow (ischaemic, sickle cell anaemia, neurological disease, cancer) or high flow (non-ischaemic, from trauma).',manifestations:'Persistent painful erection, corpus cavernosum engorgement.',comparisons:'Low-flow priapism is ischaemic and more dangerous; high-flow is non-ischaemic from trauma.',types:'Low-flow/ischaemic, high-flow/non-ischaemic priapism.',risk:'Sickle cell anaemia, neurological disease, cancer, trauma.',diagnosis:'Clinical diagnosis; blood gases from corpus cavernosum aspirate to distinguish type.',treatment:'Ice packs, perineal compression, adrenergic agonists (arteriolar vasoconstriction), aspiration of blood from corpus cavernosum.',drugs:'Adrenergic agonists (phenylephrine), aspiration.'}}
  ],
  flash:[['Phimosis','Cannot retract foreskin — normal in infancy'],['Paraphimosis emergency','Cannot return retracted foreskin — acute medical emergency'],['Peyronie disease cause','Fibrous plaque in tunica albuginea → lateral penile curvature'],['ED first-line drug class','Phosphodiesterase-5 inhibitors (sildenafil, tadalafil)'],['Priapism low-flow cause','Sickle cell anaemia, neurological disease, or cancer'],['Priapism high-flow cause','Trauma to perineum or genitalia']]},

 {category:'Reproductive', id:'male_scrotal', name:'Male: Disorders of the Scrotum & Testes', tags:['cryptorchidism','varicocele','hydrocele','spermatocele','testicular torsion','orchitis'], summary:'Scrotal and testicular disorders include undescended testes, varicocele, hydrocele, spermatocele, testicular torsion, and orchitis/epididymitis.',
  pathologies:[
   {name:'Cryptorchidism (Undescended Testes)',fields:{definition:'Failure of one or more testes to descend from the abdominal cavity into the scrotum — common in premature males; testes usually descend by 1 year of age.',mechanism:'Failure of normal testicular descent — hormonal, environmental, or genetic factors.',manifestations:'Absent testis in scrotum; risk of infertility and cancer.',comparisons:'Cryptorchidism — failure of descent; hydrocele — fluid accumulation; varicocele — dilated veins.',types:'Cryptorchidism.',risk:'Low birth weight, prematurity, sexual development disorders.',diagnosis:'Physical examination.',treatment:'Hormone therapy (GnRH, LHRH, hCG) or orchiopexy (orchioplasty).',drugs:'GnRH, LHRH, hCG.'}},
   {name:'Varicocele',fields:{definition:'Dilation of the testicular vein (pampiniform plexus); most common cause of scrotal enlargement in young adults and the leading cause of male infertility.',mechanism:'Inadequate or absent valves in pampiniform plexus veins → blood pools → varicose veins → increased scrotal temperature → impaired spermatogenesis.',manifestations:'Mostly asymptomatic; sometimes aching scrotal pain; reduced testicular function.',comparisons:'Varicocele (dilated veins, infertility) vs hydrocele (fluid, mostly asymptomatic).',types:'Varicocele.',risk:'Adolescence onset; valve incompetence in pampiniform plexus.',diagnosis:'Clinical (bag of worms feel), scrotal ultrasound.',treatment:'Varicocelectomy.',drugs:'None pharmacological.'}},
   {name:'Hydrocele',fields:{definition:'Scrotal swelling from fluid accumulation within the tunica vaginalis.',mechanism:'Idiopathic, or from venous/lymphatic obstruction (trauma, infection, torsion, surgery); chronic hydrocele (>40 years) = imbalance between fluid secretion and reabsorption.',manifestations:'Painless scrotal swelling, usually asymptomatic.',comparisons:'Hydrocele (fluid, asymptomatic) vs varicocele (dilated veins, infertility risk).',types:'Hydrocele.',risk:'Idiopathic; trauma, infection, torsion, surgery.',diagnosis:'Transillumination, ultrasound.',treatment:'Scrotal elevation; aspiration or surgery if symptomatic.',drugs:'Analgesia.'}},
   {name:'Spermatocele',fields:{definition:'Epididymal cyst (painless diverticulum) containing milky sperm-containing fluid.',mechanism:'Outpouching of epididymis.',manifestations:'Typically asymptomatic, soft scrotal lump discovered on examination.',comparisons:'Spermatocele (epididymal cyst, asymptomatic) vs hydrocele (fluid in tunica vaginalis).',types:'Spermatocele.',risk:'Spontaneous outpouching.',diagnosis:'Ultrasound.',treatment:'Analgesia; spermatocelectomy if needed.',drugs:'Analgesia.'}},
   {name:'Testicular Torsion',fields:{definition:'Rotation of the testis within the scrotum → ischaemia → necrosis if untreated. Urological emergency.',mechanism:'Twisting interrupts blood supply → testicular ischaemia → necrosis.',manifestations:'Sudden severe scrotal/testicular pain, nausea, vomiting.',comparisons:'Testicular torsion is a urological emergency; orchitis and epididymitis are infectious/inflammatory.',types:'Testicular torsion.',risk:'Bell-clapper deformity.',diagnosis:'Clinical urgency — surgical exploration; Doppler ultrasound for blood flow.',treatment:'Manual or surgical detorsion (emergency within 6 hours).',drugs:'Analgesia; surgical intervention is definitive.'}},
   {name:'Orchitis & Epididymitis',fields:{definition:'Orchitis: inflammation of the testis/testes. Epididymitis: inflammation of the epididymis.',mechanism:'Infectious — usually ascending from UTI → scrotal pain and swelling.',manifestations:'Scrotal pain and swelling, fever.',comparisons:'Infectious/inflammatory — orchitis/epididymitis vs emergency — testicular torsion.',types:'Orchitis, epididymitis.',risk:'Ascending UTI, STI pathogens.',diagnosis:'Ultrasound, urinalysis, swabs.',treatment:'Scrotal elevation, antibiotics, analgesia.',drugs:'Antibiotics, analgesics.'}}
  ],
  flash:[['Cryptorchidism','Undescended testis — risks infertility and cancer'],['Varicocele side','Usually left testis — commonest cause of male infertility'],['Varicocele mechanism','Valve incompetence → blood pools → heat → impairs spermatogenesis'],['Hydrocele','Fluid in tunica vaginalis — often idiopathic, usually asymptomatic'],['Spermatocele contents','Milky sperm-containing fluid — epididymal cyst'],['Testicular torsion','Urological emergency — surgical detorsion needed within 6 hours'],['Cryptorchidism treatment','Orchiopexy or hormone therapy (GnRH/hCG)']]},

 {category:'Reproductive', id:'male_prostate', name:'Male: Prostatitis, BPH & Prostate Cancer', tags:['prostate','BPH','prostate cancer','prostatitis','PSA','5-DHT'], summary:'Prostate disorders include prostatitis (inflammation), BPH (most common prostate condition), and prostate cancer (most common cancer in men).',
  pathologies:[

// ─── STATE & INDEX ────────────────────────────────────────────────────────────
const byId = Object.fromEntries(topics.map(t=>[t.id,t]));
let current = 'tbi';
let activeCat = 'CNS';

const CAT_CONFIG = {
  CNS:          {color:'#312e81'},
  CVS:          {color:'#7f1d1d'},
  Renal:        {color:'#064e3b'},
  Inflammation: {color:'#7c2d12'},
  Blood:        {color:'#881337'},
  Respiratory:  {color:'#14532d'},
  GI:           {color:'#78350f'},
  Endocrine:    {color:'#0e7490'},
  Reproductive: {color:'#9d174d'},
  MSK:          {color:'#92400e'}
};

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function renderTabs(){
  const b = document.getElementById('tabs'); b.innerHTML='';
  Object.keys(CAT_CONFIG).forEach(c=>{
    const t = document.createElement('button');
    t.className='tab'; t.textContent=c; t.dataset.cat=c;
    t.style.cssText=`background:${CAT_CONFIG[c].color};border:none;`;
    if(c===activeCat){t.style.outline='3px solid #fbbf24';t.style.boxShadow='0 0 0 4px rgba(251,191,36,.18)';}
    t.onclick=()=>{activeCat=c; current=topics.find(x=>x.category===c)?.id||current; renderAll();};
    b.appendChild(t);
  });
}

function renderTopics(filter=''){
  const box = document.getElementById('topics'); box.innerHTML='';
  topics.filter(t=>t.category===activeCat && (
    t.name.toLowerCase().includes(filter.toLowerCase()) ||
    t.tags.some(x=>x.toLowerCase().includes(filter.toLowerCase()))
  )).forEach(t=>{
    const b = document.createElement('button');
    b.className='topic'+(t.id===current?' active':'');
    b.textContent=t.name;
    b.onclick=()=>{current=t.id; renderAll();};
    box.appendChild(b);
  });
}

const FIELD_LABELS = {
  definition:'Definition',
  mechanism:'Mechanism',
  manifestations:'Clinical Manifestations',
  comparisons:'Comparisons & Distinctions',
  types:'Types & Classification',
  risk:'Risk Factors',
  diagnosis:'Diagnosis',
  treatment:'Treatment & Management',
  drugs:'Drugs'
};

const FIELD_COLORS = {
  definition:'#f59e0b',
  mechanism:'#60a5fa',
  manifestations:'#22c55e',
  comparisons:'#a78bfa',
  types:'#818cf8',
  risk:'#f97316',
  diagnosis:'#38bdf8',
  treatment:'#34d399',
  drugs:'#fb7185'
};

function renderContent(){
  const t = byId[current];
  const hasMultiple = t.pathologies.length > 1;

  let html = `<h2>${t.name}</h2><p class="muted">${t.summary}</p>`;
  if(t.tags.length) html += '<div style="margin-bottom:14px">'+t.tags.map(tag=>`<span class="pill">${tag}</span>`).join('')+'</div>';

  t.pathologies.forEach(path => {
    if(hasMultiple) html += `<div class="path-block"><h4>📋 ${path.name}</h4>`;
    html += '<div class="field-grid">';
    Object.entries(path.fields).forEach(([key, val])=>{
      html += `<div class="field-item"><h5 style="color:${FIELD_COLORS[key]||'#aaa'}">${FIELD_LABELS[key]||key}</h5><p>${val}</p></div>`;
    });
    html += '</div>';
    if(hasMultiple) html += '</div>';
  });

  // Flashcards (collapsible)
  if(t.flash && t.flash.length){
    html += `<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700;color:#a5b4fc;padding:8px 0">▸ Key Flashcards (${t.flash.length})</summary>`;
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">';
    t.flash.forEach(([q,a])=>{
      html += `<div style="background:rgba(255,255,255,.05);border-radius:8px;padding:10px"><p style="margin:0 0 4px;font-weight:600;font-size:13px">${q}</p><p style="margin:0;color:var(--muted);font-size:12px">${a}</p></div>`;
    });
    html += '</div></details>';
  }

  document.getElementById('content').innerHTML = html;
}

function renderAll(){
  document.body.setAttribute('data-cat', activeCat);
  renderTabs();
  renderTopics(document.getElementById('navSearch').value);
  renderContent();
}

// ─── GLOBAL SEARCH ────────────────────────────────────────────────────────────
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function globalSearch(query){
  const box = document.getElementById('globalResults');
  if(!query.trim()){box.style.display='none'; return;}
  const re = new RegExp(escRe(query.trim()), 'gi');
  const hits = [];

  topics.forEach(t=>{
    // Search name, tags
    let matchContext = '';
    if(re.test(t.name)){matchContext = 'Topic name';}
    re.lastIndex=0;
    if(!matchContext && t.tags.some(tag=>{re.lastIndex=0;return re.test(tag);})){matchContext='Tag: '+t.tags.find(tag=>{re.lastIndex=0;return re.test(tag);}); }
    re.lastIndex=0;

    // Search within pathologies fields
    if(!matchContext){
      outer:for(const path of t.pathologies){
        for(const [key, val] of Object.entries(path.fields)){
          re.lastIndex=0;
          if(re.test(val)){
            // Extract snippet
            const idx = val.search(new RegExp(escRe(query.trim()),'i'));
            const start = Math.max(0,idx-40);
            const snippet = (start>0?'…':'')+val.slice(start,start+100)+(val.length>start+100?'…':'');
            matchContext = `${FIELD_LABELS[key]||key}${path.name?' — '+path.name:''}: ${snippet}`;
            break outer;
          }
        }
      }
    }
    re.lastIndex=0;
    // Search flash
    if(!matchContext){
      for(const [fq, fa] of (t.flash||[])){
        re.lastIndex=0;
        if(re.test(fq)||re.test(fa)){matchContext=`Flashcard: ${fq}`; break;}
      }
    }
    if(matchContext){hits.push({t, matchContext});}
  });

  if(!hits.length){
    box.innerHTML='<div class="no-res">No results found</div>';
    box.style.display='block'; return;
  }
  box.innerHTML = hits.slice(0,12).map(({t,matchContext})=>`
    <div class="gr-item" data-id="${t.id}" data-cat="${t.category}">
      <div class="gr-title">${t.name}</div>
      <div class="gr-cat">${t.category}</div>
      <div class="gr-match">${matchContext.replace(/<[^>]*>/g,'').slice(0,120)}</div>
    </div>`).join('');

  box.querySelectorAll('.gr-item').forEach(el=>{
    el.onclick=()=>{
      activeCat = el.dataset.cat;
      current = el.dataset.id;
      renderAll();
      document.getElementById('globalSearch').value='';
      box.style.display='none';
    };
  });
  box.style.display='block';
}

document.getElementById('globalSearch').oninput = e => globalSearch(e.target.value);
document.getElementById('globalSearch').onkeydown = e => {if(e.key==='Escape'){document.getElementById('globalResults').style.display='none';}};
document.addEventListener('click', e=>{
  if(!e.target.closest('.global-search-wrap')) document.getElementById('globalResults').style.display='none';
});

document.getElementById('navSearch').oninput = e => renderTopics(e.target.value);

renderAll();
</script>
